<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BYOB CAPTURE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #040404;
  --surf:   #0a0a0a;
  --b1:     #181818;
  --b2:     #252525;
  --text:   #c0c0c0;
  --dim:    #3a3a3a;
  --green:  #00FF7F;
  --red:    #FF3030;
  --amber:  #FFAA00;
  --blue:   #00AAFF;
  --purple: #BB77FF;
  --gdim:   rgba(0,255,127,.08);
}
html, body {
  background: var(--bg); color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  height: 100%; min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* ── LAYOUT ────────────────────────────────────────── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ── HEADER ────────────────────────────────────────── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--b2);
  position: sticky; top: 0; background: var(--bg); z-index: 100;
  flex-wrap: wrap; gap: 8px;
}
.logo { font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: 6px; color: #fff; }
.logo em { color: var(--green); font-style: normal; }
.hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode-pill {
  font-size: 8px; letter-spacing: 2px; padding: 4px 10px;
  border: 1px solid var(--b2); color: var(--dim);
  border-radius: 20px; cursor: pointer; user-select: none;
  transition: all .15s; touch-action: manipulation;
  font-family: 'IBM Plex Mono', monospace;
}
.mode-pill.active { border-color: var(--purple); color: var(--purple); }
.mode-pill:hover  { border-color: var(--text);   color: var(--text); }

/* ── MAIN CAPTURE ZONE ─────────────────────────────── */
#capture-zone {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 36px 20px 24px;
  gap: 0;
}

.rec-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 32px; border-radius: 50px;
  border: 2px solid var(--b2); background: var(--surf);
  cursor: pointer; touch-action: manipulation; user-select: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px; letter-spacing: 4px; color: var(--text);
  transition: border-color .15s, background .15s, color .15s, transform .08s;
}
.rec-btn:active { transform: scale(0.97); }
.rec-dot {
  width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
  background: var(--dim);
  transform: scale(calc(1 + var(--pulse, 0)));
  transition: background .15s;
}
.rec-btn[data-state="idle"]      { border-color: var(--b2); color: var(--text); }
.rec-btn[data-state="waiting"]   { border-color: var(--amber); color: var(--amber); }
.rec-btn[data-state="waiting"] .rec-dot   { background: var(--amber); animation: spin-fade .6s infinite alternate; }
.rec-btn[data-state="recording"] { border-color: var(--red); color: var(--red); background: rgba(255,48,48,.06); }
.rec-btn[data-state="recording"] .rec-dot { background: var(--red); }

@keyframes spin-fade { to { opacity: .3; } }

/* Status line */
.status-line {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  margin-top: 18px;
}
.status-main {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; letter-spacing: 4px; color: var(--dim);
  min-height: 18px; text-align: center;
  transition: color .2s;
}
.status-timer {
  font-family: 'Share Tech Mono', monospace;
  font-size: 22px; letter-spacing: 4px; color: #fff;
  min-height: 30px; text-align: center;
}
.status-sub {
  font-size: 8px; letter-spacing: 2px; color: var(--dim);
  text-align: center; line-height: 1.9; max-width: 320px;
  min-height: 30px;
}

/* Source badge */
.source-badge {
  display: none; align-items: center; gap: 7px;
  margin-top: 10px;
  font-size: 8px; letter-spacing: 2px; color: var(--green);
  border: 1px solid rgba(0,255,127,.25); padding: 4px 12px; border-radius: 20px;
}
.source-badge.show { display: flex; }
.src-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.eject-btn {
  background: none; border: none; color: var(--dim); font-size: 10px;
  cursor: pointer; padding: 0 0 0 6px; font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 1px; touch-action: manipulation;
}
.eject-btn:hover { color: var(--red); }

/* Key config row */
.key-config-row {
  display: flex; align-items: center; gap: 8px; margin-top: 14px;
  font-size: 8px; color: var(--dim); letter-spacing: 2px;
}
.change-key-btn {
  font-size: 8px; letter-spacing: 1px; color: var(--dim);
  border: 1px solid var(--b2); padding: 3px 8px; border-radius: 3px;
  cursor: pointer; background: none; font-family: 'IBM Plex Mono', monospace;
  touch-action: manipulation; transition: border-color .12s, color .12s;
}
.change-key-btn:hover { border-color: var(--green); color: var(--green); }

.tbtn { padding: 7px 12px; border: 1px solid var(--b2); background: none; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 2px; cursor: pointer; touch-action: manipulation; border-radius: 1px; transition: all .1s; white-space: nowrap; }
.tbtn:active { transform: scale(.94); }
.tbtn.on { background: var(--green); border-color: var(--green); color: #000; }

/* ── CLIPS ──────────────────────────────────────────── */
#clips-section { padding: 10px 16px 32px; }
.clips-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-bottom: 6px; border-top: 1px solid var(--b1); padding-top: 10px; }
.clips-title { font-size: 8px; letter-spacing: 4px; color: var(--dim); }
.clips-acts { display: flex; gap: 6px; }
.sm-btn { padding: 4px 10px; border: 1px solid var(--b2); background: none; color: var(--dim); font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 1px; cursor: pointer; border-radius: 1px; touch-action: manipulation; }
.sm-btn:hover { border-color: var(--green); color: var(--green); }

.clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 5px; }
.clip { border: 1px solid var(--b2); background: var(--surf); border-radius: 2px; overflow: hidden; }
.clip.flash { animation: flash .5s; }
@keyframes flash { 0%{border-color:var(--green);box-shadow:0 0 10px var(--green);}100%{border-color:var(--b2);box-shadow:none;} }
.clip-wv { height: 40px; background: var(--bg); position: relative; overflow: hidden; }
.clip-wv canvas { width: 100%; height: 100%; display: block; }
.clip-pb { position: absolute; top:0; left:0; bottom:0; width:0%; background: rgba(0,255,127,.15); pointer-events: none; }
.clip-body { padding: 5px 7px; }
.clip-name { font-size: 8px; letter-spacing: 1px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; cursor: text; border-bottom: 1px dotted var(--b2); }
.clip-name:hover { border-bottom-color: var(--green); color: #fff; }
.clip-meta { font-size: 7px; color: var(--dim); letter-spacing: 1px; }
.clip-foot { display: flex; gap: 3px; padding: 3px 5px; border-top: 1px solid var(--b1); }
.c-btn { flex:1; padding: 4px 2px; border: 1px solid var(--b2); background: none; color: var(--dim); font-family: 'IBM Plex Mono', monospace; font-size: 8px; cursor: pointer; border-radius: 1px; touch-action: manipulation; transition: all .1s; }
.c-btn:hover { border-color: var(--green); color: var(--green); }
.c-btn.playing { background: var(--green); border-color: var(--green); color: #000; }
.c-btn.dl:hover  { border-color: var(--blue); color: var(--blue); }
.c-btn.del:hover { border-color: var(--red);  color: var(--red); }
.no-clips { grid-column:1/-1; text-align:center; padding:24px; font-size:9px; letter-spacing:2px; color:var(--dim); border:1px dashed var(--b2); border-radius:2px; }

/* ── KEY MODAL ──────────────────────────────────────── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:999; align-items:center; justify-content:center; }
.modal-bg.show { display:flex; }
.modal-box { background:#0d0d0d; border:1px solid var(--b2); padding:28px 32px; max-width:300px; width:90%; text-align:center; }
.modal-title { font-size:10px; letter-spacing:4px; color:var(--green); margin-bottom:8px; }
.modal-sub   { font-size:8px; color:var(--dim); letter-spacing:1px; line-height:2; margin-bottom:18px; }
.big-key-display { width:70px; height:70px; border:2px solid var(--green); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Share Tech Mono',monospace; font-size:28px; color:var(--green); margin:0 auto 18px; animation:kp 1s infinite alternate; }
@keyframes kp { to { border-color:#002a14; color:#002a14; } }
.modal-cancel { padding:6px 16px; border:1px solid var(--b2); background:none; color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:9px; cursor:pointer; border-radius:1px; }

/* ── EDITOR PANEL ──────────────────────────────────── */
#editor-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 800;
  background: #080808; border-top: 1px solid var(--purple);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.3,1);
  padding-bottom: env(safe-area-inset-bottom);
}
#editor-panel.open { transform: translateY(0); }
.ed-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-bottom: 1px solid var(--b1);
}
.ed-title { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 4px; color: var(--purple); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.ed-close { background: none; border: 1px solid var(--b2); color: var(--dim); font-size: 9px; letter-spacing: 1px; padding: 4px 10px; cursor: pointer; font-family: 'IBM Plex Mono', monospace; }
.ed-close:hover { border-color: var(--red); color: var(--red); }

.ed-wv-wrap {
  position: relative; margin: 10px 14px 0; height: 100px;
  background: var(--surf); border: 1px solid var(--b1);
  cursor: crosshair; overflow: hidden; border-radius: 2px; touch-action: none;
}
#ed-canvas { width: 100%; height: 100%; display: block; }
.ed-region {
  position: absolute; top: 0; bottom: 0;
  background: rgba(187,119,255,.15);
  border-left: 2px solid var(--purple);
  border-right: 2px solid var(--purple);
  pointer-events: none;
}
.ed-handle {
  position: absolute; top: 0; bottom: 0; width: 20px;
  cursor: ew-resize; z-index: 2; touch-action: none;
  display: flex; align-items: center; justify-content: center;
}
.ed-handle::after {
  content: ''; display: block; width: 3px; height: 60%;
  background: var(--purple); border-radius: 2px;
}
#ed-playhead {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: rgba(255,255,255,.7); pointer-events: none; left: 0;
}

.ed-times {
  display: flex; justify-content: space-between;
  padding: 4px 14px; font-size: 8px; letter-spacing: 2px; color: var(--dim);
}
.ed-transport {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 14px; border-top: 1px solid var(--b1);
}
.ed-dur { font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #fff; min-width: 80px; }
.ed-cut-btn {
  padding: 9px 22px; border: 2px solid var(--purple); background: none;
  color: var(--purple); font-family: 'Share Tech Mono', monospace;
  font-size: 13px; letter-spacing: 4px; cursor: pointer; transition: all .1s;
}
.ed-cut-btn:hover { background: var(--purple); color: #000; }
.loop-btn { padding: 7px 12px; border: 1px solid var(--b2); background: none; color: var(--dim); font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 2px; cursor: pointer; }
.loop-btn.on { background: var(--amber); border-color: var(--amber); color: #000; }

/* ── SUPABASE AUTH HEADER ───────────────────────────── */
.auth-pill {
  font-size: 8px; letter-spacing: 2px; padding: 4px 10px;
  border: 1px solid var(--b2); color: var(--dim); border-radius: 20px;
  cursor: pointer; background: none; font-family: 'IBM Plex Mono', monospace;
  touch-action: manipulation; transition: all .15s;
}
.auth-pill.signed-in { border-color: var(--green); color: var(--green); }
.auth-pill:hover { border-color: var(--text); color: var(--text); }
#auth-form {
  display: none; position: fixed; top: 44px; right: 10px; z-index: 900;
  background: #0d0d0d; border: 1px solid var(--b2); padding: 16px;
  width: 240px; gap: 8px; flex-direction: column;
}
#auth-form.show { display: flex; }
#auth-form input {
  background: var(--surf); border: 1px solid var(--b2); color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px;
  padding: 7px 10px; outline: none; border-radius: 1px;
}
#auth-form input:focus { border-color: var(--green); }
.auth-submit {
  padding: 8px; background: var(--green); border: none; color: #000;
  font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 3px;
  cursor: pointer;
}
#auth-err { font-size: 8px; color: var(--red); letter-spacing: 1px; display: none; }

/* ── TOAST ──────────────────────────────────────────── */
#toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(12px); background:#111; border:1px solid var(--b2); color:var(--text); font-size:9px; letter-spacing:2px; padding:6px 14px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:9999; white-space:nowrap; border-radius:2px; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<header>
  <div class="logo">BY<em>O</em>B <span style="color:var(--dim);font-size:9px;letter-spacing:3px;">CAPTURE</span></div>
  <div class="hdr-right">
    <button class="mode-pill active" id="live-pill">TAB AUDIO</button>
    <button class="mode-pill" id="mic-pill">🎙 MIC</button>
    <button class="auth-pill" id="auth-pill" onclick="toggleAuthForm()">BYOB ↗</button>
  </div>
</header>

<!-- AUTH FORM -->
<div id="auth-form">
  <div style="font-size:8px;letter-spacing:3px;color:var(--green);margin-bottom:4px;">BYOB SIGN IN</div>
  <input type="email"    id="auth-email"    placeholder="email"/>
  <input type="password" id="auth-password" placeholder="password"/>
  <div id="auth-err"></div>
  <button class="auth-submit" onclick="doAuth()">SIGN IN →</button>
</div>

<!-- EDITOR PANEL -->
<div id="editor-panel">
  <div class="ed-bar">
    <div class="ed-title" id="ed-clip-name">—</div>
    <button class="ed-close" onclick="closeEditor()">✕ CLOSE</button>
  </div>
  <div class="ed-wv-wrap" id="ed-wv-wrap">
    <canvas id="ed-canvas"></canvas>
    <div class="ed-region"  id="ed-region"></div>
    <div class="ed-handle"  id="ed-handle-l" style="left:0"></div>
    <div class="ed-handle"  id="ed-handle-r" style="right:0"></div>
    <div id="ed-playhead"></div>
  </div>
  <div class="ed-times">
    <span id="ed-start-label">0:00.0</span>
    <span id="ed-sel-dur">—</span>
    <span id="ed-end-label">0:00.0</span>
  </div>
  <div class="ed-transport">
    <div class="ed-dur" id="ed-pos">0:00.0</div>
    <button class="tbtn" id="ed-play-btn" onclick="edPlayToggle()">▶ PREVIEW</button>
    <button class="loop-btn" id="ed-loop-btn" onclick="edToggleLoop()">⟳ LOOP</button>
    <button class="ed-cut-btn" onclick="edCut()">✂ CUT</button>
  </div>
</div>

<!-- ═══ LIVE CAPTURE ZONE ═══ -->
<div id="capture-zone">

  <button class="rec-btn" id="rec-btn" data-state="idle">
    <span class="rec-dot" id="rec-dot"></span>
    <span id="rec-label">START CAPTURE</span>
  </button>

  <div class="status-line">
    <div class="status-main"  id="status-main">PRESS TO BEGIN</div>
    <div class="status-timer" id="status-timer"></div>
    <div class="status-sub" id="status-sub"></div>
  </div>

  <div class="source-badge" id="source-badge">
    <div class="src-dot"></div>
    <span id="source-label">AUDIO SOURCE LIVE</span>
    <button class="eject-btn" id="eject-btn">✕ eject</button>
  </div>

  <div id="mic-select-row" style="display:none;flex-direction:column;align-items:center;gap:6px;margin-top:10px;">
    <select id="mic-select" style="background:var(--surf);border:1px solid var(--b2);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1px;padding:6px 10px;max-width:260px;width:100%;border-radius:1px;">
      <option value="">— select input device —</option>
    </select>
  </div>

  <div class="key-config-row">
    SHORTCUT KEY
    <button class="change-key-btn" id="change-key-btn">
      CHANGE · <span id="key-label-inline">R</span>
    </button>
  </div>

</div>

<!-- CLIPS -->
<div id="clips-section">
  <div class="clips-hdr">
    <div class="clips-title">CAPTURED CLIPS</div>
    <div class="clips-acts">
      <button class="sm-btn" id="load-files-btn">+ FILES</button>
      <button class="sm-btn" id="clear-btn">✕ CLEAR</button>
      <input type="file" id="load-files-inp" multiple accept="audio/*" style="display:none">
    </div>
  </div>
  <div class="clips-grid" id="clips-grid">
    <div class="no-clips" id="no-clips">— NO CLIPS YET —</div>
  </div>
</div>

</div><!-- .app -->

<!-- KEY MODAL -->
<div class="modal-bg" id="key-modal">
  <div class="modal-box">
    <div class="modal-title">SET SHORTCUT KEY</div>
    <div class="modal-sub">Press any key. It will trigger capture<br>in both live and screen-rec modes.</div>
    <div class="big-key-display" id="key-display">?</div>
    <button class="modal-cancel" id="key-cancel-btn">CANCEL</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  BYOB CAPTURE
//  Shortcut key → getDisplayMedia → video tracks stopped instantly
//  → audio-only stream → record → clip
// ═══════════════════════════════════════════════════════════════

// ── State ─────────────────────────────────────────────────────
let audioCtx    = null;
let clips       = [];
let shortcutKey = 'r';       // default
let settingKey  = false;
let mode        = 'live';    // 'live' | 'mic'

// Live capture
let liveStream     = null;   // audio-only MediaStream (for the recorder)
let liveFullStream = null;   // original getDisplayMedia stream (video disabled, kept alive)
let liveRec     = null;
let liveChunks  = [];
let liveState   = 'idle'; // 'idle' | 'waiting' | 'ready' | 'recording'
let liveTimerInt = null;
let liveStart    = 0;

// ── Audio ─────────────────────────────────────────────────────
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, dur = 2600) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Mode tabs ─────────────────────────────────────────────────
document.getElementById('live-pill').addEventListener('click', () => setMode('live'));
document.getElementById('mic-pill').addEventListener('click',  () => setMode('mic'));

function setMode(m) {
  mode = m;
  document.getElementById('live-pill').classList.toggle('active', m === 'live');
  document.getElementById('mic-pill').classList.toggle('active',  m === 'mic');
  document.getElementById('mic-select-row').style.display = m === 'mic' ? 'flex' : 'none';
  const msgs = {
    live: 'Press key → pick a Chrome Tab → check "Share tab audio".\nDoes not work on Safari or Firefox.',
    mic:  'Capture from any mic or audio interface. Select your device below.',
  };
  document.getElementById('status-sub').textContent = msgs[m] || '';
  if (m === 'mic') populateMicDevices();
  else if (m === 'live') { stopRecording(false); ejectLiveStream(); }
}

async function populateMicDevices() {
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop()));
    const devices = await navigator.mediaDevices.enumerateDevices();
    const sel = document.getElementById('mic-select');
    sel.innerHTML = '<option value="">— select input —</option>';
    devices.filter(d => d.kind === 'audioinput').forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.deviceId; opt.textContent = d.label || `Input ${d.deviceId.slice(0,6)}`;
      sel.appendChild(opt);
    });
  } catch(e) { toast('MIC PERMISSION DENIED'); }
}

// ── Key label ─────────────────────────────────────────────────
function kLabel(k) {
  if (k === ' ')         return 'SPC';
  if (k === 'Escape')    return 'ESC';
  if (k === 'Enter')     return 'ENT';
  if (k === 'Backspace') return '⌫';
  if (k === 'Tab')       return 'TAB';
  return k.length === 1 ? k.toUpperCase() : k;
}

function updateKeyUI() {
  const l = kLabel(shortcutKey);
  document.getElementById('key-label-inline').textContent  = l;
  document.getElementById('key-display').textContent       = l;
}
updateKeyUI();

// ── Key config modal ──────────────────────────────────────────
document.getElementById('change-key-btn').addEventListener('click', () => {
  settingKey = true;
  document.getElementById('key-modal').classList.add('show');
});
document.getElementById('key-cancel-btn').addEventListener('click', () => {
  settingKey = false;
  document.getElementById('key-modal').classList.remove('show');
});

// ── Global keydown ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (settingKey) {
    e.preventDefault();
    if (e.key === 'Escape') {
      settingKey = false;
      document.getElementById('key-modal').classList.remove('show');
      return;
    }
    shortcutKey = e.key;
    updateKeyUI();
    settingKey = false;
    document.getElementById('key-modal').classList.remove('show');
    toast(`SHORTCUT → ${kLabel(shortcutKey)}`);
    return;
  }

  if (e.key === shortcutKey) {
    if (e.key === ' ') e.preventDefault();
    handleShortcut();
  }
});

// ── Shortcut dispatches by mode ───────────────────────────────
function handleShortcut() {
  if (mode === 'mic') {
    handleMicShortcut();
  } else {
    handleLiveShortcut();
  }
}

async function handleMicShortcut() {
  if (liveState === 'idle') {
    await acquireMicStream();
  } else if (liveState === 'ready') {
    startRecording();
  } else if (liveState === 'recording') {
    stopRecording(true);
  }
}

async function acquireMicStream() {
  if (liveState === 'waiting') return;
  setLiveState('waiting');
  getCtx();

  const deviceId = document.getElementById('mic-select').value;
  const baseAudio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 };
  const constraints = { audio: deviceId ? { deviceId: { exact: deviceId }, ...baseAudio } : baseAudio };

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch(err) {
    setLiveState('idle');
    if (err.name === 'NotAllowedError') toast('MIC PERMISSION DENIED');
    else toast(`MIC ERROR: ${err.message}`);
    return;
  }

  const audioTracks = stream.getAudioTracks();
  if (!audioTracks.length) { setLiveState('idle'); toast('NO MIC AUDIO'); return; }

  liveStream = new MediaStream(audioTracks);
  audioTracks[0].addEventListener('ended', () => { stopRecording(false); ejectLiveStream(); toast('MIC ENDED'); });

  const trackLabel = audioTracks[0].label || 'MIC INPUT';
  document.getElementById('source-label').textContent = trackLabel.length > 32 ? trackLabel.slice(0,30)+'…' : trackLabel.toUpperCase();
  document.getElementById('source-badge').classList.add('show');

  setLiveState('ready');
  startRecording();
}

// ── Record button tap (mobile / mouse) ─────────────────────────
document.getElementById('rec-btn').addEventListener('click', handleShortcut);
document.getElementById('rec-btn').addEventListener('touchstart', e => {
  e.preventDefault(); handleShortcut();
}, { passive: false });

// ══════════════════════════════════════════════════════════════
//  LIVE CAPTURE — the main workflow
// ══════════════════════════════════════════════════════════════

async function handleLiveShortcut() {
  if (liveState === 'idle') {
    await acquireStream();          // first press → getDisplayMedia
  } else if (liveState === 'ready') {
    startRecording();               // stream ready → start recording
  } else if (liveState === 'recording') {
    stopRecording(true);            // recording → stop & save
  }
  // 'waiting' state: getDisplayMedia dialog is open, ignore
}

// ── Acquire stream: getDisplayMedia, kill video instantly ──────
async function acquireStream() {
  if (liveState === 'waiting') return;
  setLiveState('waiting');
  getCtx();

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 2
      },
      video: { width: { ideal: 1, max: 1 }, height: { ideal: 1, max: 1 }, frameRate: { ideal: 1, max: 1 } }
    });
  } catch (err) {
    setLiveState('idle');
    if (err.name === 'NotAllowedError') toast('CANCELLED OR DENIED');
    else if (err.name === 'NotSupportedError') toast('USE CHROME OR EDGE ON MAC');
    else toast(`ERROR: ${err.message}`);
    return;
  }

  // ── DISABLE VIDEO (don't stop it) ───────────────────────────
  // Stopping a track from a getDisplayMedia stream can tear down the
  // whole capture session (audio included) — especially on Linux/
  // PipeWire, where video+audio share one portal session. Disabling
  // keeps the session alive but stops rendering; the video track is
  // fully stopped later in ejectLiveStream().
  const videoTracks = stream.getVideoTracks();
  videoTracks.forEach(track => { track.enabled = false; });
  // ───────────────────────────────────────────────────────────

  const audioTracks = stream.getAudioTracks();
  if (!audioTracks.length) {
    videoTracks.forEach(t => t.stop());
    setLiveState('idle');
    toast('NO AUDIO — CHROME ONLY, SELECT A TAB AND TICK "SHARE TAB AUDIO"');
    return;
  }

  liveStream     = new MediaStream(audioTracks); // audio-only, for the recorder
  liveFullStream = stream;                       // keep alive (video disabled) until eject

  // Handle source ending (user stops sharing)
  audioTracks[0].addEventListener('ended', () => {
    stopRecording(false);
    ejectLiveStream();
    toast('SOURCE ENDED');
  });

  // Source label
  const trackLabel = audioTracks[0].label || 'AUDIO SOURCE';
  document.getElementById('source-label').textContent =
    trackLabel.length > 32 ? trackLabel.slice(0, 30) + '…' : trackLabel.toUpperCase();
  document.getElementById('source-badge').classList.add('show');

  setLiveState('ready');
  // Auto-start recording immediately on acquisition
  startRecording();
}

// ── Eject stream ──────────────────────────────────────────────
document.getElementById('eject-btn').addEventListener('click', () => {
  stopRecording(false);
  ejectLiveStream();
});

function ejectLiveStream() {
  liveStream?.getTracks().forEach(t => t.stop());
  liveFullStream?.getTracks().forEach(t => t.stop());
  liveStream = null;
  liveFullStream = null;
  document.getElementById('source-badge').classList.remove('show');
  setLiveState('idle');
}

// ── Record from live stream ───────────────────────────────────
function getMime() {
  return ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}

function startRecording() {
  if (!liveStream || liveState === 'recording') return;
  const mime = getMime();
  const opts = { audioBitsPerSecond: 320000, ...(mime ? { mimeType: mime } : {}) };
  try { liveRec = new MediaRecorder(liveStream, opts); }
  catch { liveRec = new MediaRecorder(liveStream); }
  liveChunks = [];
  liveRec.ondataavailable = e => { if (e.data.size > 0) liveChunks.push(e.data); };
  liveRec.onstop = finalizeRecording;
  liveRec.start(100);
  liveStart = Date.now();
  setLiveState('recording');
  startPulse(liveStream);
  liveTimerInt = setInterval(updateTimer, 80);
}

function stopRecording(save) {
  if (liveState !== 'recording') return;
  clearInterval(liveTimerInt);
  if (!save) { liveRec.ondataavailable = null; liveRec.onstop = null; }
  if (liveRec?.state !== 'inactive') liveRec.stop();
  document.getElementById('status-timer').textContent = '';
  setLiveState(liveStream ? 'ready' : 'idle');
}

function updateTimer() {
  const s = (Date.now() - liveStart) / 1000;
  const m = Math.floor(s / 60);
  document.getElementById('status-timer').textContent =
    `${m}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
}

async function finalizeRecording() {
  if (!liveChunks.length) { toast('NO AUDIO CAPTURED — TRY AGAIN'); return; }
  const blob = new Blob(liveChunks, { type: liveChunks[0]?.type });
  await addClip(blob, `LIVE ${ts()}`);
}

// ── Live state machine ────────────────────────────────────────
function setLiveState(s) {
  liveState = s;
  const btn = document.getElementById('rec-btn');
  btn.dataset.state = s;

  const labels = { idle: 'START CAPTURE', waiting: 'CHOOSE SOURCE…', ready: 'STARTING…', recording: 'STOP & SAVE' };
  const mains  = {
    idle:      'PRESS TO BEGIN',
    waiting:   'CHOOSE YOUR SOURCE…',
    ready:     'STARTING…',
    recording: '● CAPTURING',
  };
  const subs = {
    idle:      mode === 'mic' ? 'Pick a mic above, then press to start.' : 'Browser will ask which tab/screen to share — check "share audio".\nVideo is discarded, audio only.',
    waiting:   'Pick a tab or screen in the dialog.\nCheck "Share audio" or "Share tab audio".',
    ready:     'Stream acquired, starting recorder…',
    recording: 'Press again to stop and save the clip.',
  };
  document.getElementById('rec-label').textContent   = labels[s] || '';
  document.getElementById('status-main').textContent = mains[s] || '';
  document.getElementById('status-sub').textContent  = subs[s] || '';
  if (s !== 'recording') {
    document.getElementById('status-timer').textContent = '';
    stopPulse();
  }
}

// ── Audio-reactive pulse (drives the rec-dot while recording) ──
let pulseSrc = null, pulseAnalyser = null, pulseRaf = null;

function startPulse(stream) {
  stopPulse();
  const ac = getCtx();
  try { pulseSrc = ac.createMediaStreamSource(stream); }
  catch { return; }
  pulseAnalyser = ac.createAnalyser();
  pulseAnalyser.fftSize = 256;
  pulseSrc.connect(pulseAnalyser);
  const data = new Uint8Array(pulseAnalyser.frequencyBinCount);
  const dot  = document.getElementById('rec-dot');
  const tick = () => {
    pulseAnalyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / data.length);
    dot.style.setProperty('--pulse', Math.min(rms * 4, 1.2).toFixed(3));
    pulseRaf = requestAnimationFrame(tick);
  };
  pulseRaf = requestAnimationFrame(tick);
}

function stopPulse() {
  if (pulseRaf) cancelAnimationFrame(pulseRaf);
  pulseRaf = null;
  if (pulseSrc) { try { pulseSrc.disconnect(); } catch {} pulseSrc = null; }
  pulseAnalyser = null;
  document.getElementById('rec-dot')?.style.setProperty('--pulse', '0');
}

// ══════════════════════════════════════════════════════════════
//  ANALYSIS — shared helpers + key/BPM detection
// ══════════════════════════════════════════════════════════════

function toMono(buffer) {
  const ch = buffer.numberOfChannels, len = buffer.length;
  const out = new Float32Array(len);
  for (let c = 0; c < ch; c++) {
    const data = buffer.getChannelData(c);
    for (let i = 0; i < len; i++) out[i] += data[i] / ch;
  }
  return out;
}

function rms(samples, start, len) {
  const end = Math.min(samples.length, start + len);
  const n = Math.max(1, end - start);
  let sum = 0;
  for (let i = start; i < end; i++) sum += samples[i] * samples[i];
  return Math.sqrt(sum / n);
}

// Iterative radix-2 FFT, in place. `real`/`imag` length must be a power of 2.
function fft(real, imag) {
  const n = real.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      [real[i], real[j]] = [real[j], real[i]];
      [imag[i], imag[j]] = [imag[j], imag[i]];
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curWr = 1, curWi = 0;
      for (let j = 0; j < len / 2; j++) {
        const ur = real[i + j], ui = imag[i + j];
        const vr = real[i + j + len / 2] * curWr - imag[i + j + len / 2] * curWi;
        const vi = real[i + j + len / 2] * curWi + imag[i + j + len / 2] * curWr;
        real[i + j] = ur + vr; imag[i + j] = ui + vi;
        real[i + j + len / 2] = ur - vr; imag[i + j + len / 2] = ui - vi;
        const nwr = curWr * wr - curWi * wi;
        const nwi = curWr * wi + curWi * wr;
        curWr = nwr; curWi = nwi;
      }
    }
  }
}

const KS_MAJOR = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
const KS_MINOR = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

// Krumhansl-Schmuckler key detection via chroma vector.
function detectKey(mono, sampleRate) {
  const N = 4096;
  const chroma = new Float64Array(12);
  const maxSamples = Math.min(mono.length, sampleRate * 30);
  const hann = new Float64Array(N);
  for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));

  for (let start = 0; start + N <= maxSamples; start += N) {
    const real = new Float64Array(N), imag = new Float64Array(N);
    for (let i = 0; i < N; i++) real[i] = mono[start + i] * hann[i];
    fft(real, imag);
    for (let bin = 1; bin < N / 2; bin++) {
      const freq = bin * sampleRate / N;
      if (freq < 80 || freq > 1000) continue;
      const mag = Math.sqrt(real[bin] * real[bin] + imag[bin] * imag[bin]);
      const pc = (((Math.round(12 * Math.log2(freq / 440)) + 9) % 12) + 12) % 12;
      chroma[pc] += mag;
    }
  }

  const meanC = chroma.reduce((a, b) => a + b, 0) / 12;
  function correlate(profile, rotation) {
    const meanP = profile.reduce((a, b) => a + b, 0) / 12;
    let sum = 0, sa = 0, sb = 0;
    for (let i = 0; i < 12; i++) {
      const c = chroma[(i + rotation) % 12] - meanC;
      const p = profile[i] - meanP;
      sum += c * p; sa += c * c; sb += p * p;
    }
    return sum / (Math.sqrt(sa * sb) || 1);
  }

  let best = { score: -Infinity, key: 'C', mode: 'maj' };
  for (let root = 0; root < 12; root++) {
    const majScore = correlate(KS_MAJOR, root);
    const minScore = correlate(KS_MINOR, root);
    if (majScore > best.score) best = { score: majScore, key: NOTE_NAMES[root], mode: 'maj' };
    if (minScore > best.score) best = { score: minScore, key: NOTE_NAMES[root], mode: 'min' };
  }
  return { key: best.key, mode: best.mode };
}

// Energy-envelope autocorrelation tempo detection.
function detectBPM(mono, sampleRate) {
  const frameSize = Math.round(sampleRate * 0.01); // 10ms frames
  const numFrames  = Math.floor(mono.length / frameSize);
  if (numFrames < 4) return 0;
  const env = new Float64Array(numFrames);
  for (let i = 0; i < numFrames; i++) env[i] = rms(mono, i * frameSize, frameSize);
  const mean = env.reduce((a, b) => a + b, 0) / numFrames;
  for (let i = 0; i < numFrames; i++) env[i] -= mean;

  const frameRate = sampleRate / frameSize;
  const minLag = Math.floor(frameRate * 60 / 180);
  const maxLag = Math.ceil(frameRate * 60 / 60);

  let bestLag = minLag, bestScore = -Infinity;
  for (let lag = minLag; lag <= maxLag && lag < numFrames; lag++) {
    let sum = 0;
    for (let i = 0; i + lag < numFrames; i++) sum += env[i] * env[i + lag];
    if (sum > bestScore) { bestScore = sum; bestLag = lag; }
  }
  if (bestLag <= 0) return 0;
  let bpm = 60 * frameRate / bestLag;
  while (bpm < 90)  bpm *= 2;
  while (bpm > 180) bpm /= 2;
  return Math.round(bpm);
}

// Trim leading/trailing silence (RMS below ~-50dB). Returns a trimmed
// AudioBuffer, or null if there's nothing meaningful to trim.
async function trimSilence(buffer) {
  const sr = buffer.sampleRate;
  const mono = toMono(buffer);
  const frameSize = Math.round(sr * 0.02); // 20ms frames
  const threshold = Math.pow(10, -50 / 20);
  const numFrames = Math.floor(mono.length / frameSize);
  if (numFrames < 2) return null;

  let first = -1, last = -1;
  for (let i = 0; i < numFrames; i++) {
    if (rms(mono, i * frameSize, frameSize) > threshold) { first = i; break; }
  }
  if (first === -1) return null; // entirely silent — keep original
  for (let i = numFrames - 1; i >= 0; i--) {
    if (rms(mono, i * frameSize, frameSize) > threshold) { last = i; break; }
  }

  const startSample = first * frameSize;
  const endSample   = Math.min(mono.length, (last + 1) * frameSize);
  const trimmedLen  = endSample - startSample;
  const trimmedMs   = (mono.length - trimmedLen) / sr * 1000;
  if (trimmedMs < 50 || trimmedLen <= 0) return null;

  const off = new OfflineAudioContext(buffer.numberOfChannels, trimmedLen, sr);
  const src = off.createBufferSource();
  src.buffer = buffer;
  src.connect(off.destination);
  src.start(0, startSample / sr, trimmedLen / sr);
  return await off.startRendering();
}

// ══════════════════════════════════════════════════════════════
//  CLIPS
// ══════════════════════════════════════════════════════════════

async function addClip(blob, name, forceMime) {
  const mime = forceMime || blob.type || 'audio/webm';
  let buffer;
  try { buffer = await getCtx().decodeAudioData(await blob.arrayBuffer()); }
  catch { toast('DECODE FAILED — TRY CHROME/EDGE'); return; }

  let finalBlob = blob, finalMime = mime;
  if (name.startsWith('LIVE')) {
    const trimmed = await trimSilence(buffer).catch(() => null);
    if (trimmed) {
      buffer = trimmed;
      finalBlob = bufToWav(trimmed);
      finalMime = 'audio/wav';
    }
  }

  const clip = { id: `c${Date.now()}${Math.random().toString(36).slice(2)}`, name: name.toUpperCase(), buffer, blob: finalBlob, mime: finalMime, duration: buffer.duration };
  clips.push(clip);
  document.getElementById('no-clips')?.remove();
  renderClip(clip);
  toast(`SAVED · ${buffer.duration.toFixed(1)}s`);
  analyzeClip(clip);
}

// Run key/BPM detection off the main thread tick so the clip card renders first.
function analyzeClip(clip) {
  const metaEl = document.getElementById(`cm-${clip.id}`);
  if (metaEl) metaEl.textContent = `${clip.duration.toFixed(1)}s · 🎵 analyzing…`;
  setTimeout(() => {
    let tag = '';
    try {
      const mono = toMono(clip.buffer);
      const key  = detectKey(mono, clip.buffer.sampleRate);
      const bpm  = detectBPM(mono, clip.buffer.sampleRate);
      tag = ` · ${key.key} ${key.mode.toUpperCase()} · ${bpm} BPM`;
    } catch {}
    clip.name += tag;
    const nameEl = document.getElementById(`cn-${clip.id}`);
    if (nameEl) nameEl.textContent = clip.name;
    if (metaEl) metaEl.textContent = `${clip.duration.toFixed(1)}s`;
  }, 50);
}

function renderClip(clip) {
  const grid = document.getElementById('clips-grid');
  const ext  = clip.mime.includes('wav') ? 'wav' : clip.mime.includes('mp4') ? 'mp4' : 'webm';
  const el   = document.createElement('div');
  el.className = 'clip flash'; el.id = `clip-${clip.id}`;
  el.innerHTML = `
    <div class="clip-wv"><canvas id="cwv-${clip.id}"></canvas><div class="clip-pb" id="cpb-${clip.id}"></div></div>
    <div class="clip-body">
      <div class="clip-name" id="cn-${clip.id}" title="Double-click to rename">${clip.name}</div>
      <div class="clip-meta" id="cm-${clip.id}">${clip.duration.toFixed(1)}s</div>
    </div>
    <div class="clip-foot">
      <button class="c-btn" id="cplay-${clip.id}">▶</button>
      <button class="c-btn chop" title="Open in editor">✂</button>
      <button class="c-btn dl" title="Download">↓</button>
      <button class="c-btn byob" title="Send to BYOB stems">↑</button>
      <button class="c-btn del">✕</button>
    </div>`;

  el.querySelector(`#cn-${clip.id}`).addEventListener('dblclick', () => {
    const n = prompt('Rename:', clip.name);
    if (n?.trim()) { clip.name = n.trim().toUpperCase(); el.querySelector(`#cn-${clip.id}`).textContent = clip.name; }
  });

  let ps = null;
  el.querySelector(`#cplay-${clip.id}`).addEventListener('click', () => {
    const btn = el.querySelector(`#cplay-${clip.id}`);
    if (ps) { ps.stop(); ps = null; btn.textContent = '▶'; btn.classList.remove('playing'); return; }
    const ac = getCtx(), src = ac.createBufferSource();
    src.buffer = clip.buffer; src.connect(ac.destination);
    const t0 = ac.currentTime; src.start(); ps = src;
    btn.textContent = '■'; btn.classList.add('playing');
    const bar = document.getElementById(`cpb-${clip.id}`);
    let raf;
    const anim = () => { const p = Math.min((ac.currentTime - t0) / clip.duration, 1); bar.style.width = `${p * 100}%`; if (p < 1) raf = requestAnimationFrame(anim); };
    raf = requestAnimationFrame(anim);
    src.onended = () => { ps = null; btn.textContent = '▶'; btn.classList.remove('playing'); bar.style.width = '0%'; cancelAnimationFrame(raf); };
  });

  el.querySelector('.chop').addEventListener('click', () => openEditor(clip));

  el.querySelector('.byob').addEventListener('click', () => uploadToByob(clip));

  el.querySelector('.dl').addEventListener('click', () => {
    const url = URL.createObjectURL(clip.blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${clip.name.replace(/[^a-z0-9]/gi, '_')}.${ext}`; a.click();
    URL.revokeObjectURL(url);
  });

  el.querySelector('.del').addEventListener('click', () => {
    if (ps) ps.stop();
    clips = clips.filter(c => c.id !== clip.id); el.remove();
    if (!clips.length) {
      const m = document.createElement('div');
      m.className = 'no-clips'; m.id = 'no-clips'; m.textContent = '— NO CLIPS YET —';
      grid.appendChild(m);
    }
  });

  grid.appendChild(el);
  requestAnimationFrame(() => drawClipWaveform(clip, `cwv-${clip.id}`));
}

function drawClipWaveform(clip, id) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const w = canvas.offsetWidth || 130, h = 40;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d'), data = clip.buffer.getChannelData(0);
  const step = Math.ceil(data.length / w), amp = h / 2;
  ctx.fillStyle = '#040404'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#00FF7F'; ctx.lineWidth = 1; ctx.globalAlpha = .7;
  ctx.beginPath();
  for (let i = 0; i < w; i++) {
    let mn = 1, mx = -1;
    for (let j = 0; j < step; j++) { const v = data[i * step + j] || 0; if (v < mn) mn = v; if (v > mx) mx = v; }
    ctx.moveTo(i, amp + mn * amp * .9); ctx.lineTo(i, amp + mx * amp * .9);
  }
  ctx.stroke();
}

// ── WAV encoder ───────────────────────────────────────────────
function bufToWav(buf) {
  const nc = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length;
  const data = new Float32Array(len * nc);
  for (let c = 0; c < nc; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) data[i * nc + c] = d[i]; }
  const pcm = new Int16Array(data.length);
  for (let i = 0; i < data.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, data[i] * 32767));
  const ab = new ArrayBuffer(44 + pcm.byteLength), v = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + pcm.byteLength, true); w(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nc,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nc*2,true);
  v.setUint16(32,nc*2,true); v.setUint16(34,16,true); w(36,'data');
  v.setUint32(40, pcm.byteLength, true); new Int16Array(ab, 44).set(pcm);
  return new Blob([ab], { type: 'audio/wav' });
}

// ── Misc ──────────────────────────────────────────────────────
function fmt(s)  { if (!isFinite(s)) return '0:00'; return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
function fmtMs(s){ if (!isFinite(s)) return '0:00.0'; return `${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`; }
function ts()    { return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

// ══════════════════════════════════════════════════════════════
//  EDITOR
// ══════════════════════════════════════════════════════════════
let edClip     = null;
let edStart    = 0;      // seconds
let edEnd      = 0;      // seconds
let edPs       = null;   // playing AudioBufferSourceNode
let edLoop     = false;
let edRafId    = null;
let edDragging = null;   // 'l' | 'r' | null

function openEditor(clip) {
  edClip  = clip;
  edStart = 0;
  edEnd   = clip.duration;
  document.getElementById('ed-clip-name').textContent = clip.name;
  document.getElementById('editor-panel').classList.add('open');
  requestAnimationFrame(() => { drawEditorWaveform(); updateEdHandles(); });
}

function closeEditor() {
  edStop();
  document.getElementById('editor-panel').classList.remove('open');
  edClip = null;
}

function drawEditorWaveform() {
  const canvas = document.getElementById('ed-canvas');
  const wrap   = document.getElementById('ed-wv-wrap');
  if (!canvas || !edClip) return;
  const w = wrap.offsetWidth, h = wrap.offsetHeight || 100;
  canvas.width = w; canvas.height = h;
  const ctx  = canvas.getContext('2d');
  const data = edClip.buffer.getChannelData(0);
  const step = Math.max(1, Math.ceil(data.length / w));
  const amp  = h / 2;

  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, w, h);
  // Grid lines every 1s
  ctx.strokeStyle = '#181818'; ctx.lineWidth = 1;
  for (let t = 1; t < edClip.duration; t++) {
    const x = (t / edClip.duration) * w;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  ctx.strokeStyle = '#BB77FF'; ctx.lineWidth = 1; ctx.globalAlpha = .75;
  ctx.beginPath();
  for (let i = 0; i < w; i++) {
    let mn = 1, mx = -1;
    for (let j = 0; j < step; j++) { const v = data[i * step + j] || 0; if (v < mn) mn = v; if (v > mx) mx = v; }
    ctx.moveTo(i, amp + mn * amp * .9); ctx.lineTo(i, amp + mx * amp * .9);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}

function updateEdHandles() {
  if (!edClip) return;
  const wrap = document.getElementById('ed-wv-wrap');
  const w    = wrap.offsetWidth;
  const lPct = edStart / edClip.duration;
  const rPct = edEnd   / edClip.duration;
  const lPx  = lPct * w;
  const rPx  = rPct * w;
  document.getElementById('ed-handle-l').style.left  = `${lPx - 10}px`;
  document.getElementById('ed-handle-r').style.left  = `${rPx - 10}px`;
  const reg = document.getElementById('ed-region');
  reg.style.left  = `${lPx}px`;
  reg.style.width = `${rPx - lPx}px`;
  document.getElementById('ed-start-label').textContent = fmtMs(edStart);
  document.getElementById('ed-end-label').textContent   = fmtMs(edEnd);
  document.getElementById('ed-sel-dur').textContent     = fmtMs(edEnd - edStart) + ' sel';
}

// ── Drag handles ──────────────────────────────────────────────
function edPxToTime(clientX) {
  const wrap = document.getElementById('ed-wv-wrap');
  const r    = wrap.getBoundingClientRect();
  return Math.max(0, Math.min(edClip?.duration || 0, ((clientX - r.left) / r.width) * (edClip?.duration || 1)));
}

function edPointerMove(e) {
  if (!edDragging || !edClip) return;
  const t = edPxToTime(e.touches ? e.touches[0].clientX : e.clientX);
  if (edDragging === 'l') edStart = Math.min(t, edEnd - 0.05);
  else                    edEnd   = Math.max(t, edStart + 0.05);
  updateEdHandles();
}

['ed-handle-l','ed-handle-r'].forEach(id => {
  const el = document.getElementById(id);
  const side = id.endsWith('-l') ? 'l' : 'r';
  el.addEventListener('mousedown',  e => { edDragging = side; e.preventDefault(); });
  el.addEventListener('touchstart', e => { edDragging = side; e.preventDefault(); }, { passive: false });
});

document.addEventListener('mousemove',  edPointerMove);
document.addEventListener('touchmove',  edPointerMove, { passive: false });
document.addEventListener('mouseup',    () => { edDragging = null; });
document.addEventListener('touchend',   () => { edDragging = null; });

// Drag directly on the waveform to select a region; a simple click
// (no movement) snaps the nearest handle to that point instead.
let edRegionDragging = false;
let edRegionMoved    = false;
let edRegionStart    = 0;

const edWvWrap = document.getElementById('ed-wv-wrap');

edWvWrap.addEventListener('pointerdown', e => {
  if (!edClip || edDragging) return;
  if (e.target.id === 'ed-handle-l' || e.target.id === 'ed-handle-r') return;
  edRegionDragging = true;
  edRegionMoved    = false;
  edRegionStart    = edPxToTime(e.clientX);
  edWvWrap.setPointerCapture?.(e.pointerId);
});

edWvWrap.addEventListener('pointermove', e => {
  if (!edRegionDragging || !edClip) return;
  const t = edPxToTime(e.clientX);
  if (Math.abs(t - edRegionStart) > 0.02) edRegionMoved = true;
  if (edRegionMoved) {
    edStart = Math.min(edRegionStart, t);
    edEnd   = Math.max(edRegionStart, t);
    updateEdHandles();
  }
});

edWvWrap.addEventListener('pointerup', e => {
  if (!edRegionDragging) return;
  edRegionDragging = false;
  if (!edRegionMoved && edClip) {
    const t = edRegionStart;
    // Snap to whichever handle is closer
    if (Math.abs(t - edStart) < Math.abs(t - edEnd)) edStart = Math.min(t, edEnd - 0.05);
    else edEnd = Math.max(t, edStart + 0.05);
    updateEdHandles();
  }
});

// ── Playback ──────────────────────────────────────────────────
function edPlayToggle() {
  if (edPs) { edStop(); return; }
  edPlay();
}

function edPlay() {
  if (!edClip) return;
  edStop();
  const ac  = getCtx();
  const src = ac.createBufferSource();
  src.buffer = edClip.buffer;
  src.loop   = edLoop;
  if (edLoop) { src.loopStart = edStart; src.loopEnd = edEnd; }
  src.connect(ac.destination);
  src.start(0, edStart, edLoop ? undefined : (edEnd - edStart));
  edPs = src;
  const btn = document.getElementById('ed-play-btn');
  btn.textContent = '■ STOP'; btn.classList.add('on');
  const t0 = ac.currentTime - edStart;
  cancelAnimationFrame(edRafId);
  const tick = () => {
    if (!edPs) return;
    const pos = (ac.currentTime - t0 + edStart);
    const cur = edLoop ? edStart + ((pos - edStart) % (edEnd - edStart)) : Math.min(pos, edEnd);
    document.getElementById('ed-pos').textContent = fmtMs(cur);
    const pct = cur / (edClip?.duration || 1);
    document.getElementById('ed-playhead').style.left = `${pct * 100}%`;
    edRafId = requestAnimationFrame(tick);
  };
  edRafId = requestAnimationFrame(tick);
  src.onended = () => { if (!edLoop) edStop(); };
}

function edStop() {
  try { edPs?.stop(); } catch {}
  edPs = null;
  cancelAnimationFrame(edRafId);
  const btn = document.getElementById('ed-play-btn');
  if (btn) { btn.textContent = '▶ PREVIEW'; btn.classList.remove('on'); }
}

function edToggleLoop() {
  edLoop = !edLoop;
  document.getElementById('ed-loop-btn').classList.toggle('on', edLoop);
  if (edPs) { edStop(); edPlay(); }
}

async function edCut() {
  if (!edClip) return;
  edStop();
  const duration = edEnd - edStart;
  if (duration < 0.05) { toast('SELECTION TOO SHORT'); return; }
  const buf  = edClip.buffer;
  const off  = new OfflineAudioContext(buf.numberOfChannels, Math.ceil(duration * buf.sampleRate), buf.sampleRate);
  const src  = off.createBufferSource();
  const gain = off.createGain();
  src.buffer = buf;
  src.connect(gain);
  gain.connect(off.destination);
  // Short fade in/out to avoid clicks/pops at the cut edges
  const fade = Math.min(0.015, duration / 4);
  gain.gain.setValueAtTime(0, 0);
  gain.gain.linearRampToValueAtTime(1, fade);
  gain.gain.setValueAtTime(1, Math.max(fade, duration - fade));
  gain.gain.linearRampToValueAtTime(0, duration);
  src.start(0, edStart, duration);
  const rendered = await off.startRendering();
  const wav = bufToWav(rendered);
  await addClip(wav, `CUT ${ts()}`, 'audio/wav');
  toast(`✂ CUT · ${duration.toFixed(2)}s`);
}

    } catch { toast(`COULD NOT LOAD: ${f.name}`); }
  }
  e.target.value = '';
});
