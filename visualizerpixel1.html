<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circuit Organism — Recursive Music Visualizer</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #000; width: 100%; height: 100%;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; transform-origin: center center; }

  #ui {
    position: fixed; top: 24px; left: 24px; z-index: 10;
    background: rgba(0,0,0,0.82); border: 1px solid #5a4a1c;
    padding: 20px 22px; color: #f0e6c8; max-width: 320px;
  }
  #ui h1 { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #FFD700; margin: 0 0 6px 0; font-weight: normal; }
  #ui p  { font-size: 11px; line-height: 1.5; color: #b8ad8a; margin: 0 0 14px 0; }
  #ui button {
    display: block; width: 100%; background: #0a0a0a; color: #FFD700;
    border: 1px solid #FFD700; padding: 9px 12px; margin-bottom: 8px;
    font-family: inherit; font-size: 11px; letter-spacing: 0.05em; cursor: pointer; text-transform: uppercase;
  }
  #ui button:hover { background: #1a1a0a; }
  #ui input[type=file] { display: none; }
  #ui .or { text-align: center; color: #5a4a1c; font-size: 10px; margin: 4px 0; letter-spacing: 0.1em; }

  /* ── Bottom toolbar — replaces scattered floating buttons ── */
  #toolbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9;
    background: rgba(0,0,0,0.88); border-top: 1px solid #3a3014;
    padding: 10px 16px; display: none;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  #toolbar.hidden { display: none !important; }
  #toolbar button {
    background: transparent; color: #5a4a1c; border: 1px solid #3a3014;
    font-family: inherit; font-size: 10px; padding: 7px 12px;
    cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
  }
  #toolbar button:hover { color: #FFD700; border-color: #FFD700; }
  #toolbar button.action { color: #FFD700; border-color: #FFD700; }
  #toolbar .zoom-group { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  #toolbar .zoom-group button { padding: 7px 10px; }
  #zoomLabel { color: #5a4a1c; font-size: 10px; min-width: 38px; text-align: center; letter-spacing: 0.04em; }

  /* ── HUD ── */
  #hud { position: fixed; top: 18px; right: 24px; z-index: 8; color: #6a5a2a; font-size: 9px; letter-spacing: 0.08em; display: none; }
  #hud span { color: #6a5a2a; }

  /* ── Controls toggle + panel ── */
  #controlsToggle {
    display: none; position: fixed; top: 50%; right: 0; z-index: 11;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl; text-orientation: mixed;
    background: rgba(0,0,0,0.82); color: #5a4a1c; border: 1px solid #3a3014;
    border-right: none; font-family: inherit; font-size: 9px;
    padding: 14px 6px; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase;
  }
  #controlsToggle:hover { color: #FFD700; border-color: #FFD700; }

  #controlsPanel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(0,0,0,0.92); border-left: 1px solid #5a4a1c;
    width: 210px; display: none; overflow-y: auto;
    padding: 0 0 80px 0; /* bottom padding clears toolbar */
  }

  /* Panel sections */
  .panel-section { border-bottom: 1px solid #1a1600; padding: 14px 16px; }
  .panel-section-title {
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #5a4a1c; margin: 0 0 10px 0;
  }
  .panel-section label {
    display: block; color: #b8ad8a; font-size: 9px;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; margin-top: 8px;
  }
  .panel-section label:first-child { margin-top: 0; }
  .panel-section input[type=range] { width: 100%; accent-color: #FFD700; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .toggleBtn {
    background: #0a0a0a; color: #5a4a1c; border: 1px solid #3a3014;
    font-family: inherit; font-size: 9px; padding: 7px 4px;
    cursor: pointer; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .toggleBtn.active { color: #FFD700; border-color: #FFD700; background: #141000; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<audio id="audioEl" loop></audio>

<div id="ui">
  <h1>Circuit Organism</h1>
  <p>A living electronic civilization grown from sound. Bass seeds new structure, mids drive branching, treble adds detail. Choose an audio source to begin — or let it idle on ambient pulses.</p>
  <button id="micBtn">Use Microphone</button>
  <div class="or">— or —</div>
  <label for="fileInput"><button id="fileBtn" type="button">Upload Audio File</button></label>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg,.aiff,.caf">
  <div class="or">— or —</div>
  <button id="idleBtn">Skip — Run Ambient Mode</button>
</div>

<div id="hud">b<span id="bVal">0.00</span> m<span id="mVal">0.00</span> t<span id="tVal">0.00</span> n<span id="nVal">0</span> <span id="zoomHud">1.0×</span></div>

<!-- Bottom toolbar: always-visible action bar -->
<div id="toolbar" class="hidden">
  <button id="resetBtn">Reset</button>
  <button id="burstBtn" class="action">⚡ Burst</button>
  <div class="zoom-group">
    <button id="zoomOutBtn">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomInBtn">+</button>
    <button id="zoomResetBtn">1:1</button>
  </div>
</div>

<!-- Side panel toggle tab -->
<button id="controlsToggle">Controls</button>

<!-- Scrollable side panel with sections -->
<div id="controlsPanel">

  <div class="panel-section">
    <p class="panel-section-title">Audio</p>
    <label for="sensSlider">Sensitivity</label>
    <input type="range" id="sensSlider" min="0.5" max="2.5" step="0.05" value="1.3">
    <label for="voidSlider">Negative Space</label>
    <input type="range" id="voidSlider" min="0.4" max="2.5" step="0.05" value="1.15">
    <label for="densSlider">Density</label>
    <input type="range" id="densSlider" min="0.3" max="2.5" step="0.05" value="1">
  </div>

  <div class="panel-section">
    <p class="panel-section-title">Modes</p>
    <div class="toggles">
      <button class="toggleBtn active" id="ringsToggle">Rings</button>
      <button class="toggleBtn" id="chaosToggle">Chaos</button>
      <button class="toggleBtn" id="swirlToggle">Spiral</button>
      <button class="toggleBtn" id="colorSwirlToggle">Swirl</button>
      <button class="toggleBtn" id="fractalToggle">Trails</button>
      <button class="toggleBtn" id="constellationToggle">Stars</button>
      <button class="toggleBtn" id="beatLockToggle">Beat Lock</button>
      <button class="toggleBtn" id="toroidalToggle">Torus</button>
      <button class="toggleBtn" id="spinToggle">Spin</button>
      <button class="toggleBtn" id="tendrilsToggle">Tendrils</button>
      <button class="toggleBtn" id="asymToggle">Asym</button>
      <button class="toggleBtn" id="drawToggle">Draw</button>
    </div>
  </div>

  <div class="panel-section">
    <p class="panel-section-title">Palette</p>
    <div class="toggles" id="paletteButtons">
      <button class="toggleBtn active" data-palette="jewel">Jewel</button>
      <button class="toggleBtn" data-palette="fire">Fire</button>
      <button class="toggleBtn" data-palette="ocean">Ocean</button>
      <button class="toggleBtn" data-palette="mono">Mono</button>
      <button class="toggleBtn" data-palette="spectrum">Spectrum</button>
    </div>
  </div>

  <div class="panel-section" id="drawControls" style="display:none">
    <p class="panel-section-title">Draw</p>
    <label for="brushSlider">Brush Size (px)</label>
    <input type="range" id="brushSlider" min="4" max="80" step="2" value="24">
    <label style="margin-top:10px;display:block">Color</label>
    <div id="drawColorPicker" style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px">
      <button class="dcb" data-col="palette" style="background:linear-gradient(135deg,#FFD700,#FF3CAC,#50C878);border:2px solid #FFD700;height:22px;cursor:pointer;font-size:7px;color:#000;line-height:22px;text-align:center">PAL</button>
      <button class="dcb" data-col="#39FF14" style="background:#39FF14;border:2px solid #3a3014;height:22px;cursor:pointer"></button>
      <button class="dcb" data-col="#FF3CAC" style="background:#FF3CAC;border:2px solid #3a3014;height:22px;cursor:pointer"></button>
      <button class="dcb" data-col="#FFD700" style="background:#FFD700;border:2px solid #3a3014;height:22px;cursor:pointer"></button>
      <button class="dcb" data-col="#FF4500" style="background:#FF4500;border:2px solid #3a3014;height:22px;cursor:pointer"></button>
      <button class="dcb" data-col="#00FFFF" style="background:#00FFFF;border:2px solid #3a3014;height:22px;cursor:pointer"></button>
      <button class="dcb" data-col="#9B5DE5" style="background:#9B5DE5;border:2px solid #3a3014;height:22px;cursor:pointer"></button>
      <button class="dcb" data-col="erase"   style="background:#111;border:2px solid #3a3014;height:22px;cursor:pointer;color:#555;font-size:9px;line-height:22px;text-align:center">✕</button>
    </div>
  </div>

</div>



<script>
(function(){
  "use strict";

  // ---------- canvas setup ----------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const prevCanvas = document.createElement('canvas');
  const prevCtx = prevCanvas.getContext('2d', { alpha: false });
  prevCtx.imageSmoothingEnabled = false;

  // ---------- world / growth simulation ----------
  // Square lattice, 8-fold symmetry implemented as the D4 dihedral group
  // (4 rotations x 2 reflections) of a single primary wedge. Because all
  // growth is strictly axis-aligned, every mirrored copy stays axis-aligned
  // too — true 45° kaleidoscope tiling on a square grid would need
  // interpolation and would break the "no curves, orthogonal only" rule.
  //
  // Growth is hard-bounded to a circle (GRID_RADIUS) rather than a square,
  // and split into two zones: a dense CORE that gets actively filled solid
  // (the contiguous orb body), and a sparser ring out to MID_RADIUS where
  // thin circuit tendrils are allowed to radiate before the boundary stops
  // them — this is what gives the contained-orb-with-a-corona look instead
  // of open-ended sprawl.
  const GRID_RADIUS = 108;
  const CORE_RADIUS = 34;
  const MID_RADIUS = 68;

  let W, H, CX, CY, CELL;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    prevCanvas.width = W; prevCanvas.height = H;
    CX = W / 2; CY = H / 2;
    // size cells off the smaller viewport dimension so the orb always sits
    // centered and consistently proportioned, in a square window or a wide one
    CELL = Math.max(2, Math.floor((Math.min(W, H) * 0.9) / GRID_RADIUS));
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    prevCtx.fillStyle = '#000';
    prevCtx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- palette / color modes ----------
  // Several full warm/cool/accent sets to swap between live. colorForRadius
  // always reads from whichever is currently active rather than the old
  // hardcoded arrays.
  const PALETTES = {
    jewel: {
      warm: ['#FFD700', '#E0115F', '#FFBF00', '#FF6F3C', '#FF4040'],
      cool: ['#50C878', '#0F52BA', '#9B5DE5', '#2EC4B6', '#3FA7FF', '#7FFF6B'],
      accent: ['#FFFFF0', '#FF3CAC', '#FFE45C'],
    },
    fire: {
      warm: ['#FF0000', '#FF4500', '#FF8C00', '#FFD700', '#DC143C'],
      cool: ['#FF6347', '#FFA500', '#FF8C00', '#E0115F'], // stays warm on purpose — an inferno, not a blend
      accent: ['#FFFFF0', '#FFFF00'],
    },
    ocean: {
      warm: ['#1E90FF', '#00CED1', '#20B2AA', '#3FA7FF'],
      cool: ['#0F52BA', '#2EC4B6', '#00FFFF', '#4169E1', '#7FFFD4'],
      accent: ['#FFFFFF', '#E0FFFF'],
    },
    mono: {
      warm: ['#FFD700', '#FFE45C', '#FFBF00'],
      cool: ['#FFD700', '#FFE45C', '#FFFFF0'],
      accent: ['#FFFFFF'],
    },
    spectrum: {
      warm: ['#FF0000', '#FF7F00', '#FFFF00', '#FF1493'],
      cool: ['#00FF00', '#00CED1', '#0000FF', '#8B00FF', '#4B0082'],
      accent: ['#FFFFFF'],
    },
  };
  let activePaletteName = 'jewel';
  function palette() { return PALETTES[activePaletteName]; }

  function dist(x, y) { return Math.sqrt(x * x + y * y); }

  // colors blend smoothly by radius instead of switching at hard cutoffs.
  // The old version locked anything inside CORE_RADIUS to warm-only — but
  // the core dilation pass generates the large majority of all cells, so
  // that made the whole piece read as red/gold no matter what the rim did.
  // Now even dead-center has real odds of pulling cool/accent tones. In
  // chaos mode, radius is ignored entirely and color is fully random
  // (still scoped to whichever palette is active).
  function colorForRadius(r) {
    const pal = palette();
    if (chaosMode) {
      const all = pal.warm.concat(pal.cool, pal.accent);
      return all[(Math.random() * all.length) | 0];
    }
    if (Math.random() < 0.1) return pal.accent[(Math.random() * pal.accent.length) | 0];
    const t = Math.min(1, r / GRID_RADIUS);
    // colorTemp (0=warm, 1=cool) is driven by midLevel — high mids pull cool, low pull warm
    const coolChance = Math.min(0.95, Math.max(0.05, (0.32 + t * 0.45) * (0.6 + colorTemp * 0.8)));
    const pool = Math.random() < coolChance ? pal.cool : pal.warm;
    return pool[(Math.random() * pool.length) | 0];
  }

  // ---------- ternary cell lifecycle ----------
  // Binary occupied/empty replaced with the three states from the ternary
  // clock work: void (yin — true negative space), becoming (changing — a
  // cell that is either forming or fading, rendered as a broken/open
  // square rather than a closed one), and settled (yang — fully formed,
  // closed outline). A cell always passes through "becoming" in both
  // directions: nothing snaps directly from solid to void or void to
  // solid. Keyed by canonical symmetry-class (abs + sort) rather than raw
  // (x,y) so all 8 mirrored copies share one state and age in lockstep.
  const cellState = new Map(); // canonKey -> { state, dir, since, color }
  let frameCount = 0;

  function canon(x, y) {
    const ax = Math.abs(x), ay = Math.abs(y);
    return ax >= ay ? (ax + ',' + ay) : (ay + ',' + ax);
  }

  // ring buffers sampled probabilistically rather than scanning the full
  // map every frame — cheap, and exactness doesn't matter for organic growth
  const recentCore = []; // cells near center, sampled by the core dilation pass
  const RECENT_CORE_MAX = 220;
  const recentAll = []; // every cell ever plotted, sampled by the aging pass
  const RECENT_ALL_MAX = 5000;
  const recentVoid = []; // recently-erased cells, seeded from during silence
  const RECENT_VOID_MAX = 1200;

  const FORM_DURATION = 18;
  const YANG_LIFE_BASE = 600;
  const YANG_LIFE_MIN = 55;

  // live-adjustable via the controls panel
  let sensitivity = 1.3;
  let voidAmount = 1.15;
  let densityAmount = 1.0;

  // toggleable modes
  let ringsEnabled = true;
  let chaosMode = false;
  let swirlMode = false;
  let colorSwirlMode = false;
  // spinAngle and colorSwirlAngle removed — both modes now move color values
  // between cells in the fixed grid instead of transforming the canvas
  let fractalMode = false;
  let trailsOpacity = 0; // ramps 0→1 when trails on, fades 1→0 when turned off
  let constellationMode = false;
  let beatLockMode = false;
  let toroidalMode = false;
  let spinMode = false;
  let tendrilsMode = false;
  let asymMode = false;   // when off, all 8 sectors always open (symmetric)

  let beatWindowFrames = 0;
  const BEAT_WINDOW = 12;
  let beatLockPulse = 0;

  let currentBass = 0;
  let beatFlash = 0;     // 0→1 on hit, fast decay
  let sweepAngle = 0;    // coherent flow sweep front
  let colorTemp = 0.5;   // 0=warm, 1=cool — driven by midLevel continuously

  // ---------- silence dreams ----------
  // when energy drops below threshold for long enough, growth switches
  // source: instead of seeding from center, tips sprout from the edges of
  // recently-erased void cells — emptiness itself becomes generative.
  let silenceEnergy = 0;       // smoothed overall energy
  let silenceFrames = 0;       // how many consecutive near-silent frames
  const SILENCE_THRESHOLD = 0.09;
  const SILENCE_ONSET = 90;    // ~1.5s before dream mode kicks in
  let dreaming = false;

  function spawnFromVoid() {
    if (recentVoid.length === 0) return;
    const [vx, vy] = recentVoid[(Math.random() * recentVoid.length) | 0];
    const d = DIRS[(Math.random() * 4) | 0];
    const sx = vx + d[0], sy = vy + d[1];
    if (dist(sx, sy) <= GRID_RADIUS && !isBlocked(sx, sy)) {
      // dream-growth uses cool/accent tones — the inverse aesthetic of
      // the warm, energetic normal growth from center
      const pal = palette();
      const pool = pal.cool.concat(pal.accent);
      const color = pool[(Math.random() * pool.length) | 0];
      tips.push({
        x: sx, y: sy, dx: d[0], dy: d[1],
        age: 0, life: 80 + Math.random() * 160,
        color,
        legLen: 1, legProgress: 0, turnCount: 0,
      });
    }
  }

  // ---------- hexagram system ----------
  // Split the FFT into 6 bands. Each band above its local threshold = yang
  // (solid line, bit = 1). Below = yin (broken line, bit = 0). The 6 bits
  // form a number 0-63 = one of the 64 hexagrams, live, every frame.
  //
  // Lower trigram (bits 0-2) gates which pairs of the 8 mirror sectors are
  // open to growth — the music literally determines where the organism can
  // grow at any moment. Upper trigram (bits 3-5) modulates color density
  // and branching rate. All 8 sectors always receive erasing/aging updates
  // so the hexagram controls growth, not decay.
  let currentHexagram = 63;   // start all-yang
  let openSectors = 0xFF;     // bitmask, bit i = sector i open
  const hexBandFloor = [0.08, 0.08, 0.08, 0.08, 0.08, 0.08];

  function computeHexagram() {
    if (!analyser) {
      currentHexagram = Math.floor(frameCount / 90) % 64;
    } else {
      const n = freqData.length;
      const boundaries = [0, 0.04, 0.10, 0.20, 0.35, 0.60, 1.0].map(f => Math.floor(f * n));
      let hex = 0;
      for (let b = 0; b < 6; b++) {
        let sum = 0;
        for (let i = boundaries[b]; i < boundaries[b + 1]; i++) sum += freqData[i];
        const avg = sum / ((boundaries[b + 1] - boundaries[b]) * 255 || 1) * sensitivity;
        hexBandFloor[b] = hexBandFloor[b] * 0.97 + avg * 0.03;
        if (avg > Math.max(0.05, hexBandFloor[b] * 1.3)) hex |= (1 << b);
      }
      currentHexagram = hex;
    }
    // sector gating only applies in asymMode — otherwise all 8 sectors are
    // always open, maintaining perfect D4 symmetry at all times
    if (asymMode) {
      const lower = currentHexagram & 0x07;
      openSectors = 0xC0;
      if (lower & 1) openSectors |= 0x03;
      if (lower & 2) openSectors |= 0x0C;
      if (lower & 4) openSectors |= 0x30;
      if (openSectors === 0xC0) openSectors = 0xFF;
    } else {
      openSectors = 0xFF;
    }
  }

  // upper trigram (bits 3-5) → branch density modifier 0.5–1.5
  function hexBranchMod() {
    const upper = (currentHexagram >> 3) & 0x07;
    return 0.5 + (upper / 7) * 1.0;
  }

  function mirror8(x, y) {
    return [
      [ x,  y], [ y,  x],
      [-x,  y], [-y,  x],
      [ x, -y], [ y, -x],
      [-x, -y], [-y, -x],
    ];
  }

  // same 8 transforms as mirror8 but as explicit functions so constellation
  // lines can transform *both* endpoints of a segment identically
  const D4 = [
    (x,y) => [ x,  y],
    (x,y) => [ y,  x],
    (x,y) => [-x,  y],
    (x,y) => [-y,  x],
    (x,y) => [ x, -y],
    (x,y) => [ y, -x],
    (x,y) => [-x, -y],
    (x,y) => [-y, -x],
  ];

  function forEachMirrorPixel(x, y, cb) {
    const pts = mirror8(x, y);
    for (let i = 0; i < 8; i++) {
      if (!(openSectors & (1 << i))) continue; // hexagram gates which sectors grow
      const sx = Math.round(CX + pts[i][0] * CELL);
      const sy = Math.round(CY + pts[i][1] * CELL);
      if (sx < -CELL || sx > W + CELL || sy < -CELL || sy > H + CELL) continue;
      cb(sx, sy);
    }
  }

  // settled (yang): a closed square outline — the "resolved" mark
  function drawYangMark(x, y, color, energy) {
    const drawSize = Math.max(2, CELL - 2);
    const offset = (CELL - drawSize) / 2;
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = Math.min(1, 0.72 + (energy || 0.6) * 0.28);
    forEachMirrorPixel(x, y, (sx, sy) => {
      ctx.strokeRect(sx + offset + 0.5, sy + offset + 0.5, drawSize, drawSize);
    });
    ctx.globalAlpha = 1;
  }

  // becoming (changing): an open square, brackets at two opposite corners
  // only — a different line type for "neither yin nor yang," used both
  // when a cell is forming and when it's mid-vanish
  function drawChangingMark(x, y, color) {
    const drawSize = Math.max(2, CELL - 2);
    const offset = (CELL - drawSize) / 2;
    const arm = Math.max(1, Math.round(drawSize * 0.5));
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.85;
    forEachMirrorPixel(x, y, (sx, sy) => {
      const left = sx + offset + 0.5, top = sy + offset + 0.5;
      const right = left + drawSize, bottom = top + drawSize;
      ctx.beginPath();
      ctx.moveTo(left + arm, top); ctx.lineTo(left, top); ctx.lineTo(left, top + arm);
      ctx.moveTo(right - arm, bottom); ctx.lineTo(right, bottom); ctx.lineTo(right, bottom - arm);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  // void (yin): actively erased — real negative space, not just absence
  function eraseMark(x, y) {
    recentVoid.push([x, y]);
    if (recentVoid.length > RECENT_VOID_MAX) recentVoid.shift();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 1;
    // erasure always uses all 8 sectors regardless of hexagram — the hexagram
    // controls growth, not decay; silence should eat structure uniformly
    const pts = mirror8(x, y);
    for (let i = 0; i < 8; i++) {
      const sx = Math.round(CX + pts[i][0] * CELL);
      const sy = Math.round(CY + pts[i][1] * CELL);
      if (sx < -CELL || sx > W + CELL || sy < -CELL || sy > H + CELL) continue;
      ctx.fillRect(sx, sy, CELL, CELL);
    }
  }

  function plotCell(x, y, color) {
    const key = canon(x, y);
    cellState.set(key, { state: 'changing', dir: 'forming', since: frameCount, color });
    if (dist(x, y) < CORE_RADIUS) {
      recentCore.push([x, y]);
      if (recentCore.length > RECENT_CORE_MAX) recentCore.shift();
    }
    recentAll.push([x, y]);
    if (recentAll.length > RECENT_ALL_MAX) recentAll.shift();
    drawChangingMark(x, y, color);
  }

  // samples recently-plotted cells and advances their state machine:
  // changing→yang (settled), changing→void (vanished + erased), or
  // yang→changing (decay begins). `energy` (roughly 0..1, overall audio
  // loudness) shortens settled life when it's low — quiet passages erode
  // structure into real negative space faster than loud ones.
  function ageCells(amount, energy) {
    const yangLife = Math.max(YANG_LIFE_MIN, YANG_LIFE_BASE * Math.min(1, energy * 2.2)) / voidAmount / (chaosMode ? 1.8 : 1);
    for (let i = 0; i < amount; i++) {
      if (recentAll.length === 0) return;
      const [x, y] = recentAll[(Math.random() * recentAll.length) | 0];
      const key = canon(x, y);
      const cell = cellState.get(key);
      if (!cell) continue;
      const elapsed = frameCount - cell.since;
      if (cell.state === 'changing' && elapsed > FORM_DURATION) {
        if (cell.dir === 'forming') {
          cell.state = 'yang'; cell.since = frameCount;
          drawYangMark(x, y, cell.color, energy);
        } else {
          cellState.delete(key);
          eraseMark(x, y);
        }
      } else if (cell.state === 'yang' && elapsed > yangLife) {
        cell.state = 'changing'; cell.dir = 'fading'; cell.since = frameCount;
        drawChangingMark(x, y, cell.color);
      }
    }
  }

  function densifyCore(amount) {
    for (let i = 0; i < amount; i++) {
      if (recentCore.length === 0) return;
      const [bx, by] = recentCore[(Math.random() * recentCore.length) | 0];
      const d = DIRS[(Math.random() * 4) | 0];
      const nx = bx + d[0], ny = by + d[1];
      if (dist(nx, ny) < CORE_RADIUS && !isBlocked(nx, ny)) {
        plotCell(nx, ny, colorForRadius(dist(nx, ny)));
      }
    }
  }

  function isBlocked(x, y) {
    return cellState.has(canon(x, y));
  }

  const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];

  let tips = [];
  const MAX_TIPS = 800;

  function spawnRimTendril() {
    // place a tip near the rim at a random angle, pointing outward —
    // tendrils shoot off from the edge of the orb rather than branching
    // from internal growth, so they read as the organism exhaling arms
    const angle = Math.random() * Math.PI * 2;
    const rimR = GRID_RADIUS * 0.88;
    const x = Math.round(rimR * Math.cos(angle));
    const y = Math.round(rimR * Math.sin(angle));
    // choose the cardinal direction with the most outward component
    const outward = DIRS.filter(([dx, dy]) => dx * x + dy * y > 0);
    if (outward.length === 0) return;
    const [dx, dy] = outward[(Math.random() * outward.length) | 0];
    tips.push({
      x, y, dx, dy,
      age: 0, life: 200 + Math.random() * 280,
      color: colorForRadius(rimR),
      legLen: 1, legProgress: 0, turnCount: 0,
      isRimTendril: true,
    });
  }

  function spawnSeed() {
    const d = DIRS[(Math.random() * 4) | 0];
    tips.push({
      x: 0, y: 0, dx: d[0], dy: d[1],
      age: 0, life: (swirlMode ? 900 : 240) + Math.random() * (swirlMode ? 600 : 420),
      color: colorForRadius(0),
      legLen: 1, legProgress: 0, turnCount: 0, // square-spiral state, used only in swirl mode
    });
  }

  // ---------- beat detection + ring overlay ----------
  // The structural reactivity (branch/seed/decay rates) is a slow-moving
  // average response — good for long-arc shape, but it can't read as
  // "reacting to the music" on its own because nothing happens *at* a hit,
  // only gradually around it. This adds a real onset detector (current
  // bass against its own rolling baseline, not just raw loudness) and an
  // expanding ring of square ticks fired on each detected hit. It's drawn
  // *after* the frame is snapshotted into prevCanvas, so it's visible for
  // one frame and never gets baked into the persistent structure.
  let bassFloor = 0.15;
  let lastHitFrame = -999;
  const HIT_REFRACTORY = 6;
  const HIT_RATIO = 1.28;
  const HIT_MIN = 0.12;     // absolute floor so near-silence can't trigger a "hit"

  let rings = [];
  const MAX_RINGS = 6;

  function detectBeat(bass) {
    bassFloor = bassFloor * 0.965 + bass * 0.035;
    const threshold = Math.max(HIT_MIN, bassFloor * HIT_RATIO);
    if (bass > threshold && (frameCount - lastHitFrame) > HIT_REFRACTORY) {
      lastHitFrame = frameCount;
      onBeatHit(Math.min(1, (bass - bassFloor) / (bassFloor + 0.05)));
    }
  }

  function onBeatHit(strength) {
    if (ringsEnabled) {
      if (rings.length >= MAX_RINGS) rings.shift();
      rings.push({ r: 6, alpha: 1, speed: 2.2 + strength * 2.5 });
    }
    beatFlash = Math.min(1, 0.5 + strength * 0.5);

    // direct geometric void painted instantly at beat — no cell state, no delay
    // a black cross from center clears structure visibly on every hit
    const arm = Math.floor(GRID_RADIUS * CELL * (0.3 + strength * 0.45));
    const thick = Math.max(CELL, Math.floor(CELL * 2.5));
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 0.75 + strength * 0.2;
    ctx.fillRect(CX - arm, CY - thick, arm * 2, thick * 2);
    ctx.fillRect(CX - thick, CY - arm, thick * 2, arm * 2);
    ctx.globalAlpha = 1;

    if (beatLockMode) beatWindowFrames = BEAT_WINDOW;
    if (tips.length < MAX_TIPS) spawnSeed(); // a small structural kick to match the hit
  }

  function drawRings() {
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#FFFFF0';
    ctx.lineWidth = 1;
    const size = Math.max(2, CELL - 1);
    const next = [];
    for (const ring of rings) {
      ring.r += ring.speed;
      ring.alpha -= 0.018;
      if (ring.alpha > 0.02 && ring.r < GRID_RADIUS * 1.15) {
        const numPoints = Math.min(300, Math.max(20, Math.floor(ring.r * 0.9)));
        ctx.globalAlpha = ring.alpha * 0.85;
        for (let i = 0; i < numPoints; i++) {
          const angle = (i / numPoints) * Math.PI * 2;
          const px = Math.round(CX + Math.cos(angle) * ring.r * CELL);
          const py = Math.round(CY + Math.sin(angle) * ring.r * CELL);
          if (px < -CELL || px > W + CELL || py < -CELL || py > H + CELL) continue;
          ctx.strokeRect(px - size / 2 + 0.5, py - size / 2 + 0.5, size, size);
        }
        next.push(ring);
      }
    }
    rings = next;
    ctx.globalAlpha = 1;
  }

  // Bass erosion via cymatic standing wave patterns (Chladni figures).
  // Bass level maps to mode number — low bass erodes along simple rings,
  // high bass erodes along complex petal/grid intersections. Only cells
  // that happen to sit on the NODAL LINES of the current wave pattern
  // get pushed toward void, so the negative space has geometric shape
  // rather than being random scatter.
  function bassErode(bass) {
    if (bass < 0.06 || recentAll.length === 0) return;
    const mode = 1 + bass * 5;
    const count = Math.floor(bass * bass * 92);
    const threshold = 0.14 + bass * 0.45;
    for (let i = 0; i < count; i++) {
      const [x, y] = recentAll[(Math.random() * recentAll.length) | 0];
      const key = canon(x, y);
      if (!cellState.has(key)) continue;
      const r = dist(x, y) / GRID_RADIUS;
      const theta = Math.atan2(y, x);
      const cymVal = Math.abs(Math.sin(mode * Math.PI * r) * Math.cos(8 * theta));
      if (cymVal < threshold) {
        // direct instant erase — bypasses the 90-frame ternary delay entirely
        eraseMark(x, y);
        cellState.delete(key);
      }
    }
  }

  // Treble erosion: only the outer ring (past MID_RADIUS) gets hit.
  // High treble creates a dissolving, sparkling corona at the orb's edge
  // while leaving the core untouched. Cells flash to accent color before
  // fading so the dissolution reads as a bright crackle, not just loss.
  function trebleEdge(treble) {
    if (treble < 0.08 || recentAll.length === 0) return;
    const count = Math.floor(treble * treble * 40);
    for (let i = 0; i < count; i++) {
      const [x, y] = recentAll[(Math.random() * recentAll.length) | 0];
      if (dist(x, y) < MID_RADIUS * 0.82) continue; // outer ring only
      const key = canon(x, y);
      const cell = cellState.get(key);
      if (!cell || cell.state !== 'yang') continue;
      const pal = palette();
      cell.color = pal.accent[(Math.random() * pal.accent.length) | 0];
      cell.state = 'changing';
      cell.dir = 'fading';
      cell.since = frameCount;
      drawChangingMark(x, y, cell.color);
    }
  }

  // The center nucleus: the organism's emergent seed point, fully audio-reactive.
  function decayBeatFlash() {
    if (beatFlash > 0.01) beatFlash *= 0.68; else beatFlash = 0;
  }

  function resetOrganism() {
    tips = [];
    cellState.clear();
    recentCore.length = 0;
    recentAll.length = 0;
    recentVoid.length = 0;
    frameCount = 0;
    bassFloor = 0.15;
    lastHitFrame = -999;
    rings = [];
    beatWindowFrames = 0;
    beatLockPulse = 0;
    silenceFrames = 0;
    dreaming = false;
    currentHexagram = 63;
    openSectors = 0xFF;
    for (let i = 0; i < 6; i++) hexBandFloor[i] = 0.08;
    for (let i = 0; i < 3; i++) spawnSeed();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    prevCtx.fillStyle = '#000'; prevCtx.fillRect(0, 0, W, H);
  }
  resetOrganism();

  function updateGrowth(bass, mid, treble) {
    // beat lock: growth only fires in the short window after each detected beat
    if (beatLockMode) {
      if (beatWindowFrames > 0) { beatWindowFrames--; }
      else { return; } // frozen between beats — only ageCells/decay continues
    }

    const energy = (bass + mid + treble) / 3;
    silenceEnergy = silenceEnergy * 0.92 + energy * 0.08;
    dreaming = silenceEnergy < SILENCE_THRESHOLD;
    if (dreaming) { silenceFrames++; } else { silenceFrames = 0; }

    const chaosMult = chaosMode ? 3.5 : 1;
    const hexMod = hexBranchMod();

    if (!dreaming) {
      if (tips.length < MAX_TIPS && Math.random() < bass * 0.32 * densityAmount * chaosMult) spawnSeed();
    } else if (silenceFrames > SILENCE_ONSET) {
      const dreamSeeds = Math.floor(2 + Math.random() * 3);
      for (let s = 0; s < dreamSeeds; s++) spawnFromVoid();
    }
    if (tips.length === 0) spawnSeed();

    const branchChance = (0.010 + mid * 0.14) * densityAmount * chaosMult * hexMod;
    const detailChance = treble * 0.3 * densityAmount * chaosMult;
    const wanderChance = chaosMode ? 0.35 : (0.05 + mid * 0.05);
    const next = [];

    for (let i = 0; i < tips.length; i++) {
      const t = tips[i];
      t.age++;

      // square-spiral schedule: always turn the same rotational way, and
      // lengthen the leg every other turn (1,1,2,2,3,3...). That growing-leg
      // part is what actually produces an outward spiral — a turn biased
      // toward one direction with random-length legs just traces a wobbly
      // closed loop near the origin, since nothing pushes it outward.
      let forcedTurn = false;
      if (swirlMode) {
        t.legProgress = (t.legProgress || 0) + 1;
        if (t.legProgress >= (t.legLen || 1)) forcedTurn = true;
      }

      const nx = t.x + t.dx, ny = t.y + t.dy;
      let wx = nx, wy = ny;
      if (toroidalMode) {
        const span = GRID_RADIUS * 2;
        if (wx >  GRID_RADIUS) wx -= span;
        if (wx < -GRID_RADIUS) wx += span;
        if (wy >  GRID_RADIUS) wy -= span;
        if (wy < -GRID_RADIUS) wy += span;
      }
      const r = dist(wx, wy);
      // rim tendrils get extra reach so they visibly shoot out beyond the orb edge
      const boundary = (t.isRimTendril && tendrilsMode) ? GRID_RADIUS * 1.45 : GRID_RADIUS;

      if (!toroidalMode && r > boundary) {
        t.age = t.life;
      } else if (!forcedTurn && !isBlocked(wx, wy)) {
        t.x = wx; t.y = wy;
        plotCell(t.x, t.y, t.color);
      } else if (swirlMode) {
        const ndx = -t.dy, ndy = t.dx;
        t.dx = ndx; t.dy = ndy;
        t.legProgress = 0;
        t.turnCount = (t.turnCount || 0) + 1;
        if (t.turnCount % 2 === 0) t.legLen = (t.legLen || 1) + 1;
      } else {
        const turn = Math.random() < 0.5 ? 1 : -1;
        const ndx = -t.dy * turn, ndy = t.dx * turn;
        t.dx = ndx; t.dy = ndy;
      }

      if (!swirlMode && Math.random() < wanderChance) {
        const turn = Math.random() < 0.5 ? 1 : -1;
        const ndx = -t.dy * turn, ndy = t.dx * turn;
        t.dx = ndx; t.dy = ndy;
      }

      if (tips.length + next.length < MAX_TIPS && Math.random() < branchChance) {
        next.push({
          x: t.x, y: t.y, dx: -t.dy, dy: t.dx,
          age: 0, life: (swirlMode ? 600 : 150) + Math.random() * (swirlMode ? 400 : 300),
          color: colorForRadius(dist(t.x, t.y)),
          legLen: 1, legProgress: 0, turnCount: 0,
          isRimTendril: t.isRimTendril, // propagate rim status to branches
        });
      }

      if (tips.length + next.length < MAX_TIPS && Math.random() < detailChance) {
        const d = DIRS[(Math.random() * 4) | 0];
        next.push({
          x: t.x, y: t.y, dx: d[0], dy: d[1],
          age: 0, life: 18 + Math.random() * 36, color: colorForRadius(dist(t.x, t.y)),
          legLen: 1, legProgress: 0, turnCount: 0,
        });
      }

      // fractal tendrils: periodically spawn new rim tips rather than internal
      // branch cascades — the orb exhales arms from its edge outward
      if (tendrilsMode && Math.random() < 0.004 * chaosMult) {
        spawnRimTendril();
      }
      // rim tendrils also self-branch at 3 depth levels for fractal sub-arms
      if (tendrilsMode && t.isRimTendril && Math.random() < 0.025) {
        for (let depth = 1; depth <= 3; depth++) {
          if (tips.length + next.length >= MAX_TIPS) break;
          const scale = 1 / Math.pow(2, depth - 1);
          const turnDir = depth % 2 === 0 ? 1 : -1;
          next.push({
            x: t.x, y: t.y,
            dx: -t.dy * turnDir, dy: t.dx * turnDir,
            age: 0,
            life: Math.max(8, Math.floor((100 + Math.random() * 120) * scale)),
            color: colorForRadius(dist(t.x, t.y)),
            legLen: Math.max(1, Math.floor(4 * scale)),
            legProgress: 0, turnCount: 0,
            isRimTendril: true,
          });
        }
      }

      if (t.age < t.life && (toroidalMode || dist(t.x, t.y) <= GRID_RADIUS)) next.push(t);
    }
    tips = next;

    // thicken the core into solid contiguous blocks — this is the main
    // thing that makes it read as an "orb" instead of a sprawl of wires
    // 10× range: at silence bass+mid≈0 → 2 cells/frame, at peak → ~52 cells/frame
    densifyCore(Math.floor((2 + (bass + mid) * 50) * densityAmount * (chaosMode ? 2 : 1) * (constellationMode ? 0.3 : 1)));
  }

  // ---------- render loop ----------
  // ---------- constellation mode ----------
  // samples settled (yang) cells each frame and draws thin axis-aligned
  // connection lines to nearby settled neighbors in all 8 mirror sectors.
  // Both endpoints get the same D4 transform so lines stay perfectly
  // orthogonal in every sector. Drawn after the prevCanvas snapshot so
  // the connections are purely transient — they redraw every frame from
  // current cell state rather than baking into the persistent structure.
  function drawConstellationLines() {
    if (!constellationMode) return;
    const REACH = 22;
    const SAMPLE = 120;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.0;

    for (let s = 0; s < SAMPLE; s++) {
      if (recentAll.length === 0) break;
      const [x, y] = recentAll[(Math.random() * recentAll.length) | 0];
      if (!cellState.has(canon(x, y))) continue;
      const cell = cellState.get(canon(x, y));
      if (cell.state !== 'yang') continue;

      for (const [dx, dy] of DIRS) {
        let found = false;
        for (let step = 3; step <= REACH && !found; step++) {
          const nx = x + dx * step, ny = y + dy * step;
          const nc = cellState.get(canon(nx, ny));
          if (nc && nc.state === 'yang') {
            found = true;
            ctx.strokeStyle = cell.color;
            ctx.globalAlpha = 0.45;
            for (let i = 0; i < 8; i++) {
              if (!(openSectors & (1 << i))) continue;
              const [px1, py1] = D4[i](x, y);
              const [px2, py2] = D4[i](nx, ny);
              const sx1 = Math.round(CX + px1 * CELL) + (CELL >> 1);
              const sy1 = Math.round(CY + py1 * CELL) + (CELL >> 1);
              const sx2 = Math.round(CX + px2 * CELL) + (CELL >> 1);
              const sy2 = Math.round(CY + py2 * CELL) + (CELL >> 1);
              ctx.beginPath();
              ctx.moveTo(sx1, sy1);
              ctx.lineTo(sx2, sy2);
              ctx.stroke();
            }
          }
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // small indicator for beat lock — a dot that pulses gold on a hit and
  // dims to near-invisible between beats so you can feel the gate opening
  // Color flow with coherent sweep front. Instead of fully random sampling,
  // a sweepAngle rotates each frame and cells near that angle are far more
  // likely to have their colors moved — creating a visible rotating wave
  // rather than incoherent static shimmer.
  function flowColors(steps, direction) {
    if (recentAll.length < 2) return;
    sweepAngle = (sweepAngle + direction * (0.05 + currentBass * 0.06)) % (Math.PI * 2);

    for (let i = 0; i < steps; i++) {
      const [x, y] = recentAll[(Math.random() * recentAll.length) | 0];
      const key = canon(x, y);
      const cell = cellState.get(key);
      if (!cell || cell.state !== 'yang') continue;

      // probability drops sharply away from the sweep front
      const angle = Math.atan2(y, x);
      const diff = ((angle - sweepAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      if (Math.random() > Math.exp(-diff * diff * 6)) continue;

      const ax = Math.abs(x), ay = Math.abs(y);
      if (ax === 0 && ay === 0) continue;
      let tdx, tdy;
      if (ax >= ay) {
        tdx = 0; tdy = direction * (x >= 0 ? 1 : -1);
      } else {
        tdx = direction * (y >= 0 ? -1 : 1); tdy = 0;
      }
      const tx = x + tdx, ty = y + tdy;
      const tkey = canon(tx, ty);
      if (tkey === key) continue;
      const tcell = cellState.get(tkey);
      if (!tcell || tcell.state !== 'yang') continue;

      const tmp = cell.color;
      cell.color = tcell.color;
      tcell.color = tmp;

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.globalAlpha = 1;
      forEachMirrorPixel(x, y, (sx, sy) => ctx.fillRect(sx, sy, CELL, CELL));
      drawYangMark(x, y, cell.color, 0.8);
      ctx.fillStyle = '#000';
      forEachMirrorPixel(tx, ty, (sx, sy) => ctx.fillRect(sx, sy, CELL, CELL));
      drawYangMark(tx, ty, tcell.color, 0.8);
    }
  }

  function drawBeatLockIndicator() {
    if (!beatLockMode) return;
    if (beatWindowFrames === BEAT_WINDOW) beatLockPulse = 1;
    beatLockPulse *= 0.82;

    const firing = beatLockPulse > 0.25;
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'right';

    if (firing) {
      ctx.fillStyle = '#FFD700';
      ctx.globalAlpha = beatLockPulse;
      ctx.fillText('▶ FIRE', W - 20, H - 20);
    } else {
      ctx.fillStyle = '#3a3014';
      ctx.globalAlpha = 0.7;
      ctx.fillText('■ LOCK', W - 20, H - 20);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function renderFrame(bass, mid, treble) {
    currentBass = bass;
    const energy = (bass + mid + treble) / 3;

    if (fractalMode) {
      trailsOpacity = Math.min(1, trailsOpacity + 0.06);
    } else {
      trailsOpacity = Math.max(0, trailsOpacity - 0.008);
    }

    // ---------- BASS: direct black fill opacity ----------
    // The single most obvious audio effect. Bass directly controls how much
    // black is painted over the structure each frame. At silence ~0 alpha
    // (structure fully persists). At peak bass ~0.35 alpha (structure visibly
    // dims and pulses on every hit). Simple, immediate, unmistakable.
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 0.02 + bass * 0.33;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    // draw the persisted structure on top
    ctx.save();
    const beatScale = 1.0 + beatFlash * 0.09;
    const trailScale = trailsOpacity > 0.01 ? 1.0 + (0.0008 + bass * 0.0025) * trailsOpacity : 1.0;
    const zf = beatScale * trailScale;
    if (zf > 1.0005) {
      ctx.translate(CX, CY);
      ctx.scale(zf, zf);
      ctx.translate(-CX, -CY);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(prevCanvas, 0, 0, W, H);
    ctx.restore();

    computeHexagram();
    updateGrowth(bass, mid, treble);
    ageCells(308, energy);
    colorTemp = colorTemp * 0.94 + mid * 0.06;
    bassErode(bass);
    trebleEdge(treble);

    // ---------- SPIN: deterministic full-ring color rotation ----------
    // Every frame in spin mode, ALL cells rotate their color to the next
    // cell in the tangential direction. No sampling, no probability — all
    // cells at every radius ring advance together. You will see it spin.
    if (spinMode) rotateAllColors(1);
    if (colorSwirlMode) rotateAllColors(1);

    // snapshot BEFORE the wave overlay so waves stay transient
    prevCtx.drawImage(canvas, 0, 0);

    // ---------- BASS WAVES: radial sine rings ----------
    // Bright concentric rings drawn directly on canvas each frame.
    // Contract toward center with bass, expand outward with treble.
    // Completely direct — drawn fresh every frame, always visible.
    drawBassWaves(bass, mid, treble);

    detectBeat(bass);
    decayBeatFlash();
    drawRings();
    drawTorusSeam();
    drawConstellationLines();
    drawBeatLockIndicator();
    drawHexagramDisplay();
    drawObjects3D(bass, mid);
  }

  // Rotate ALL cell colors one step tangentially around center.
  // Collects every occupied cell, sorts by angle, shifts colors by 1 position.
  // No probability — the whole ring moves together, visibly.
  let spinColorBuf = [];
  function rotateAllColors(direction) {
    spinColorBuf.length = 0;
    for (const [key, cell] of cellState) {
      if (cell.state !== 'yang') continue;
      const parts = key.split(',');
      const ax = parseInt(parts[0]), ay = parseInt(parts[1]);
      const angle = Math.atan2(ay, ax);
      spinColorBuf.push({ key, cell, angle });
    }
    if (spinColorBuf.length < 2) return;
    // sort by angle
    spinColorBuf.sort((a, b) => a.angle - b.angle);
    // shift all colors by 1 step in the rotation direction
    const n = spinColorBuf.length;
    const shift = direction > 0 ? 1 : n - 1;
    const tmp = spinColorBuf[0].cell.color;
    for (let i = 0; i < n - 1; i++) {
      spinColorBuf[i].cell.color = spinColorBuf[(i + shift) % n].cell.color;
    }
    spinColorBuf[n - 1].cell.color = tmp;
    // repaint affected cells with new colors
    ctx.globalCompositeOperation = 'source-over';
    for (const { key, cell } of spinColorBuf) {
      const parts = key.split(',');
      const ax = parseInt(parts[0]), ay = parseInt(parts[1]);
      ctx.fillStyle = '#000';
      ctx.globalAlpha = 1;
      forEachMirrorPixel(ax, ay, (sx, sy) => ctx.fillRect(sx, sy, CELL, CELL));
      drawYangMark(ax, ay, cell.color, 0.85);
    }
    ctx.globalAlpha = 1;
  }

  // Radial sine wave rings drawn directly as colored annular brightness pulses.
  // Bass makes rings contract inward, treble pushes them outward.
  // Mid controls ring color temperature. Rings are always visible.
  let wavePhase = 0;
  function drawBassWaves(bass, mid, treble) {
    if (bass < 0.04 && treble < 0.04) return;
    wavePhase += bass * 0.18 + treble * 0.09;
    const maxR = GRID_RADIUS * CELL * 1.1;
    const ringCount = 3 + Math.floor(bass * 4);
    const pal = palette();

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < ringCount; i++) {
      const t = (i / ringCount + wavePhase * 0.04) % 1;
      const r = t * maxR;
      const alpha = Math.sin(t * Math.PI) * (0.08 + bass * 0.18 + treble * 0.08);
      if (alpha < 0.01) continue;
      const pool = mid > 0.4 ? pal.cool : pal.warm;
      const col = pool[(i + Math.floor(wavePhase)) % pool.length];
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(1, CELL - 1);
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(CX, CY, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // faint square seam lines show the torus "fold" points — where growth
  // that exits the right edge re-enters from the left. Without these,
  // wrapping is invisible since the canvas still looks like a normal orb.
  function drawTorusSeam() {
    if (!toroidalMode) return;
    const edge = GRID_RADIUS * CELL;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#2EC4B6';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.globalAlpha = 0.28 + 0.12 * Math.sin(frameCount * 0.03);
    // draw the 4 seam edges of the rectangular torus grid
    ctx.strokeRect(CX - edge, CY - edge, edge * 2, edge * 2);
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // draws the live hexagram as 6 small lines bottom-center — yin broken,
  // yang solid — plus a subtle "dreaming" label when silence mode is active
  function drawHexagramDisplay() {
    const bw = 18, bh = 3, gap = 5, margin = 22;
    const startX = Math.round(CX - bw / 2);
    const startY = H - margin - (6 * (bh + gap));
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 6; i++) {
      const yang = !!(currentHexagram & (1 << i));
      const y = startY + (5 - i) * (bh + gap);
      ctx.fillStyle = yang ? '#FFD700' : '#3a3014';
      ctx.globalAlpha = 0.75;
      if (yang) {
        ctx.fillRect(startX, y, bw, bh);
      } else {
        // broken line: two short segments with a gap in the middle
        const seg = Math.floor(bw * 0.38);
        ctx.fillRect(startX, y, seg, bh);
        ctx.fillRect(startX + bw - seg, y, seg, bh);
      }
    }
    if (dreaming && silenceFrames > SILENCE_ONSET) {
      ctx.font = '9px monospace';
      ctx.fillStyle = '#3FA7FF';
      ctx.globalAlpha = 0.55 + 0.3 * Math.sin(frameCount * 0.04);
      ctx.textAlign = 'center';
      ctx.fillText('dreaming', CX, startY - 8);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // ---------- false-3D objects ----------
  const _TS = 80, _PS = 200;
  const _cosT = new Float32Array(_TS), _sinT = new Float32Array(_TS);
  const _cosP = new Float32Array(_PS), _sinP = new Float32Array(_PS);
  for (let i = 0; i < _TS; i++) { const a = i/_TS*Math.PI*2; _cosT[i]=Math.cos(a); _sinT[i]=Math.sin(a); }
  for (let j = 0; j < _PS; j++) { const a = j/_PS*Math.PI*2; _cosP[j]=Math.cos(a); _sinP[j]=Math.sin(a); }
  let _zBuf = null, _lBuf = null, _zBufW = 0, _zBufH = 0;

  // ox/oy: screen-space offset as fraction of organism radius
  // sA/sB: base rotation speed (negative = reverse axis)
  // aA/aB: current angles (staggered so they start in different orientations)
  const _objs = [
    { R: 1.0,  r: 0.36, ox: -0.38, oy: -0.28, sA:  0.007, sB:  0.003, aA: 0,    aB: 1.0  },
    { R: 1.0,  r: 0.36, ox:  0.30, oy:  0.22, sA: -0.003, sB:  0.008, aA: 1.57, aB: 3.14 },
    { R: 0.60, r: 0.24, ox:  0.22, oy: -0.44, sA:  0.011, sB:  0.005, aA: 3.0,  aB: 0.5  },
    { R: 0.52, r: 0.20, ox: -0.22, oy:  0.40, sA: -0.005, sB: -0.009, aA: 0.8,  aB: 2.2  },
  ];

  function drawObjects3D(bass, mid) {
    const orbR = GRID_RADIUS * CELL;
    const K    = orbR * 0.88;
    const D    = 3.0;
    const sc   = 1.0 + beatFlash * 0.15;
    const lx   = -0.45, ly = 0.60, lz = 0.66;

    const GW = Math.ceil(W / CELL) + 2, GH = Math.ceil(H / CELL) + 2;
    if (GW !== _zBufW || GH !== _zBufH) {
      _zBuf = new Float32Array(GW * GH).fill(-99); _lBuf = new Float32Array(GW * GH);
      _zBufW = GW; _zBufH = GH;
    } else { _zBuf.fill(-99); }

    for (const o of _objs) {
      o.aA += o.sA * (1.0 + bass * 3.0);
      o.aB += o.sB * (1.0 + mid  * 3.0);
      const cosA = Math.cos(o.aA), sinA = Math.sin(o.aA);
      const cosB = Math.cos(o.aB), sinB = Math.sin(o.aB);
      const pcx = CX + o.ox * orbR, pcy = CY + o.oy * orbR;

      for (let i = 0; i < _TS; i++) {
        const cosT = _cosT[i], sinT = _sinT[i], rCosT = o.r*cosT, rSinT = o.r*sinT;
        for (let j = 0; j < _PS; j++) {
          const cosP = _cosP[j], sinP = _sinP[j];
          const ox = (o.R + rCosT)*cosP, oy = (o.R + rCosT)*sinP;
          const oy1 = oy*cosA - rSinT*sinA, oz1 = oy*sinA + rSinT*cosA;
          const rx = ox*cosB - oy1*sinB, ry = ox*sinB + oy1*cosB, rz = oz1;
          const ny1 = cosT*sinP*cosA - sinT*sinA, nz1 = cosT*sinP*sinA + sinT*cosA;
          const rnx = cosT*cosP*cosB - ny1*sinB,  rny = cosT*cosP*sinB + ny1*cosB;
          const L = rnx*lx + rny*ly + nz1*lz;
          const zp = rz + D; if (zp < 0.1) continue;
          const gi = Math.round((pcx + rx*K*sc/zp) / CELL);
          const gj = Math.round((pcy + ry*K*sc/zp) / CELL);
          if (gi < 0 || gi >= GW || gj < 0 || gj >= GH) continue;
          const idx = gj*GW + gi;
          if (rz > _zBuf[idx]) { _zBuf[idx] = rz; _lBuf[idx] = L; }
        }
      }
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#111111';
    for (let gj = 0; gj < GH; gj++) for (let gi = 0; gi < GW; gi++) {
      const idx = gj*GW+gi; if (_zBuf[idx] === -99) continue;
      const L = _lBuf[idx]; if (L >= 0) continue;
      ctx.globalAlpha = Math.min(0.55, -L*0.75);
      ctx.fillRect(gi*CELL, gj*CELL, CELL, CELL);
    }
    ctx.fillStyle = '#FFFFFF';
    for (let gj = 0; gj < GH; gj++) for (let gi = 0; gi < GW; gi++) {
      const idx = gj*GW+gi; if (_zBuf[idx] === -99) continue;
      const L = _lBuf[idx]; if (L <= 0) continue;
      ctx.globalAlpha = Math.min(1, L*1.1)*0.95;
      ctx.fillRect(gi*CELL, gj*CELL, CELL, CELL);
    }
    ctx.globalAlpha = 1;
  }

  // ── drawing mode ──────────────────────────────────────────────────────────
  // Touch/mouse painting plants bold flat filled cells, 8-fold mirrored.
  // Cells are immediately 'yang' (settled) so strokes appear with no delay
  // and look like the bold flat graphic style of the reference images.
  // The organism treats drawn cells as established structure and branches from them.

  let drawMode  = false;
  let isDrawing = false;
  let brushPx   = 24;  // brush radius in screen pixels — converted to grid cells at draw time
  let drawColor = null; // null = use active palette; set by color picker

  function currentDrawColor() {
    if (drawColor) return drawColor;
    const pal = palette();
    return pal.warm[(Math.floor(frameCount * 0.01)) % pal.warm.length];
  }

  function plotCellBold(x, y, color) {
    const key = canon(x, y);
    if (color === 'erase') {
      if (cellState.has(key)) { cellState.delete(key); eraseMark(x, y); }
      return;
    }
    // Immediately settled — no forming delay, appears bold and flat at once
    cellState.set(key, { state: 'yang', dir: 'forming', since: frameCount - YANG_LIFE_BASE, color });
    recentAll.push([x, y]);
    if (recentAll.length > RECENT_ALL_MAX) recentAll.shift();
    if (dist(x, y) < CORE_RADIUS) {
      recentCore.push([x, y]);
      if (recentCore.length > RECENT_CORE_MAX) recentCore.shift();
    }
    // Bold solid fill instead of the usual outline mark
    const pts = mirror8(x, y);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = color;
    ctx.globalAlpha = 1;
    for (let i = 0; i < 8; i++) {
      if (!(openSectors & (1 << i))) continue;
      const sx = Math.round(CX + pts[i][0] * CELL);
      const sy = Math.round(CY + pts[i][1] * CELL);
      if (sx < -CELL || sx > W + CELL || sy < -CELL || sy > H + CELL) continue;
      ctx.fillRect(sx, sy, CELL, CELL);
    }
    ctx.globalAlpha = 1;
    // NOTE: prevCtx.drawImage is intentionally NOT called here per-cell.
    // drawAtPoint calls it once after the full brush stroke completes.
  }

  function drawAtPoint(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width  / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (clientX - rect.left) * scaleX;
    const py = (clientY - rect.top)  * scaleY;
    const gx = Math.round((px - CX) / CELL);
    const gy = Math.round((py - CY) / CELL);
    // Convert screen-pixel brush radius to grid cells
    const brushCells = Math.max(1, Math.round(brushPx / CELL));
    const r2 = brushCells * brushCells;
    const col = currentDrawColor();
    for (let dx = -brushCells; dx <= brushCells; dx++) {
      for (let dy = -brushCells; dy <= brushCells; dy++) {
        if (dx*dx + dy*dy <= r2) {
          const nx = gx + dx, ny = gy + dy;
          if (Math.abs(nx) <= GRID_RADIUS && Math.abs(ny) <= GRID_RADIUS)
            plotCellBold(nx, ny, col === 'erase' ? 'erase' : col);
        }
      }
    }
    // Bake the whole stroke into prevCanvas in one shot — not per-cell
    prevCtx.drawImage(canvas, 0, 0);
  }

  canvas.addEventListener('touchstart',  e => { if (!drawMode) return; e.preventDefault(); isDrawing = true;  for (const t of e.changedTouches) drawAtPoint(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('touchmove',   e => { if (!drawMode || !isDrawing) return; e.preventDefault(); for (const t of e.changedTouches) drawAtPoint(t.clientX, t.clientY); }, { passive: false });
  canvas.addEventListener('touchend',    () => { isDrawing = false; });
  canvas.addEventListener('touchcancel', () => { isDrawing = false; });
  canvas.addEventListener('mousedown',   e => { if (!drawMode) return; isDrawing = true;  drawAtPoint(e.clientX, e.clientY); });
  canvas.addEventListener('mousemove',   e => { if (!drawMode || !isDrawing) return; drawAtPoint(e.clientX, e.clientY); });
  canvas.addEventListener('mouseup',     () => { isDrawing = false; });
  canvas.addEventListener('mouseleave',  () => { isDrawing = false; });

  // ── zoom ──────────────────────────────────────────────────────────────────
  // CSS transform zoom — no simulation changes, pure visual scaling.
  let zoom = 1.0;
  let lastPinchDist = null;

  function applyZoom() {
    canvas.style.transform = `scale(${zoom})`;
    const pct = Math.round(zoom * 100) + '%';
    const lbl = document.getElementById('zoomLabel');
    const hud = document.getElementById('zoomHud');
    if (lbl) lbl.textContent = pct;
    if (hud) hud.textContent = zoom.toFixed(1) + '×';
  }

  function setZoom(z) {
    zoom = Math.max(0.25, Math.min(5.0, z));
    applyZoom();
  }

  // Pinch-to-zoom (two fingers on iPad)
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lastPinchDist = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const d = Math.hypot(
        e.touches[1].clientX - e.touches[0].clientX,
        e.touches[1].clientY - e.touches[0].clientY
      );
      if (lastPinchDist) setZoom(zoom * (d / lastPinchDist));
      lastPinchDist = d;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (e.touches.length < 2) lastPinchDist = null;
  });

  // Scroll wheel zoom (desktop)
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(zoom * (e.deltaY < 0 ? 1.08 : 0.93));
  }, { passive: false });

  // ── burst ──────────────────────────────────────────────────────────────────
  // Clears drawn cells from the center zone and fires a fresh radial seed
  // burst, restoring the emergent pattern without resetting the whole organism.
  function burstFromCenter() {
    // erase drawn cells in the core area
    const toDelete = [];
    for (const [key] of cellState) {
      const [ax, ay] = key.split(',').map(Number);
      if (Math.sqrt(ax*ax + ay*ay) < CORE_RADIUS * 0.85) toDelete.push([key, ax, ay]);
    }
    toDelete.forEach(([key, ax, ay]) => { cellState.delete(key); eraseMark(ax, ay); });

    // spawn a radial burst of seeds
    for (let i = 0; i < 24; i++) spawnSeed();
    // add a ring of seeds mid-way out for more visual structure
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const r = Math.round(CORE_RADIUS * 0.6);
      const bx = Math.round(r * Math.cos(angle));
      const by = Math.round(r * Math.sin(angle));
      const d = DIRS[(Math.random() * 4) | 0];
      tips.push({ x: bx, y: by, dx: d[0], dy: d[1], age: 0, life: 180 + Math.random() * 120, color: colorForRadius(r), legLen: 1, legProgress: 0, turnCount: 0 });
    }
  }

  // ---------- audio analysis ----------
  let analyser = null, freqData = null;
  let bassLevel = 0, midLevel = 0, trebleLevel = 0;

  function setupAnalyser(sourceNode, audioCtx) {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.15; // lower = less built-in lag, snappier response
    sourceNode.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }

  function updateAudioLevels() {
    if (!analyser) {
      const t = performance.now() / 1000;
      bassLevel   = 0.30 + 0.18 * Math.sin(t * 0.31);
      midLevel    = 0.22 + 0.14 * Math.sin(t * 0.53 + 1.3);
      trebleLevel = 0.14 + 0.10 * Math.sin(t * 0.91 + 2.6);
      return;
    }
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    const bassEnd = Math.floor(n * 0.08);
    const midEnd  = Math.floor(n * 0.35);
    let b = 0, m = 0, tr = 0;
    for (let i = 0; i < bassEnd; i++) b += freqData[i];
    for (let i = bassEnd; i < midEnd; i++) m += freqData[i];
    for (let i = midEnd; i < n; i++) tr += freqData[i];
    b  = Math.min(1, (b  / ((bassEnd * 255) || 1)) * sensitivity);
    m  = Math.min(1, (m  / ((midEnd - bassEnd) * 255 || 1)) * sensitivity);
    tr = Math.min(1, (tr / ((n - midEnd) * 255 || 1)) * sensitivity);
    // less weight on history = the displayed levels track the actual audio
    // more tightly instead of smoothing it out
    bassLevel   = bassLevel   * 0.3 + b  * 0.7;
    midLevel    = midLevel    * 0.3 + m  * 0.7;
    trebleLevel = trebleLevel * 0.3 + tr * 0.7;
  }

  // ---------- BYOB multi-listener hook (stub for future wiring) ----------
  // Each connected listener becomes a seed cluster; sync quality scales how
  // tightly their growth locks into the shared symmetry. Not wired to a
  // real network here — call this from BYOB's session state once ready.
  window.ingestListenerNode = function(nodeId, syncQuality /* 0..1 */) {
    for (let i = 0; i < Math.ceil(1 + syncQuality * 2); i++) spawnSeed();
  };

  // ---------- UI wiring ----------
  const ui             = document.getElementById('ui');
  const toolbar        = document.getElementById('toolbar');
  const controlsToggle = document.getElementById('controlsToggle');
  const controlsPanel  = document.getElementById('controlsPanel');
  const bVal = document.getElementById('bVal');
  const mVal = document.getElementById('mVal');
  const tVal = document.getElementById('tVal');
  const nVal = document.getElementById('nVal');

  function enterRunningState() {
    ui.style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    toolbar.classList.remove('hidden');
    controlsToggle.style.display = 'block';
  }

  let panelOpen = false;
  controlsToggle.addEventListener('click', () => {
    panelOpen = !panelOpen;
    controlsPanel.style.display = panelOpen ? 'block' : 'none';
    controlsToggle.style.right = panelOpen ? '210px' : '0';
  });

  // Toolbar action buttons
  document.getElementById('resetBtn').addEventListener('click', resetOrganism);
  document.getElementById('burstBtn').addEventListener('click', burstFromCenter);
  document.getElementById('zoomInBtn').addEventListener('click',    () => setZoom(zoom * 1.25));
  document.getElementById('zoomOutBtn').addEventListener('click',   () => setZoom(zoom * 0.8));
  document.getElementById('zoomResetBtn').addEventListener('click', () => setZoom(1.0));

  // Sliders
  document.getElementById('sensSlider').addEventListener('input',  e => { sensitivity   = parseFloat(e.target.value); });
  document.getElementById('voidSlider').addEventListener('input',  e => { voidAmount    = parseFloat(e.target.value); });
  document.getElementById('densSlider').addEventListener('input',  e => { densityAmount = parseFloat(e.target.value); });
  document.getElementById('brushSlider').addEventListener('input', e => { brushPx = parseInt(e.target.value); });

  // Draw color swatches
  document.querySelectorAll('.dcb').forEach(btn => {
    btn.addEventListener('click', () => {
      const col = btn.dataset.col;
      drawColor = (col === 'palette') ? null : col;
      document.querySelectorAll('.dcb').forEach(b => b.style.outline = '');
      btn.style.outline = '2px solid #FFD700';
    });
  });

  function wireToggle(id, getSet) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('click', () => {
      const next = !getSet();
      getSet(next);
      btn.classList.toggle('active', next);
    });
  }
  wireToggle('ringsToggle',        v => v === undefined ? ringsEnabled     : (ringsEnabled     = v));
  wireToggle('chaosToggle',        v => v === undefined ? chaosMode        : (chaosMode        = v));
  wireToggle('swirlToggle',        v => v === undefined ? swirlMode        : (swirlMode        = v));
  wireToggle('colorSwirlToggle',   v => v === undefined ? colorSwirlMode   : (colorSwirlMode   = v));
  wireToggle('fractalToggle',      v => v === undefined ? fractalMode      : (fractalMode      = v));
  wireToggle('constellationToggle',v => v === undefined ? constellationMode: (constellationMode= v));
  wireToggle('beatLockToggle',     v => v === undefined ? beatLockMode     : (beatLockMode     = v));
  wireToggle('toroidalToggle',     v => v === undefined ? toroidalMode     : (toroidalMode     = v));
  wireToggle('spinToggle',         v => v === undefined ? spinMode         : (spinMode         = v));
  wireToggle('tendrilsToggle',     v => v === undefined ? tendrilsMode     : (tendrilsMode     = v));
  wireToggle('asymToggle',         v => v === undefined ? asymMode         : (asymMode         = v));
  wireToggle('drawToggle', v => {
    if (v === undefined) return drawMode;
    drawMode = v;
    document.getElementById('drawControls').style.display = v ? 'block' : 'none';
    canvas.style.cursor = v ? 'crosshair' : 'default';
    return drawMode;
  });

  document.querySelectorAll('#paletteButtons button').forEach(btn => {
    btn.addEventListener('click', () => {
      activePaletteName = btn.dataset.palette;
      document.querySelectorAll('#paletteButtons button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.getElementById('micBtn').addEventListener('click', async () => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AC();
      await audioCtx.resume(); // iOS often starts this suspended even from a tap handler
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const src = audioCtx.createMediaStreamSource(stream);
      setupAnalyser(src, audioCtx);
      watchAudioContext(audioCtx);
      enterRunningState();
    } catch (err) {
      alert('Microphone access failed: ' + err.message);
    }
  });

  document.getElementById('fileBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const audioEl = document.getElementById('audioEl');
    audioEl.src = URL.createObjectURL(file);
    const AC = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AC();
    await audioCtx.resume();
    const src = audioCtx.createMediaElementSource(audioEl);
    src.connect(audioCtx.destination);
    setupAnalyser(src, audioCtx);
    watchAudioContext(audioCtx);
    await audioEl.play();
    enterRunningState();
  });

  // iOS likes to suspend the AudioContext again on backgrounding/lock —
  // resume it whenever the tab regains focus so it doesn't go silent mid-session
  function watchAudioContext(audioCtx) {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });
  }

  document.getElementById('idleBtn').addEventListener('click', enterRunningState);

  resetBtn.addEventListener('click', resetOrganism);

  // ---------- main loop ----------
  let hudTick = 0;
  function loop() {
    frameCount++;
    updateAudioLevels();
    renderFrame(bassLevel, midLevel, trebleLevel);

    hudTick++;
    if (hudTick % 12 === 0) {
      bVal.textContent = bassLevel.toFixed(2);
      mVal.textContent = midLevel.toFixed(2);
      tVal.textContent = trebleLevel.toFixed(2);
      nVal.textContent = tips.length;
    }
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
</body>
</html>
