<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circuit Organism — Recursive Music Visualizer</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #000; width: 100%; height: 100%;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }

  #ui {
    position: fixed; top: 24px; left: 24px; z-index: 10;
    background: rgba(0,0,0,0.72);
    border: 1px solid #5a4a1c;
    padding: 20px 22px;
    color: #f0e6c8;
    max-width: 340px;
    box-shadow: 0 0 18px rgba(255,191,0,0.12);
  }
  #ui h1 {
    font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #FFD700; margin: 0 0 6px 0; font-weight: normal;
  }
  #ui p { font-size: 12px; line-height: 1.5; color: #b8ad8a; margin: 0 0 16px 0; }
  #ui button {
    display: block; width: 100%; background: #0a0a0a; color: #FFD700;
    border: 1px solid #FFD700; padding: 10px 12px; margin-bottom: 10px;
    font-family: inherit; font-size: 12px; letter-spacing: 0.05em;
    cursor: pointer; text-transform: uppercase;
  }
  #ui button:hover { background: #1a1a0a; }
  #ui input[type=file] { display: none; }
  #ui .or { text-align: center; color: #5a4a1c; font-size: 10px; margin: 6px 0; letter-spacing: 0.1em; }

  #hud {
    position: fixed; bottom: 18px; left: 24px; z-index: 9;
    color: #6a5a2a; font-size: 10px; letter-spacing: 0.08em;
    display: none;
  }
  #hud span { color: #FFD700; }
  #resetBtn {
    position: fixed; bottom: 18px; right: 24px; z-index: 9;
    background: transparent; color: #5a4a1c; border: 1px solid #3a3014;
    font-family: inherit; font-size: 10px; padding: 8px 12px;
    cursor: pointer; letter-spacing: 0.08em; display: none;
  }
  #resetBtn:hover { color: #FFD700; border-color: #FFD700; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<audio id="audioEl" loop></audio>

<div id="ui">
  <h1>Circuit Organism</h1>
  <p>A living electronic civilization grown from sound. Bass seeds new structure, mids drive branching, treble adds detail. Choose an audio source to begin — or let it idle on ambient pulses.</p>
  <button id="micBtn">Use Microphone</button>
  <div class="or">— or —</div>
  <label for="fileInput"><button id="fileBtn" type="button">Upload Audio File</button></label>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg,.aiff,.caf">
  <div class="or">— or —</div>
  <button id="idleBtn">Skip — Run Ambient Mode</button>
</div>

<div id="hud">bass <span id="bVal">0.00</span> &nbsp; mid <span id="mVal">0.00</span> &nbsp; treble <span id="tVal">0.00</span> &nbsp; nodes <span id="nVal">0</span></div>
<button id="resetBtn">reset organism</button>

<script>
(function(){
  "use strict";

  // ---------- canvas setup ----------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  const prevCanvas = document.createElement('canvas');
  const prevCtx = prevCanvas.getContext('2d', { alpha: false });
  prevCtx.imageSmoothingEnabled = false;

  // ---------- world / growth simulation ----------
  // Square lattice, 8-fold symmetry implemented as the D4 dihedral group
  // (4 rotations x 2 reflections) of a single primary wedge. Because all
  // growth is strictly axis-aligned, every mirrored copy stays axis-aligned
  // too — true 45° kaleidoscope tiling on a square grid would need
  // interpolation and would break the "no curves, orthogonal only" rule.
  //
  // Growth is hard-bounded to a circle (GRID_RADIUS) rather than a square,
  // and split into two zones: a dense CORE that gets actively filled solid
  // (the contiguous orb body), and a sparser ring out to MID_RADIUS where
  // thin circuit tendrils are allowed to radiate before the boundary stops
  // them — this is what gives the contained-orb-with-a-corona look instead
  // of open-ended sprawl.
  const GRID_RADIUS = 170;
  const CORE_RADIUS = 55;
  const MID_RADIUS = 107;

  let W, H, CX, CY, CELL;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    prevCanvas.width = W; prevCanvas.height = H;
    CX = W / 2; CY = H / 2;
    // size cells off the smaller viewport dimension so the orb always sits
    // centered and consistently proportioned, in a square window or a wide one
    CELL = Math.max(2, Math.floor((Math.min(W, H) * 0.9) / GRID_RADIUS));
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    prevCtx.fillStyle = '#000';
    prevCtx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- palette ----------
  const WARM = ['#FFD700', '#E0115F', '#FFBF00', '#FF6F3C', '#FF4040'];
  const COOL = ['#50C878', '#0F52BA', '#9B5DE5', '#2EC4B6', '#3FA7FF', '#7FFF6B'];
  const ACCENT = ['#FFFFF0', '#FF3CAC', '#FFE45C'];

  function dist(x, y) { return Math.sqrt(x * x + y * y); }

  // colors blend smoothly by radius instead of switching at hard cutoffs.
  // The old version locked anything inside CORE_RADIUS to warm-only — but
  // the core dilation pass generates the large majority of all cells, so
  // that made the whole piece read as red/gold no matter what the rim did.
  // Now even dead-center has real odds of pulling cool/accent tones.
  function colorForRadius(r) {
    if (Math.random() < 0.1) return ACCENT[(Math.random() * ACCENT.length) | 0];
    const t = Math.min(1, r / GRID_RADIUS); // 0 at center, 1 at the edge
    const coolChance = 0.32 + t * 0.45; // ~32% cool at center, ~77% at the rim
    const pool = Math.random() < coolChance ? COOL : WARM;
    return pool[(Math.random() * pool.length) | 0];
  }

  // ---------- ternary cell lifecycle ----------
  // Binary occupied/empty replaced with the three states from the ternary
  // clock work: void (yin — true negative space), becoming (changing — a
  // cell that is either forming or fading, rendered as a broken/open
  // square rather than a closed one), and settled (yang — fully formed,
  // closed outline). A cell always passes through "becoming" in both
  // directions: nothing snaps directly from solid to void or void to
  // solid. Keyed by canonical symmetry-class (abs + sort) rather than raw
  // (x,y) so all 8 mirrored copies share one state and age in lockstep.
  const cellState = new Map(); // canonKey -> { state, dir, since, color }
  let frameCount = 0;

  function canon(x, y) {
    const ax = Math.abs(x), ay = Math.abs(y);
    return ax >= ay ? (ax + ',' + ay) : (ay + ',' + ax);
  }

  // ring buffers sampled probabilistically rather than scanning the full
  // map every frame — cheap, and exactness doesn't matter for organic growth
  const recentCore = []; // cells near center, sampled by the core dilation pass
  const RECENT_CORE_MAX = 220;
  const recentAll = []; // every cell ever plotted, sampled by the aging pass
  const RECENT_ALL_MAX = 5000;

  const FORM_DURATION = 90; // frames spent "becoming" before settling or finishing a vanish
  const YANG_LIFE_BASE = 600; // ~10s of settled life at full audio energy
  const YANG_LIFE_MIN = 90; // ~1.5s during near-silence — this is what carves negative space

  function mirror8(x, y) {
    return [
      [ x,  y], [ y,  x],
      [-x,  y], [-y,  x],
      [ x, -y], [ y, -x],
      [-x, -y], [-y, -x],
    ];
  }

  function forEachMirrorPixel(x, y, cb) {
    const pts = mirror8(x, y);
    for (let i = 0; i < 8; i++) {
      const sx = Math.round(CX + pts[i][0] * CELL);
      const sy = Math.round(CY + pts[i][1] * CELL);
      if (sx < -CELL || sx > W + CELL || sy < -CELL || sy > H + CELL) continue;
      cb(sx, sy);
    }
  }

  // settled (yang): a closed square outline — the "resolved" mark
  function drawYangMark(x, y, color, energy) {
    const drawSize = Math.max(2, CELL - 2);
    const offset = (CELL - drawSize) / 2;
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = Math.min(1, 0.72 + (energy || 0.6) * 0.28);
    forEachMirrorPixel(x, y, (sx, sy) => {
      ctx.strokeRect(sx + offset + 0.5, sy + offset + 0.5, drawSize, drawSize);
    });
    ctx.globalAlpha = 1;
  }

  // becoming (changing): an open square, brackets at two opposite corners
  // only — a different line type for "neither yin nor yang," used both
  // when a cell is forming and when it's mid-vanish
  function drawChangingMark(x, y, color) {
    const drawSize = Math.max(2, CELL - 2);
    const offset = (CELL - drawSize) / 2;
    const arm = Math.max(1, Math.round(drawSize * 0.5));
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.85;
    forEachMirrorPixel(x, y, (sx, sy) => {
      const left = sx + offset + 0.5, top = sy + offset + 0.5;
      const right = left + drawSize, bottom = top + drawSize;
      ctx.beginPath();
      ctx.moveTo(left + arm, top); ctx.lineTo(left, top); ctx.lineTo(left, top + arm);
      ctx.moveTo(right - arm, bottom); ctx.lineTo(right, bottom); ctx.lineTo(right, bottom - arm);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }

  // void (yin): actively erased — real negative space, not just absence
  function eraseMark(x, y) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.globalAlpha = 1;
    forEachMirrorPixel(x, y, (sx, sy) => { ctx.fillRect(sx, sy, CELL, CELL); });
  }

  function plotCell(x, y, color) {
    const key = canon(x, y);
    cellState.set(key, { state: 'changing', dir: 'forming', since: frameCount, color });
    if (dist(x, y) < CORE_RADIUS) {
      recentCore.push([x, y]);
      if (recentCore.length > RECENT_CORE_MAX) recentCore.shift();
    }
    recentAll.push([x, y]);
    if (recentAll.length > RECENT_ALL_MAX) recentAll.shift();
    drawChangingMark(x, y, color);
  }

  // samples recently-plotted cells and advances their state machine:
  // changing→yang (settled), changing→void (vanished + erased), or
  // yang→changing (decay begins). `energy` (roughly 0..1, overall audio
  // loudness) shortens settled life when it's low — quiet passages erode
  // structure into real negative space faster than loud ones.
  function ageCells(amount, energy) {
    const yangLife = Math.max(YANG_LIFE_MIN, YANG_LIFE_BASE * Math.min(1, energy * 2.2));
    for (let i = 0; i < amount; i++) {
      if (recentAll.length === 0) return;
      const [x, y] = recentAll[(Math.random() * recentAll.length) | 0];
      const key = canon(x, y);
      const cell = cellState.get(key);
      if (!cell) continue;
      const elapsed = frameCount - cell.since;
      if (cell.state === 'changing' && elapsed > FORM_DURATION) {
        if (cell.dir === 'forming') {
          cell.state = 'yang'; cell.since = frameCount;
          drawYangMark(x, y, cell.color, energy);
        } else {
          cellState.delete(key);
          eraseMark(x, y);
        }
      } else if (cell.state === 'yang' && elapsed > yangLife) {
        cell.state = 'changing'; cell.dir = 'fading'; cell.since = frameCount;
        drawChangingMark(x, y, cell.color);
      }
    }
  }

  function densifyCore(amount) {
    for (let i = 0; i < amount; i++) {
      if (recentCore.length === 0) return;
      const [bx, by] = recentCore[(Math.random() * recentCore.length) | 0];
      const d = DIRS[(Math.random() * 4) | 0];
      const nx = bx + d[0], ny = by + d[1];
      if (dist(nx, ny) < CORE_RADIUS && !isBlocked(nx, ny)) {
        plotCell(nx, ny, colorForRadius(dist(nx, ny)));
      }
    }
  }

  function isBlocked(x, y) {
    return cellState.has(canon(x, y));
  }

  const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];

  let tips = [];
  const MAX_TIPS = 800;

  function spawnSeed() {
    const d = DIRS[(Math.random() * 4) | 0];
    tips.push({
      x: 0, y: 0, dx: d[0], dy: d[1],
      age: 0, life: 240 + Math.random() * 420,
      color: colorForRadius(0),
    });
  }

  function resetOrganism() {
    tips = [];
    cellState.clear();
    recentCore.length = 0;
    recentAll.length = 0;
    frameCount = 0;
    for (let i = 0; i < 3; i++) spawnSeed();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    prevCtx.fillStyle = '#000'; prevCtx.fillRect(0, 0, W, H);
  }
  resetOrganism();

  function updateGrowth(bass, mid, treble) {
    if (tips.length < MAX_TIPS && Math.random() < bass * 0.32) spawnSeed();
    if (tips.length === 0) spawnSeed();

    // tuned low enough that growth keeps expanding into open territory
    // instead of filling its whole footprint within a few seconds
    const branchChance = 0.010 + mid * 0.14;
    const detailChance = treble * 0.3;
    const wanderChance = 0.05 + mid * 0.05;
    const next = [];

    for (let i = 0; i < tips.length; i++) {
      const t = tips[i];
      t.age++;

      const nx = t.x + t.dx, ny = t.y + t.dy;
      const r = dist(nx, ny);

      if (r > GRID_RADIUS) {
        // hit the orb's edge — retire here instead of sprawling past it,
        // which is what keeps the silhouette a contained circle
        t.age = t.life;
      } else if (!isBlocked(nx, ny)) {
        t.x = nx; t.y = ny;
        plotCell(t.x, t.y, t.color);
      } else {
        const turn = Math.random() < 0.5 ? 1 : -1;
        const ndx = -t.dy * turn, ndy = t.dx * turn;
        t.dx = ndx; t.dy = ndy;
      }

      if (Math.random() < wanderChance) {
        const turn = Math.random() < 0.5 ? 1 : -1;
        const ndx = -t.dy * turn, ndy = t.dx * turn;
        t.dx = ndx; t.dy = ndy;
      }

      if (tips.length + next.length < MAX_TIPS && Math.random() < branchChance) {
        next.push({
          x: t.x, y: t.y, dx: -t.dy, dy: t.dx,
          age: 0, life: 150 + Math.random() * 300, color: colorForRadius(dist(t.x, t.y)),
        });
      }

      if (tips.length + next.length < MAX_TIPS && Math.random() < detailChance) {
        const d = DIRS[(Math.random() * 4) | 0];
        next.push({
          x: t.x, y: t.y, dx: d[0], dy: d[1],
          age: 0, life: 18 + Math.random() * 36, color: colorForRadius(dist(t.x, t.y)),
        });
      }

      if (t.age < t.life && dist(t.x, t.y) <= GRID_RADIUS) next.push(t);
    }
    tips = next;

    // thicken the core into solid contiguous blocks — this is the main
    // thing that makes it read as an "orb" instead of a sprawl of wires
    densifyCore(Math.floor(2 + (bass + mid) * 10));
  }

  // ---------- render loop ----------
  function renderFrame(bass, mid, treble) {
    // structure stays spatially fixed — decay is no longer a generic global
    // fade, it's the ternary lifecycle below (settled → becoming → void),
    // so this is just a faint safety fade for anything outside that system
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.999;
    ctx.drawImage(prevCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;

    updateGrowth(bass, mid, treble);
    ageCells(220, (bass + mid + treble) / 3);

    prevCtx.drawImage(canvas, 0, 0);
  }

  // ---------- audio analysis ----------
  let analyser = null, freqData = null;
  let bassLevel = 0, midLevel = 0, trebleLevel = 0;

  function setupAnalyser(sourceNode, audioCtx) {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.78;
    sourceNode.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }

  function updateAudioLevels() {
    if (!analyser) {
      const t = performance.now() / 1000;
      bassLevel   = 0.30 + 0.18 * Math.sin(t * 0.31);
      midLevel    = 0.22 + 0.14 * Math.sin(t * 0.53 + 1.3);
      trebleLevel = 0.14 + 0.10 * Math.sin(t * 0.91 + 2.6);
      return;
    }
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    const bassEnd = Math.floor(n * 0.08);
    const midEnd  = Math.floor(n * 0.35);
    let b = 0, m = 0, tr = 0;
    for (let i = 0; i < bassEnd; i++) b += freqData[i];
    for (let i = bassEnd; i < midEnd; i++) m += freqData[i];
    for (let i = midEnd; i < n; i++) tr += freqData[i];
    b  /= (bassEnd * 255) || 1;
    m  /= ((midEnd - bassEnd) * 255) || 1;
    tr /= ((n - midEnd) * 255) || 1;
    bassLevel   = bassLevel   * 0.7 + b  * 0.3;
    midLevel    = midLevel    * 0.7 + m  * 0.3;
    trebleLevel = trebleLevel * 0.7 + tr * 0.3;
  }

  // ---------- BYOB multi-listener hook (stub for future wiring) ----------
  // Each connected listener becomes a seed cluster; sync quality scales how
  // tightly their growth locks into the shared symmetry. Not wired to a
  // real network here — call this from BYOB's session state once ready.
  window.ingestListenerNode = function(nodeId, syncQuality /* 0..1 */) {
    for (let i = 0; i < Math.ceil(1 + syncQuality * 2); i++) spawnSeed();
  };

  // ---------- UI wiring ----------
  const ui = document.getElementById('ui');
  const hud = document.getElementById('hud');
  const resetBtn = document.getElementById('resetBtn');
  const bVal = document.getElementById('bVal');
  const mVal = document.getElementById('mVal');
  const tVal = document.getElementById('tVal');
  const nVal = document.getElementById('nVal');

  function enterRunningState() {
    ui.style.display = 'none';
    hud.style.display = 'block';
    resetBtn.style.display = 'block';
  }

  document.getElementById('micBtn').addEventListener('click', async () => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AC();
      await audioCtx.resume(); // iOS often starts this suspended even from a tap handler
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const src = audioCtx.createMediaStreamSource(stream);
      setupAnalyser(src, audioCtx);
      watchAudioContext(audioCtx);
      enterRunningState();
    } catch (err) {
      alert('Microphone access failed: ' + err.message);
    }
  });

  document.getElementById('fileBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const audioEl = document.getElementById('audioEl');
    audioEl.src = URL.createObjectURL(file);
    const AC = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AC();
    await audioCtx.resume();
    const src = audioCtx.createMediaElementSource(audioEl);
    src.connect(audioCtx.destination);
    setupAnalyser(src, audioCtx);
    watchAudioContext(audioCtx);
    await audioEl.play();
    enterRunningState();
  });

  // iOS likes to suspend the AudioContext again on backgrounding/lock —
  // resume it whenever the tab regains focus so it doesn't go silent mid-session
  function watchAudioContext(audioCtx) {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });
  }

  document.getElementById('idleBtn').addEventListener('click', enterRunningState);

  resetBtn.addEventListener('click', resetOrganism);

  // ---------- main loop ----------
  let hudTick = 0;
  function loop() {
    frameCount++;
    updateAudioLevels();
    renderFrame(bassLevel, midLevel, trebleLevel);

    hudTick++;
    if (hudTick % 12 === 0) {
      bVal.textContent = bassLevel.toFixed(2);
      mVal.textContent = midLevel.toFixed(2);
      tVal.textContent = trebleLevel.toFixed(2);
      nVal.textContent = tips.length;
    }
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
</body>
</html>
