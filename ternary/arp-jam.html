<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>♦ ARP JAM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#060610;color:#e8e4f0;font-family:'Barlow Condensed',system-ui,sans-serif;overflow-x:hidden;}
body{display:flex;flex-direction:column;}
:root{
  --teal:#00cba9;--rim:#18182e;--card:#0c0c1a;--muted:#484868;--muted2:#606080;
  --mono:'DM Mono',monospace;
}

/* ── Header ── */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--rim);flex-shrink:0;}
.logo{font-size:16px;font-weight:900;letter-spacing:.12em;color:var(--teal);}
.hdr-title{flex:1;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--muted2);}
.hdr-status{font-size:9px;font-family:var(--mono);color:var(--muted);text-align:right;line-height:1.4;}

/* ── Step visualizer ── */
.steps-bar{display:flex;align-items:center;gap:5px;padding:8px 14px 6px;border-bottom:1px solid #0e0e1e;flex-shrink:0;}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #22223a;background:var(--card);transition:background .07s,box-shadow .07s;flex-shrink:0;}
.dot.on{background:var(--teal);border-color:var(--teal);box-shadow:0 0 8px rgba(0,203,169,.6);}
.dot.next{background:#122820;border-color:var(--teal);}
.form-lbl{margin-left:auto;font-size:9px;font-family:var(--mono);color:var(--muted2);flex-shrink:0;white-space:nowrap;}

/* ── Sections ── */
.section{padding:8px 12px;border-bottom:1px solid #0e0e1e;flex-shrink:0;}
.lbl{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:700;}

/* ── Hex keyboard ── */
.hex-kb-wrap{padding:8px 12px 6px;border-bottom:1px solid #0e0e1e;flex-shrink:0;}
#hex-canvas{display:block;margin:0 auto;touch-action:none;cursor:pointer;border-radius:4px;}

/* ── Chord strip ── */
.chord-strip{display:flex;align-items:center;gap:8px;padding:5px 12px 6px;border-bottom:1px solid #0e0e1e;flex-shrink:0;background:#08081a;min-height:36px;}
.cs-sym{font-size:18px;line-height:1;flex-shrink:0;}
.cs-name{font-size:11px;font-weight:700;letter-spacing:.04em;}
.cs-chord{font-size:9px;color:var(--teal);font-family:var(--mono);}
.cs-notes{font-size:9px;color:var(--muted2);flex:1;text-align:right;font-family:var(--mono);letter-spacing:.06em;}
.cs-mode{font-size:7px;color:var(--muted);letter-spacing:.08em;display:block;}

/* ── Trigram chips ── */
.tgm-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 12px 8px;border-bottom:1px solid #0e0e1e;flex-shrink:0;}
.tgm-chip{padding:5px 2px 4px;border-radius:5px;border:1.5px solid var(--rim);background:var(--card);cursor:pointer;text-align:center;transition:border-color .12s,background .12s;user-select:none;}
.tgm-chip .tc-sym{display:block;font-size:15px;line-height:1.25;}
.tgm-chip .tc-nm {display:block;font-size:6.5px;font-family:var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:1px;}
.tgm-chip .tc-ch {display:block;font-size:6px;font-family:var(--mono);color:var(--muted2);letter-spacing:.04em;margin-top:1px;}
.tgm-chip.active{border-color:var(--tgm-col,var(--teal));background:color-mix(in srgb,var(--tgm-col,var(--teal)) 10%,var(--card));}
.tgm-chip.active .tc-ch{color:var(--tgm-col,var(--teal));}
.tgm-chip:active{transform:scale(.94);}

/* ── Style buttons ── */
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.style-btn{padding:7px 3px 5px;border-radius:6px;border:1.5px solid var(--rim);background:var(--card);cursor:pointer;transition:all .1s;user-select:none;text-align:center;font-size:11px;font-weight:700;letter-spacing:.05em;color:#7070a0;}
.style-btn.active{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--card));}
.style-btn:active{transform:scale(.95);}
.style-sub{font-size:6.5px;color:var(--muted);display:block;margin-top:1px;letter-spacing:.06em;}

/* ── Sliders ── */
.sl-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.sl-lbl{font-size:8px;font-family:var(--mono);color:var(--muted2);width:28px;flex-shrink:0;}
.sl-val{font-size:8px;font-family:var(--mono);color:#8080a0;width:38px;text-align:right;flex-shrink:0;}
input[type=range]{
  -webkit-appearance:none;flex:1;height:3px;border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--teal) var(--pct,50%),#1e1e34 var(--pct,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--teal);box-shadow:0 0 5px rgba(0,203,169,.4);
}
.sl-meta{display:flex;justify-content:space-between;font-size:7px;color:var(--muted);margin-top:1px;}

/* ── BPM ── */
.bpm-row{display:flex;align-items:center;gap:8px;}
.bpm-adj{width:32px;height:32px;border-radius:6px;border:1.5px solid var(--rim);background:var(--card);cursor:pointer;font-size:16px;color:#6060a0;display:flex;align-items:center;justify-content:center;transition:all .1s;flex-shrink:0;}
.bpm-adj:active{color:var(--teal);}
.bpm-disp{flex:1;text-align:center;font-size:24px;font-weight:900;cursor:pointer;line-height:1.1;}
.bpm-sub{font-size:8px;color:var(--muted);letter-spacing:.16em;display:block;}

/* ── Oct buttons ── */
.oct-btn{flex:1;padding:4px;border-radius:4px;border:1.5px solid var(--rim);background:var(--card);cursor:pointer;font-size:9px;font-weight:700;color:#6060a0;user-select:none;text-align:center;transition:all .1s;}
.oct-btn.active{border-color:var(--teal);color:var(--teal);background:#0e1a18;}

/* ── Play row ── */
.play-row{display:flex;gap:6px;padding:8px 12px 10px;flex-shrink:0;}
.play-btn{flex:1;padding:12px;border-radius:9px;border:none;cursor:pointer;font:900 15px 'Barlow Condensed',system-ui;letter-spacing:.1em;text-transform:uppercase;transition:all .12s;}
.play-btn.off{background:var(--card);border:1.5px solid var(--rim);color:#6060a0;}
.play-btn.on{background:var(--teal);color:#000;box-shadow:0 0 20px rgba(0,203,169,.25);}
.play-btn:active{transform:scale(.96);}
.pad-btn{background:var(--card);border:1.5px solid var(--rim);color:#9060c0;}
.pad-btn.on{background:#1a0a2e;border-color:#9060c0;color:#c090ff;box-shadow:0 0 16px rgba(144,96,192,.25);}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <span class="logo">BYOB</span>
  <span class="hdr-title">♦ ARP JAM</span>
  <div class="hdr-status" id="hdr-status">— not playing —</div>
</div>

<!-- Step visualizer -->
<div class="steps-bar">
  <div class="dot" id="dot-0"></div><div class="dot" id="dot-1"></div>
  <div class="dot" id="dot-2"></div><div class="dot" id="dot-3"></div>
  <div class="dot" id="dot-4"></div><div class="dot" id="dot-5"></div>
  <div class="dot" id="dot-6"></div><div class="dot" id="dot-7"></div>
  <div class="dot" id="dot-8"></div>
  <span class="form-lbl" id="form-lbl">— ·</span>
</div>

<!-- Hex keyboard -->
<div class="hex-kb-wrap">
  <div class="lbl">Keyboard · Wicki-Hayden · right=+2st · up-right=+P5</div>
  <canvas id="hex-canvas"></canvas>
</div>

<!-- Chord strip -->
<div class="chord-strip">
  <span class="cs-sym" id="cs-sym">☷</span>
  <div style="flex:0 0 auto;">
    <div style="display:flex;align-items:baseline;gap:6px;">
      <span class="cs-name" id="cs-name">Earth</span>
      <span class="cs-chord" id="cs-chord">Major</span>
    </div>
    <span class="cs-mode" id="cs-mode">AUTO · tap chip to lock</span>
  </div>
  <span class="cs-notes" id="cs-notes">C4  E  G</span>
</div>

<!-- Trigram selector -->
<div class="tgm-row" id="tgm-row"></div>

<!-- Pattern -->
<div class="section">
  <div class="lbl">Pattern</div>
  <div class="g5" id="style-grid"></div>
</div>

<!-- Envelope -->
<div class="section">
  <div class="lbl">Envelope</div>
  <div class="sl-row"><span class="sl-lbl">A</span><input type="range" id="sl-a" min="1" max="500" value="7" oninput="onEnv()"/><span class="sl-val" id="vl-a">7ms</span></div>
  <div class="sl-row"><span class="sl-lbl">D</span><input type="range" id="sl-d" min="10" max="800" value="55" oninput="onEnv()"/><span class="sl-val" id="vl-d">55ms</span></div>
  <div class="sl-row"><span class="sl-lbl">S</span><input type="range" id="sl-s" min="0" max="100" value="58" style="--pct:58%" oninput="onEnv()"/><span class="sl-val" id="vl-s">58%</span></div>
  <div class="sl-row"><span class="sl-lbl">R</span><input type="range" id="sl-r" min="10" max="1500" value="90" oninput="onEnv()"/><span class="sl-val" id="vl-r">90ms</span></div>
  <div class="sl-row"><span class="sl-lbl">Gate</span><input type="range" id="sl-gate" min="10" max="200" value="82" style="--pct:37%" oninput="onEnv()"/><span class="sl-val" id="vl-gate">82%</span></div>
</div>

<!-- Reverb -->
<div class="section">
  <div class="lbl">Reverb</div>
  <div class="sl-row">
    <span class="sl-lbl">Mix</span>
    <input type="range" id="sl-rev" min="0" max="100" value="28" style="--pct:28%" oninput="onReverb(this)"/>
    <span class="sl-val" id="vl-rev">28%</span>
  </div>
  <div class="sl-meta"><span>dry</span><span>wet</span></div>
</div>

<!-- Pad -->
<div class="section">
  <div class="lbl">Drone pad</div>
  <div class="sl-row"><span class="sl-lbl">Mix</span><input type="range" id="sl-pmix" min="0" max="100" value="45" style="--pct:45%" oninput="onPad()"/><span class="sl-val" id="vl-pmix">45%</span></div>
  <div class="sl-row"><span class="sl-lbl">Bright</span><input type="range" id="sl-pbri" min="0" max="100" value="35" style="--pct:35%" oninput="onPad()"/><span class="sl-val" id="vl-pbri">35%</span></div>
  <div class="sl-row"><span class="sl-lbl">Evolve</span><input type="range" id="sl-pevo" min="0" max="100" value="25" style="--pct:25%" oninput="onPad()"/><span class="sl-val" id="vl-pevo">25%</span></div>
  <div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
    <div class="lbl" style="margin:0;line-height:2;flex-shrink:0;">Oct</div>
    <div style="display:flex;gap:4px;flex:1;">
      <button class="oct-btn" id="poct--2" onclick="setPadOct(-2)">−2</button>
      <button class="oct-btn active" id="poct--1" onclick="setPadOct(-1)">−1</button>
      <button class="oct-btn" id="poct-0"  onclick="setPadOct(0)">0</button>
      <button class="oct-btn" id="poct-1"  onclick="setPadOct(1)">+1</button>
    </div>
  </div>
</div>

<!-- BPM -->
<div class="section">
  <div class="lbl">BPM</div>
  <div class="bpm-row">
    <button class="bpm-adj" onclick="shiftBpm(-5)">−</button>
    <div class="bpm-disp" id="bpm-disp" onclick="tapBpm()">120<span class="bpm-sub">BPM · TAP</span></div>
    <button class="bpm-adj" onclick="shiftBpm(+5)">+</button>
  </div>
</div>

<!-- Play row -->
<div class="play-row">
  <button class="play-btn off" id="arp-btn" onclick="toggleArp()">▶ ARP</button>
  <button class="play-btn pad-btn off" id="pad-btn" onclick="togglePad()">♩ PAD</button>
</div>

<script src="arp.js?v=3"></script>
<script src="pad.js?v=3"></script>
<script>
// ── Standalone stubs ──────────────────────────────────────────────────────────
window.syncedNow  = () => Date.now();
window._masterBPM = null;
const _refMs = Date.now() - (Date.now() % (27 * 500));
window._terGetZone = () => ({ playback_started_at: new Date(_refMs).toISOString() });

// ── Data ──────────────────────────────────────────────────────────────────────
const NOTE_NAMES    = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const IS_ACCIDENTAL = [0,1,0,1,0,0,1,0,1,0,1,0];

const TGM = {
  NNN:{ sym:'☰', name:'Heaven',   chord:'Maj 7', ivs:[0,4,7,11], col:'#e8d840' },
  NNP:{ sym:'☱', name:'Lake',     chord:'Maj 6', ivs:[0,4,7,9],  col:'#50c0e8' },
  NPN:{ sym:'☲', name:'Fire',     chord:'Dom 7', ivs:[0,4,7,10], col:'#e85030' },
  NPP:{ sym:'☳', name:'Thunder',  chord:'½-dim', ivs:[0,3,6,10], col:'#9050e8' },
  PNN:{ sym:'☴', name:'Wind',     chord:'Sus4+9',ivs:[0,5,7,12], col:'#50d870' },
  PNP:{ sym:'☵', name:'Water',    chord:'Min 7', ivs:[0,3,7,10], col:'#3060e0' },
  PPN:{ sym:'☶', name:'Mountain', chord:'Dim 7', ivs:[0,3,6,9],  col:'#8090a0' },
  PPP:{ sym:'☷', name:'Earth',    chord:'Major', ivs:[0,4,7],    col:'#00cba9' },
};

// ── Wicki-Hayden hex keyboard ─────────────────────────────────────────────────
// Interval map: E(right)=+2, NE(upper-right)=+7, NW(upper-left)=+5
// Switchable layout — only dq/dr change for other isomorphic layouts.
const LAYOUT = {
  dq: 2,   // right: major second (+2 semitones)
  dr: 7,   // up-right: perfect fifth (+7 semitones)
  base: 38, // D2 — puts C4 at (q=4, r=2): 38+8+14=60
};

const HEX_COLS = 7;
const HEX_ROWS = 5;

let _hexR, _ox, _oy;
let _rootMidi  = 60;   // C4
let _flashPcs  = new Set();
let _prevTgmKey = 'PPP';

const hexCvs = document.getElementById('hex-canvas');
const hexCtx = hexCvs.getContext('2d');

function hexMidi(q, r) { return LAYOUT.base + q * LAYOUT.dq + r * LAYOUT.dr; }

function hexCenter(q, r) {
  return {
    x: _ox + _hexR * Math.sqrt(3) * (q + r / 2),
    y: _oy - _hexR * 1.5 * r,
  };
}

function initHexKeyboard() {
  const W = Math.max(200, hexCvs.parentElement.clientWidth - 24);
  _hexR = W / (Math.sqrt(3) * (HEX_COLS + (HEX_ROWS - 1) / 2 + 0.5));
  hexCvs.width  = Math.ceil(W);
  hexCvs.height = Math.ceil(_hexR * (1.5 * HEX_ROWS + 0.5));
  _ox = _hexR * Math.sqrt(3) * 0.5;
  _oy = hexCvs.height - _hexR * 0.75;
  drawHexKeyboard();
}

function hexFill(midi) {
  const pc       = midi % 12;
  const chordIvs = window._terArp?.chordIntervals?.() ?? [0, 4, 7];
  const rootPc   = _rootMidi % 12;
  const isRoot   = midi === _rootMidi;
  const isOctave = !isRoot && pc === rootPc;
  const isChord  = chordIvs.some(iv => (rootPc + iv) % 12 === pc);
  const isFlash  = _flashPcs.has(pc);
  const isC      = pc === 0;

  if (isFlash)  return { bg:'#ffffff', border:'#ffffff', text:'#000000', glow:0 };
  if (isRoot)   return { bg:'#00cba9', border:'#00efcc', text:'#001a14', glow:16 };
  if (isOctave) return { bg:'#003d2c', border:'#007a58', text:'#00cba9', glow:0 };
  if (isChord)  return { bg:'#071e18', border:'#005a42', text:'#009a7c', glow:0 };
  if (isC)      return { bg:'#100c20', border:'#2a2050', text:'#5050a0', glow:0 };
  if (IS_ACCIDENTAL[pc]) return { bg:'#080813', border:'#141426', text:'#303050', glow:0 };
  return                  { bg:'#0c0c1c', border:'#1a1a30', text:'#3c3c6c', glow:0 };
}

function drawHexKeyboard() {
  hexCtx.clearRect(0, 0, hexCvs.width, hexCvs.height);
  for (let r = 0; r < HEX_ROWS; r++) {
    for (let q = 0; q < HEX_COLS; q++) {
      const midi     = hexMidi(q, r);
      const { x, y } = hexCenter(q, r);
      const fill     = hexFill(midi);
      const pc       = midi % 12;
      const oct      = Math.floor(midi / 12) - 1;
      const hSize    = _hexR - 1.5;

      // Hex shape
      hexCtx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 3 * i - Math.PI / 6;
        i ? hexCtx.lineTo(x + hSize * Math.cos(a), y + hSize * Math.sin(a))
          : hexCtx.moveTo(x + hSize * Math.cos(a), y + hSize * Math.sin(a));
      }
      hexCtx.closePath();
      if (fill.glow) { hexCtx.shadowColor = fill.border; hexCtx.shadowBlur = fill.glow; }
      hexCtx.fillStyle = fill.bg; hexCtx.fill();
      hexCtx.shadowBlur = 0;
      hexCtx.strokeStyle = fill.border; hexCtx.lineWidth = 1.5; hexCtx.stroke();

      // Labels
      hexCtx.textAlign = 'center'; hexCtx.textBaseline = 'middle';
      hexCtx.font = `700 ${Math.round(_hexR * 0.42)}px 'Barlow Condensed',system-ui`;
      hexCtx.fillStyle = fill.text;
      hexCtx.fillText(NOTE_NAMES[pc], x, y - _hexR * 0.1);
      hexCtx.globalAlpha = 0.6;
      hexCtx.font = `${Math.round(_hexR * 0.26)}px 'DM Mono',monospace`;
      hexCtx.fillText(oct, x, y + _hexR * 0.34);
      hexCtx.globalAlpha = 1;
    }
  }
}

function hitHex(cx, cy) {
  let best = null, bestD = Infinity;
  for (let r = 0; r < HEX_ROWS; r++) {
    for (let q = 0; q < HEX_COLS; q++) {
      const { x, y } = hexCenter(q, r);
      const d = Math.hypot(cx - x, cy - y);
      if (d < bestD) { bestD = d; best = { q, r }; }
    }
  }
  return bestD <= _hexR ? best : null;
}

function canvasXY(e) {
  const rect = hexCvs.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (hexCvs.width  / rect.width),
    y: (src.clientY - rect.top)  * (hexCvs.height / rect.height),
  };
}

hexCvs.addEventListener('touchstart', e => {
  e.preventDefault();
  const h = hitHex(...Object.values(canvasXY(e)));
  if (h) selectRoot(hexMidi(h.q, h.r));
}, { passive: false });

hexCvs.addEventListener('mousedown', e => {
  const h = hitHex(...Object.values(canvasXY(e)));
  if (h) selectRoot(hexMidi(h.q, h.r));
});

// Flash hex when arp plays — receives midi from _terArpOnStep callback
window._terArpOnStep = ({ midi }) => {
  if (midi == null) return;
  _flashPcs.add(midi % 12);
  drawHexKeyboard();
  setTimeout(() => { _flashPcs.delete(midi % 12); drawHexKeyboard(); }, 75);
};

function selectRoot(midi) {
  _rootMidi = midi;
  window._terArp?.setRoot(midi);
  if (_lockedTrigram) {
    const t = TGM[_lockedTrigram];
    if (t) window._terPad?.setChord(t.ivs, midi);
  }
  updateChordStrip();
  drawHexKeyboard();
}

// ── Trigram chips ─────────────────────────────────────────────────────────────
let _lockedTrigram = null;

function buildTrigramRow() {
  const row = document.getElementById('tgm-row');
  Object.entries(TGM).forEach(([key, t]) => {
    const chip = document.createElement('div');
    chip.className = 'tgm-chip';
    chip.id = `tgm-${key}`;
    chip.style.setProperty('--tgm-col', t.col);
    chip.innerHTML =
      `<span class="tc-sym">${t.sym}</span>` +
      `<span class="tc-nm">${t.name}</span>` +
      `<span class="tc-ch">${t.chord}</span>`;
    chip.onclick = () => toggleTrigram(key);
    row.appendChild(chip);
  });
}

function toggleTrigram(key) {
  if (_lockedTrigram === key) {
    _lockedTrigram = null;
    window._terArp?.clearTrigram();
    document.querySelectorAll('.tgm-chip').forEach(c => c.classList.remove('active'));
  } else {
    _lockedTrigram = key;
    window._terArp?.setTrigram(key);
    const t = TGM[key];
    if (t) window._terPad?.setChord(t.ivs, _rootMidi);
    document.querySelectorAll('.tgm-chip').forEach(c => c.classList.remove('active'));
    document.getElementById(`tgm-${key}`)?.classList.add('active');
  }
  updateChordStrip();
  drawHexKeyboard();
}

function updateChordStrip() {
  const key = _lockedTrigram ?? (window._terArp?.getTrigramKey?.() ?? 'PPP');
  const t   = TGM[key] ?? TGM.PPP;
  const rpc = _rootMidi % 12;
  const oct = Math.floor(_rootMidi / 12) - 1;
  const notes = [NOTE_NAMES[rpc] + oct, ...t.ivs.slice(1).map(iv => NOTE_NAMES[(rpc + iv) % 12])].join('  ');

  document.getElementById('cs-sym').textContent   = t.sym;
  document.getElementById('cs-name').textContent  = t.name;
  document.getElementById('cs-chord').textContent = t.chord;
  document.getElementById('cs-notes').textContent = notes;
  document.getElementById('cs-mode').textContent  = _lockedTrigram
    ? `LOCKED · tap ${t.sym} again to release`
    : 'AUTO · tap a chip to lock';
  document.getElementById('hdr-status').textContent = `${t.sym} ${key} · ${NOTE_NAMES[rpc]}${oct}`;
}

// ── Pattern buttons ───────────────────────────────────────────────────────────
const STYLES = {
  UP:'↑ ascend', DOWN:'↓ descend', BOUNCE:'↕ leap', FOLD:'↑↓ fold', SKIP:'· skip ·',
  PULSE:'● pulse', CLAVE:'3+2 clave', EUCLID:'5/9 grid', STUTTER:'× stutter', OFFBEAT:'⇢ offbeat',
  PENDULUM:'~ wave', CONVERGE:'⟩⟨ close', LOCK:'⌛ lock', GHOST:'· · ghost', SPIRAL:'↗ spiral',
};
let _style = 'UP';

function buildStyles() {
  const g = document.getElementById('style-grid');
  Object.entries(STYLES).forEach(([k, d]) => {
    const b = document.createElement('button');
    b.className = `style-btn ${k === _style ? 'active' : ''}`;
    b.id = `s-${k}`;
    b.innerHTML = `${k}<span class="style-sub">${d}</span>`;
    b.onclick = () => {
      _style = k; window._terArp?.setStyle(k);
      document.querySelectorAll('.style-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
    g.appendChild(b);
  });
}

// ── Reverb ────────────────────────────────────────────────────────────────────
function onReverb(el) {
  const v = +el.value / 100;
  window._terArp?.setReverbMix(v);
  document.getElementById('vl-rev').textContent = Math.round(v * 100) + '%';
  el.style.setProperty('--pct', (v * 100).toFixed(1) + '%');
}

// ── Envelope ──────────────────────────────────────────────────────────────────
function pct(v, mn, mx) { return ((v - mn) / (mx - mn) * 100).toFixed(1) + '%'; }

function onEnv() {
  const a    = +document.getElementById('sl-a').value / 1000;
  const d    = +document.getElementById('sl-d').value / 1000;
  const s    = +document.getElementById('sl-s').value / 100;
  const r    = +document.getElementById('sl-r').value / 1000;
  const gate = +document.getElementById('sl-gate').value / 100;
  window._terArp?.setEnvelope({ a, d, s, r, gate });
  document.getElementById('vl-a').textContent    = Math.round(a * 1000) + 'ms';
  document.getElementById('vl-d').textContent    = Math.round(d * 1000) + 'ms';
  document.getElementById('vl-s').textContent    = Math.round(s * 100) + '%';
  document.getElementById('vl-r').textContent    = Math.round(r * 1000) + 'ms';
  document.getElementById('vl-gate').textContent = Math.round(gate * 100) + '%';
  ['a','d','r'].forEach(k => {
    const el = document.getElementById(`sl-${k}`);
    el.style.setProperty('--pct', pct(+el.value, +el.min, +el.max));
  });
  document.getElementById('sl-s').style.setProperty('--pct', pct(s * 100, 0, 100));
  document.getElementById('sl-gate').style.setProperty('--pct', pct(gate * 100, 0.1, 2.0));
}

// ── Pad ───────────────────────────────────────────────────────────────────────
let _padOct = -1;

function onPad() {
  const mix = +document.getElementById('sl-pmix').value / 100;
  const bri = +document.getElementById('sl-pbri').value / 100;
  const evo = +document.getElementById('sl-pevo').value / 100;
  window._terPad?.setMix(mix);
  window._terPad?.setBrightness(bri);
  window._terPad?.setEvolution(evo);
  document.getElementById('vl-pmix').textContent = Math.round(mix * 100) + '%';
  document.getElementById('vl-pbri').textContent = Math.round(bri * 100) + '%';
  document.getElementById('vl-pevo').textContent = Math.round(evo * 100) + '%';
  ['pmix','pbri','pevo'].forEach(k => {
    const el = document.getElementById(`sl-${k}`);
    el.style.setProperty('--pct', pct(+el.value, +el.min, +el.max));
  });
}

function setPadOct(o) {
  _padOct = o; window._terPad?.setOctave(o);
  document.querySelectorAll('[id^=poct-]').forEach(b => b.classList.remove('active'));
  document.getElementById(`poct-${o}`)?.classList.add('active');
}

// ── BPM ───────────────────────────────────────────────────────────────────────
let _bpm = 120, _tapTs = [];

function shiftBpm(d) { _bpm = Math.max(40, Math.min(240, _bpm + d)); applyBpm(); }

function tapBpm() {
  const now = Date.now(); _tapTs.push(now); if (_tapTs.length > 8) _tapTs.shift();
  if (_tapTs.length >= 2) {
    const gaps = []; for (let i = 1; i < _tapTs.length; i++) gaps.push(_tapTs[i] - _tapTs[i-1]);
    _bpm = Math.round(60000 / (gaps.reduce((a,v) => a+v, 0) / gaps.length));
    applyBpm();
  }
  clearTimeout(tapBpm._t); tapBpm._t = setTimeout(() => { _tapTs = []; }, 2000);
}

function applyBpm() {
  window._masterBPM = _bpm; window._terArp?.setBpm(_bpm);
  document.getElementById('bpm-disp').innerHTML = _bpm + '<span class="bpm-sub">BPM · TAP</span>';
}

// ── Play ──────────────────────────────────────────────────────────────────────
function toggleArp() {
  const btn = document.getElementById('arp-btn');
  if (window._terArp?.isRunning()) {
    window._terArp.stop();
    btn.className = 'play-btn off'; btn.textContent = '▶ ARP';
    document.getElementById('hdr-status').textContent = '— stopped —';
  } else {
    window._terArp?.start({ root: _rootMidi, bpm: _bpm, style: _style });
    if (_lockedTrigram) window._terArp?.setTrigram(_lockedTrigram);
    btn.className = 'play-btn on'; btn.textContent = '■ ARP';
    updateChordStrip();
  }
}

function togglePad() {
  const btn = document.getElementById('pad-btn');
  if (window._terPad?.isRunning()) {
    window._terPad.stop();
    btn.className = 'play-btn pad-btn off'; btn.textContent = '♩ PAD';
  } else {
    const key = _lockedTrigram || (window._terArp?.getTrigramKey?.() ?? 'PPP');
    const t   = TGM[key];
    if (t) window._terPad?.setChord(t.ivs, _rootMidi);
    window._terPad?.start();
    btn.className = 'play-btn pad-btn on'; btn.textContent = '■ PAD';
  }
}

// ── Step visualizer + auto-follow ─────────────────────────────────────────────
const FORM_SYM = ['○○○','●○○','●●○'];

function animateSteps() {
  const arp = window._terArp;
  if (arp?.isRunning()) {
    const { step, form } = arp.getPhase();
    for (let i = 0; i < 9; i++) {
      const d = document.getElementById(`dot-${i}`);
      if (d) { d.classList.toggle('on', i === step); d.classList.toggle('next', i === (step+1)%9 || i === (step+2)%9); }
    }
    document.getElementById('form-lbl').textContent = `${FORM_SYM[form]} form ${form+1}`;

    if (!_lockedTrigram) {
      const k = arp.getTrigramKey();
      if (k !== _prevTgmKey) {
        _prevTgmKey = k;
        const t = TGM[k];
        if (t) window._terPad?.setChord(t.ivs, _rootMidi);
        updateChordStrip();
        drawHexKeyboard();
      }
    }
  }
  requestAnimationFrame(animateSteps);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildStyles();
buildTrigramRow();
applyBpm();
onEnv();
onPad();
initHexKeyboard();
selectRoot(60);
updateChordStrip();
animateSteps();

window.addEventListener('resize', () => { initHexKeyboard(); });
</script>
</body>
