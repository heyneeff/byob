<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BYOB — Sync + Ternary</title>
<style>
:root{--teal:#00cc99;--orange:#f57e20;--red:#ef3c23;--cyan:#40c4f0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:16px;}
h1{font-size:14px;color:var(--teal);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px;}
#status{font-size:11px;color:#555;margin-bottom:12px;}
#diff{display:none;margin-bottom:12px;padding:10px;border:1px solid var(--teal);border-radius:6px;}
#diff-label{font-size:10px;color:var(--teal);margin-bottom:4px;letter-spacing:.1em;text-transform:uppercase;}
#diff-val{font-size:20px;font-weight:bold;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:6px;padding:10px;}
/* Ternary trit border tint */
.card.ter-P{border-left:3px solid #00cc9980;}
.card.ter-Z{border-left:3px solid #f57e2080;}
.card.ter-N{border-left:3px solid #40c4f080;}
.card-hdr{display:flex;justify-content:space-between;margin-bottom:6px;}
.dev-id{color:var(--orange);font-weight:bold;}
.dev-age{color:#444;font-size:10px;}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #111;padding:2px 0;}
.k{color:#555;}.v{color:#0f0;text-align:right;}
.warn{color:var(--orange);}.bad{color:var(--red);}
.trit-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-weight:bold;font-size:11px;letter-spacing:2px;margin-left:6px;}
.trit-P{background:#00cc9920;color:var(--teal);}
.trit-Z{background:#f57e2020;color:var(--orange);}
.trit-N{background:#40c4f020;color:var(--cyan);}
/* Ternary aggregate bar */
#ter-agg{margin-bottom:12px;padding:10px;border:1px solid #1a3a3a;border-radius:6px;display:none;}
#ter-agg-title{font-size:10px;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
#ter-bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-bottom:6px;}
#ter-labels{display:flex;gap:20px;font-size:10px;}
#rec-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
#rec-toolbar button{background:#0a0a0a;border:1px solid #333;color:#0f0;font-family:monospace;font-size:11px;padding:6px 10px;border-radius:4px;cursor:pointer;}
#rec-toolbar button:hover{border-color:var(--teal);}
#rec-btn.active{border-color:var(--red);color:var(--red);}
#rec-count{color:#555;font-size:10px;}
#drift-chart-wrap{margin-bottom:12px;background:#050505;border:1px solid #1a1a1a;border-radius:6px;padding:8px;}
#drift-chart-title{font-size:10px;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
#drift-chart{display:block;width:100%;height:140px;}
#drift-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:10px;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
</style>
</head>
<body>
<h1>📡 BYOB Sync Dashboard + Ternary Layer</h1>
<div id="status">Connecting…</div>
<div id="rec-toolbar">
  <button id="rec-btn" onclick="toggleRecord()">⏺ Record</button>
  <button onclick="exportCSV()">⬇ Export CSV</button>
  <span id="rec-count">0 rows</span>
</div>

<!-- Ternary aggregate — hidden until devices with trit data arrive -->
<div id="ter-agg">
  <div id="ter-agg-title">ternary sync state — all playing devices</div>
  <div id="ter-bar"></div>
  <div id="ter-labels">
    <span style="color:var(--cyan)">N diverging: <b id="tc-n">0</b></span>
    <span style="color:var(--orange)">Z negotiating: <b id="tc-z">0</b></span>
    <span style="color:var(--teal)">P converged: <b id="tc-p">0</b></span>
    <span style="color:#555">threshold: 50ms snap / 10ms micro</span>
  </div>
</div>

<div id="drift-chart-wrap">
  <div id="drift-chart-title">live drift — all devices</div>
  <canvas id="drift-chart"></canvas>
  <div id="drift-legend"></div>
</div>
<div id="diff">
  <div id="diff-label">position delta between devices</div>
  <div id="diff-val">—</div>
</div>
<div id="events" class="card" style="display:none;margin-bottom:12px;">
  <div class="card-hdr"><span class="dev-id">↻ resync events</span></div>
</div>
<div class="grid" id="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://ohacvuwzvuifpyqckise.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWN2dXd6dnVpZnB5cWNraXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODc4NTcsImV4cCI6MjA5MjU2Mzg1N30.EX_DF-hFaQQuA1R9cZMKgR6TwjubwP61Ph4Gwa87beY'
);

const devs    = {};
const _events = [];

// ── TERNARY ───────────────────────────────────────────────
// Derive trit from live driftMs — no dependency on layer.js being deployed
const TER_SNAP_MS  = 50;   // vs binary's 150ms
const TER_MICRO_MS = 10;   // vs binary's 15ms
const TRIT_COLOR   = { P: '#00cc99', Z: '#f57e20', N: '#40c4f0' };
const TRIT_LABEL   = { P: 'CONVERGED', Z: 'NEGOTIATING', N: 'DIVERGING' };

function driftToTrit(driftMs) {
  if (driftMs == null || isNaN(parseFloat(driftMs))) return null;
  const abs = Math.abs(parseFloat(driftMs));
  if (abs >= TER_SNAP_MS)  return 'N';
  if (abs >= TER_MICRO_MS) return 'Z';
  return 'P';
}

// ── Drift chart (identical to debug.html) ────────────────
const CHART_COLORS = ['#00cc99','#f57e20','#ef3c23','#4fc3f7','#ce93d8','#fff176','#a5d6a7','#ff8a65'];
const CHART_WINDOW_MS = 180000;
const CHART_Y_RANGE   = 200;
const driftHistory    = {};
const devColorMap     = {};
let   _colorIdx       = 0;

function devColor(id) {
  if (!devColorMap[id]) devColorMap[id] = CHART_COLORS[_colorIdx++ % CHART_COLORS.length];
  return devColorMap[id];
}

function pushDriftHistory(deviceId, driftMs) {
  if (!driftHistory[deviceId]) driftHistory[deviceId] = [];
  const h = driftHistory[deviceId];
  h.push({ ts: Date.now(), driftMs: parseFloat(driftMs) });
  const cutoff = Date.now() - CHART_WINDOW_MS - 5000;
  while (h.length && h[0].ts < cutoff) h.shift();
}

function drawDriftChart() {
  const canvas = document.getElementById('drift-chart');
  if (!canvas) return;
  canvas.width  = canvas.offsetWidth  || 800;
  canvas.height = canvas.offsetHeight || 140;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.font = '9px monospace';
  [-150,-100,-50,50,100,150].forEach(ms => {
    const y = H/2 - (ms / CHART_Y_RANGE) * (H/2 - 6);
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillStyle = '#333'; ctx.fillText(ms + 'ms', 3, y - 2);
  });

  // Ternary snap threshold (±50ms) — dashed cyan
  ctx.strokeStyle = '#40c4f033'; ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
  [-TER_SNAP_MS, TER_SNAP_MS].forEach(ms => {
    const y = H/2 - (ms / CHART_Y_RANGE) * (H/2 - 6);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillStyle = '#40c4f055'; ctx.font = '8px monospace';
    ctx.fillText('ter snap ' + ms + 'ms', 3, y - 2);
  });
  ctx.setLineDash([]);

  // Zero line
  ctx.strokeStyle = '#00cc9944'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#00cc9988'; ctx.font = '9px monospace';
  ctx.fillText('0ms', 3, H/2 - 2);

  const now = Date.now();
  const deviceIds = Object.keys(driftHistory).filter(id => driftHistory[id].length >= 2);

  deviceIds.forEach(id => {
    const points = driftHistory[id];
    const color  = devColor(id);
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath(); let started = false;
    points.forEach(p => {
      const x = W * (1 - (now - p.ts) / CHART_WINDOW_MS);
      if (x < 0) return;
      const clamped = Math.max(-CHART_Y_RANGE, Math.min(CHART_Y_RANGE, p.driftMs));
      const y = H/2 - (clamped / CHART_Y_RANGE) * (H/2 - 6);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const last = points[points.length - 1];
    const lx   = W * (1 - (now - last.ts) / CHART_WINDOW_MS);
    if (lx >= 0) {
      const clamped = Math.max(-CHART_Y_RANGE, Math.min(CHART_Y_RANGE, last.driftMs));
      const ly = H/2 - (clamped / CHART_Y_RANGE) * (H/2 - 6);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = color; ctx.font = '9px monospace';
      ctx.fillText(id.slice(-5) + ' ' + Math.round(last.driftMs) + 'ms', Math.max(4, lx - 40), ly - 6);
    }
  });

  const legend = document.getElementById('drift-legend');
  if (legend) legend.innerHTML = deviceIds.map(id =>
    `<span class="legend-item"><span class="legend-dot" style="background:${devColor(id)}"></span><span style="color:${devColor(id)}">${id}</span></span>`
  ).join('');
}

function renderEvents() {
  const el = document.getElementById('events');
  if (!_events.length) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<div class="card-hdr"><span class="dev-id">↻ resync events</span></div>' +
    _events.map(e =>
      `<div class="row"><span class="k">${e.deviceId}</span><span class="v">${e.kind} · ${Math.round((Date.now()-e.at)/1000)}s ago</span></div>`
    ).join('');
}

// ── Channels ──────────────────────────────────────────────
db.channel('byob_debug')
  .on('broadcast', { event: 'hud_data' }, ({ payload }) => {
    devs[payload.deviceId] = { ...payload, _kind: 'sync', lastSeen: Date.now() };
    if (payload.driftMs != null && !isNaN(parseFloat(payload.driftMs)))
      pushDriftHistory(payload.deviceId, payload.driftMs);
    if (_recording) recordRow('sync', payload);
    render(); drawDriftChart();
  })
  .on('broadcast', { event: 'listener_health' }, ({ payload }) => {
    devs[payload.deviceId] = { ...payload, _kind: 'health', lastSeen: Date.now() };
    if (_recording) recordRow('health', payload);
    render();
  })
  .on('broadcast', { event: 'sync_event' }, ({ payload }) => {
    _events.unshift({ ...payload, at: Date.now() });
    if (_events.length > 20) _events.length = 20;
    if (_recording) recordRow('event', { ...payload, note: payload.kind });
    renderEvents();
  })
  .subscribe(s => {
    document.getElementById('status').textContent =
      s === 'SUBSCRIBED'
        ? '● Listening — open a listener\'s HUD for full sync data; GPS/connection health streams automatically'
        : s;
  });

// ── Recording — same CSV as debug.html + ternary cols ────
let _recording = false, _records = [];
const REC_COLS = [
  'timestamp','kind','deviceId','build','browser','zone','elapsed','currentTime','expectedPos',
  'driftMs','duration','deviceLatencyMs','outputLatencyMs','calOffset','syncState','playbackRate',
  'driftState','driftPending','src','visibilityState','lastDriftCheckAgoMs','readyState','stallCount','isMuted',
  'engineLagMs','snapCount','seekIntendedMs','seekMeasuredMs','note',
  // ternary additions (computed locally from driftMs, or from layer.js if present)
  'terTrit','terTritLabel','terSnapMs','terSnapCount','terTickCount',
];

function toggleRecord() {
  _recording = !_recording;
  const btn = document.getElementById('rec-btn');
  btn.textContent = _recording ? '⏺ Recording…' : '⏺ Record';
  btn.classList.toggle('active', _recording);
  if (_recording) { _records = []; document.getElementById('rec-count').textContent = '0 rows'; }
}

function recordRow(kind, p) {
  const row = { timestamp: new Date().toISOString(), kind };
  REC_COLS.slice(2).forEach(c => row[c] = p[c]);
  // Compute ternary fields if not already present from layer.js
  if (kind === 'sync' && row.terTrit == null && p.driftMs != null) {
    const t = driftToTrit(p.driftMs);
    row.terTrit      = t;
    row.terTritLabel = t ? TRIT_LABEL[t] : null;
    row.terSnapMs    = TER_SNAP_MS;
  }
  _records.push(row);
  document.getElementById('rec-count').textContent = _records.length + ' rows';
}

function exportCSV() {
  if (!_records.length) return;
  const lines = [REC_COLS.join(',')];
  _records.forEach(row => {
    lines.push(REC_COLS.map(c => {
      const v = row[c];
      return v === undefined || v === null ? '' : String(v).replace(/,/g, ';');
    }).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = 'byob-ternary-' + new Date().toISOString().replace(/[:.]/g, '-') + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

// ── Render ────────────────────────────────────────────────
function render() {
  const ids = Object.keys(devs);
  document.getElementById('grid').innerHTML = ids.map(id => {
    const d   = devs[id];
    const age = Math.round((Date.now() - d.lastSeen) / 1000);
    return d._kind === 'sync' ? renderSyncCard(d, age) : renderHealthCard(d, age);
  }).join('');

  // Drift spread
  const playing = ids.filter(id => devs[id]._kind === 'sync').map(id => devs[id])
    .filter(d => d.playing && !d.paused && parseFloat(d.currentTime) > 0 && !isNaN(parseFloat(d.elapsed)));
  if (playing.length >= 2) {
    const drifts = playing.map(d => parseFloat(d.driftMs)).filter(v => !isNaN(v));
    const spread = drifts.length >= 2 ? Math.max(...drifts) - Math.min(...drifts) : NaN;
    const e0  = Math.max(...playing.map(d => parseFloat(d.elapsed)));
    const pos = playing.map(d => parseFloat(d.currentTime) + (e0 - parseFloat(d.elapsed)) * (parseFloat(d.playbackRate) || 1));
    const delta = (Math.max(...pos) - Math.min(...pos)) * 1000;
    const el = document.getElementById('diff-val');
    el.textContent = (isNaN(spread) ? '—' : spread.toFixed(0) + 'ms drift spread') +
      ' · ' + delta.toFixed(0) + 'ms raw (incl. intentional latency offsets)';
    const worst = isNaN(spread) ? delta : spread;
    el.style.color = worst > 500 ? '#ef3c23' : worst > 100 ? '#f57e20' : '#00cc99';
    document.getElementById('diff-label').textContent =
      'sync across ' + playing.length + ' playing device' + (playing.length > 1 ? 's' : '');
    document.getElementById('diff').style.display = 'block';
  }

  // Ternary aggregate bar
  const syncDevs = ids.map(id => devs[id]).filter(d => d._kind === 'sync');
  const agg = document.getElementById('ter-agg');
  if (syncDevs.length) {
    agg.style.display = 'block';
    const counts = { N: 0, Z: 0, P: 0 };
    syncDevs.forEach(d => {
      const t = d.terTrit || driftToTrit(d.driftMs);
      if (t && counts[t] !== undefined) counts[t]++;
    });
    const total = syncDevs.length || 1;
    document.getElementById('tc-n').textContent = counts.N;
    document.getElementById('tc-z').textContent = counts.Z;
    document.getElementById('tc-p').textContent = counts.P;
    document.getElementById('ter-bar').innerHTML =
      (counts.N ? `<div style="width:${counts.N/total*100}%;background:#40c4f0;"></div>` : '') +
      (counts.Z ? `<div style="width:${counts.Z/total*100}%;background:#f57e20;"></div>` : '') +
      (counts.P ? `<div style="width:${counts.P/total*100}%;background:#00cc99;"></div>` : '');
  } else {
    agg.style.display = 'none';
  }
}

// ── Sync card — all debug.html fields + ternary row ──────
function renderSyncCard(d, age) {
  const dm  = parseFloat(d.driftMs);
  const dc  = Math.abs(dm) > 500 ? 'bad' : Math.abs(dm) > 100 ? 'warn' : '';
  // Ternary: prefer layer.js value, fall back to local derivation
  const trit     = d.terTrit || driftToTrit(d.driftMs);
  const tritLabel = trit ? TRIT_LABEL[trit] : null;
  const tritColor = trit ? TRIT_COLOR[trit] : null;
  const terClass  = trit ? 'ter-' + trit : '';

  return `<div class="card ${terClass}">
    <div class="card-hdr">
      <span class="dev-id">🎧 ${d.deviceId}
        <span style="color:${d.build==='listener'?'var(--teal)':'#888'};font-size:9px;">${d.build||'?'} · ${d.browser||'?'}</span>
      </span>
      <span class="dev-age">${age}s ago · ${d.zone||'no zone'}</span>
    </div>
    ${trit ? `<div class="row"><span class="k">TERNARY TRIT</span><span class="v" style="color:${tritColor}"><span class="trit-badge trit-${trit}">${trit}</span> ${tritLabel}</span></div>` : ''}
    ${r('elapsed',      d.elapsed     ? d.elapsed+'s'     : '—')}
    ${r('currentTime',  d.currentTime ? d.currentTime+'s' : '—')}
    ${r('expectedPos',  d.expectedPos ? d.expectedPos+'s' : '—')}
    ${r('DRIFT',        d.driftMs != null ? d.driftMs+'ms' : '—', dc)}
    ${r('engineLag',    d.engineLagMs != null ? d.engineLagMs+'ms' : '—',
        d.engineLagMs != null && Math.abs(d.engineLagMs - (parseFloat(d.driftMs)||0)) > 100 ? 'warn' : '')}
    ${r('BT latency',   d.deviceLatencyMs+'ms', d.deviceLatencyMs===0?'warn':'')}
    ${r('outputLatency',d.outputLatencyMs != null ? d.outputLatencyMs+'ms' : 'n/a',
        d.outputLatencyMs != null && Math.abs(d.outputLatencyMs - d.deviceLatencyMs) > 150 ? 'warn' : '')}
    ${r('calOffset',    d.calOffset != null ? (d.calOffset>=0?'+':'')+d.calOffset+'ms' : '—', d.calOffset===0?'warn':'')}
    ${r('syncState',    d.syncState || '—')}
    ${r('rate',         d.playbackRate || '—', d.playbackRate && Math.abs(parseFloat(d.playbackRate)-1) > 0.012 ? 'warn' : '')}
    ${r('driftState',   (d.driftState||'—') + (d.driftPending?' (pending)':''), d.driftState==='ducking'?'bad':d.driftState==='warping'?'warn':'')}
    ${r('src',          d.src || '—')}
    ${r('visibility',   d.visibilityState || '—', d.visibilityState==='hidden'?'warn':'')}
    ${r('lastDriftChk', d.lastDriftCheckAgoMs != null ? d.lastDriftCheckAgoMs+'ms ago' : '—',
        d.lastDriftCheckAgoMs != null && d.lastDriftCheckAgoMs > 10000 ? 'bad' :
        d.lastDriftCheckAgoMs != null && d.lastDriftCheckAgoMs > 6000  ? 'warn' : '')}
    ${r('readyState',   d.readyState ?? '—', d.readyState != null && d.readyState < 3 ? 'warn' : '')}
    ${r('stalls',       d.stallCount ?? 0, d.stallCount > 0 ? 'warn' : '')}
    ${r('muted',        d.isMuted ? 'yes' : 'no', d.isMuted ? 'warn' : '')}
    ${r('snaps',        d.snapCount ?? 0)}
    ${r('seek intend',  d.seekIntendedMs != null ? d.seekIntendedMs+'ms' : '—')}
    ${r('seek landed',  d.seekMeasuredMs != null ? d.seekMeasuredMs+'ms' : '—',
        d.seekIntendedMs != null && d.seekMeasuredMs != null &&
        Math.abs(d.seekIntendedMs) > 100 && Math.abs(d.seekMeasuredMs) < Math.abs(d.seekIntendedMs) * 0.3 ? 'bad' : '')}
    ${trit ? r('ter snap @', TER_SNAP_MS+'ms  (bin snap @150ms)') : ''}
    ${d.terSnapCount != null ? r('ter snaps', d.terSnapCount) : ''}
  </div>`;
}

// ── Health card (identical to debug.html) ─────────────────
function renderHealthCard(d, age) {
  const distM = parseFloat(d.driftMs);
  const dc = isNaN(distM) ? '' : (distM > 300 ? 'bad' : distM > (d.zone !== 'none' ? 100 : 1e9) ? 'warn' : '');
  return `<div class="card">
    <div class="card-hdr">
      <span class="dev-id">📡 ${d.deviceId} <span style="color:${d.build==='listener'?'var(--teal)':'#888'};font-size:9px;">${d.build||'?'} · ${d.browser||'?'}</span></span>
      <span class="dev-age">${age}s ago · ${d.zone||'no zone'}</span>
    </div>
    ${r('dist to zone', !isNaN(distM) ? distM.toFixed(0)+'m' : '—', dc)}
    ${r('GPS coords',   d.expectedPos || '—')}
    ${r('bearing',      d.src || '—')}
    ${r('presence',     d.deviceLatencyMs ? '✓ broadcasting' : '✗ idle', d.deviceLatencyMs ? '' : 'warn')}
    ${r('status',       d.syncState || '—')}
  </div>`;
}

function r(key, val, cls='') {
  return `<div class="row"><span class="k">${key}</span><span class="v ${cls}">${val}</span></div>`;
}

setInterval(() => {
  const now = Date.now();
  let changed = false;
  Object.keys(devs).forEach(id => { if (now - devs[id].lastSeen > 30000) { delete devs[id]; changed = true; } });
  if (changed) render();
  drawDriftChart();
}, 5000);
</script>
</body>
</html>
