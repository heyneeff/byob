<!DOCTYPE html>
<html>
<head><title>SQL Fix</title>
<style>
body{background:#111;color:#eee;font-family:monospace;padding:30px;}
textarea{width:100%;height:420px;background:#222;color:#0f0;font-size:14px;padding:16px;border:1px solid #444;border-radius:6px;resize:none;}
button{margin-top:12px;padding:12px 24px;background:#f57e20;color:#000;font-size:16px;font-weight:bold;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<h2 style="color:#f57e20">Supabase SQL Fix — paste this into the SQL editor</h2>
<textarea id="sql" readonly>create table if not exists profiles (
  id           uuid primary key references auth.users(id) on delete cascade,
  display_name text,
  emoji        text,
  vibe_tag     text,
  phone        text,
  instagram    text,
  created_at   timestamptz default now()
);

alter table profiles enable row level security;

do $$ begin
  create policy "Own profile" on profiles
    for all using (auth.uid() = id) with check (auth.uid() = id);
exception when duplicate_object then null; end $$;

create or replace function public.handle_new_user()
returns trigger language plpgsql security definer
set search_path = public
as $$
begin
  insert into public.profiles (id)
  values (new.id)
  on conflict (id) do nothing;
  return new;
end;
$$;

drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created
  after insert on auth.users
  for each row execute procedure public.handle_new_user();</textarea>
<br/>
<button onclick="document.getElementById('sql').select();document.execCommand('copy');this.textContent='Copied!'">Select All &amp; Copy</button>
</body>
</html>
