<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>BYOB Jam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&display=swap"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0a0a0a;color:#fff;font-family:'Barlow Condensed',system-ui,sans-serif;overflow:hidden;}
canvas#viz{position:fixed;inset:0;width:100%;height:100%;}
.hdr{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(rgba(10,10,10,.85),transparent);}
.logo{font-size:20px;font-weight:900;letter-spacing:.1em;color:#00cba9;}
.hdr-track{flex:1;font-size:14px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-count{font-size:11px;color:#444;flex-shrink:0;}
.center{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:72px 24px 120px;}
#qr{display:block;border-radius:10px;cursor:pointer;background:#fff;}
.jam-url{font-size:10px;font-family:monospace;color:#444;text-align:center;word-break:break-all;max-width:260px;}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:2;padding:16px 20px max(env(safe-area-inset-bottom),20px);background:linear-gradient(transparent,rgba(10,10,10,.97) 30%);}
.row{display:flex;gap:8px;max-width:460px;margin:0 auto;}
input.url{flex:1;background:#111;border:1px solid #1e1e1e;border-radius:8px;color:#fff;padding:11px 13px;font:14px monospace;outline:none;transition:border-color .15s;}
input.url:focus{border-color:#00cba9;}
input.url::placeholder{color:#444;}
.btn{flex-shrink:0;background:#00cba9;color:#000;border:none;border-radius:8px;font:900 16px 'Barlow Condensed',system-ui;letter-spacing:.06em;padding:0 18px;cursor:pointer;}
.btn.file{background:transparent;border:1px solid #1e1e1e;color:#444;padding:0 14px;font-size:18px;}
.btn-join{width:100%;max-width:460px;margin:0 auto;display:block;padding:15px;border:none;border-radius:12px;font:900 22px 'Barlow Condensed',system-ui;letter-spacing:.08em;background:#00cba9;color:#000;cursor:pointer;box-shadow:0 0 28px rgba(0,203,169,.2);}
.status{font-size:10px;font-family:monospace;color:#444;text-align:center;margin-top:6px;min-height:14px;max-width:460px;margin-left:auto;margin-right:auto;}
</style>
</head>
<body>
<canvas id="viz"></canvas>

<div class="hdr">
  <span class="logo">BYOB</span>
  <span class="hdr-track" id="hdr-track"></span>
  <span class="hdr-count" id="hdr-count"></span>
</div>

<!-- QR always visible on load -->
<div class="center">
  <canvas id="qr" width="220" height="220" title="Tap to copy link"></canvas>
  <div class="jam-url" id="jam-url"></div>
</div>

<!-- bottom controls (host: cast row; guest: join button) -->
<div class="bottom">
  <div id="cast-row" class="row">
    <input class="url" id="url-input" type="url" placeholder="paste audio URL to cast…" autocomplete="off" spellcheck="false"/>
    <button class="btn" onclick="doCast()">▶</button>
    <input type="file" id="file-in" accept="audio/*" style="display:none" onchange="doFile(event)"/>
    <button class="btn file" onclick="document.getElementById('file-in').click()" title="pick file">📁</button>
  </div>
  <button class="btn-join" id="btn-join" style="display:none" onclick="doJoin()">▶ JOIN JAM</button>
  <div class="status" id="status"></div>
</div>

<script type="module">
import { BYOBPlayer } from './byob-player.js';

const SUPABASE_URL      = 'https://ohacvuwzvuifpyqckise.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oYWN2dXd6dnVpZnB5cWNraXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5ODc4NTcsImV4cCI6MjA5MjU2Mzg1N30.EX_DF-hFaQQuA1R9cZMKgR6TwjubwP61Ph4Gwa87beY';
const { createClient } = supabase;
const db      = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const player  = new BYOBPlayer({ db });

// ── Session ───────────────────────────────────────────────────────
const urlJamId = new URLSearchParams(location.search).get('j');
const isHost   = !urlJamId;

const session  = player.jam(urlJamId, {
  onTrackChange:   ({ name }) => { document.getElementById('hdr-track').textContent = name; },
  onListenerCount: (n) => { document.getElementById('hdr-count').textContent = n > 1 ? `👥 ${n}` : ''; },
  onSync:          ({ lagMs, driftState }) => setStatus(`${driftState}  ${lagMs > 0 ? '+' : ''}${Math.round(lagMs)}ms`),
});

// Update URL + render QR
// QRCode is a sync CDN script that runs before this deferred module — safe to call directly.
if (isHost) history.replaceState(null, '', `?j=${session.jamId}`);
const jamUrl = location.href;
document.getElementById('jam-url').textContent = jamUrl;
if (typeof QRCode !== 'undefined') {
  QRCode.toCanvas(document.getElementById('qr'), jamUrl, { width: 220, margin: 1 }, () => {});
}
// Tap QR to copy link
document.getElementById('qr').addEventListener('click', () => {
  navigator.clipboard?.writeText(jamUrl).then(() => setStatus('link copied!')).catch(() => {});
});

// Guest: hide cast row, show join button instead
if (!isHost) {
  document.getElementById('cast-row').style.display = 'none';
  document.getElementById('btn-join').style.display = 'block';
  setStatus('waiting for a track…');
}

// ── AudioContext — created lazily on first user gesture ───────────
let _audioEl = null, _analyser = null;
function getAudio() {
  if (_audioEl) return _audioEl;
  const ctx  = new AudioContext();
  _analyser  = ctx.createAnalyser();
  _analyser.fftSize = 256;
  _audioEl   = document.createElement('audio');
  _audioEl.crossOrigin = 'anonymous';
  document.body.appendChild(_audioEl);
  ctx.createMediaElementSource(_audioEl).connect(_analyser);
  _analyser.connect(ctx.destination);
  return _audioEl;
}

// ── Controls ──────────────────────────────────────────────────────
window.doJoin = async function() {
  document.getElementById('btn-join').style.display = 'none';
  setStatus('tuning in…');
  await session.listen(getAudio());
  // Show cast row so guests can pass the aux too
  document.getElementById('cast-row').style.display = 'flex';
  setStatus('');
};

window.doCast = async function() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  document.getElementById('url-input').value = '';
  setStatus('casting…');
  await session.cast(getAudio(), url).catch(e => setStatus(e.message));
};

window.doFile = function(e) {
  const file = e.target.files?.[0]; e.target.value = '';
  if (!file) return;
  setStatus('uploading…');
  session.castFile(getAudio(), file)
    .then(() => setStatus(''))
    .catch(e => setStatus(e.message));
};

function setStatus(t) { document.getElementById('status').textContent = t; }

// Drag & drop audio file onto page
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f?.type.startsWith('audio/')) window.doFile({ target: { files: [f], value: '' } });
});

// ── Visualizer ────────────────────────────────────────────────────
const viz  = document.getElementById('viz');
const vCtx = viz.getContext('2d');
let   _t   = 0;
function resize() { viz.width = innerWidth; viz.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

(function loop() {
  requestAnimationFrame(loop);
  const W = viz.width, H = viz.height;
  if (!_analyser) {
    // Idle pulse
    _t += 0.006;
    const p = 0.5 + 0.5 * Math.sin(_t);
    vCtx.fillStyle = '#0a0a0a'; vCtx.fillRect(0, 0, W, H);
    const g = vCtx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H) * 0.4 * (0.6 + p * 0.4));
    g.addColorStop(0, `rgba(0,203,169,${0.07*p})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    vCtx.fillStyle = g; vCtx.fillRect(0, 0, W, H);
    return;
  }
  const n    = _analyser.frequencyBinCount;
  const data = new Uint8Array(n);
  _analyser.getByteFrequencyData(data);
  vCtx.fillStyle = 'rgba(10,10,10,0.2)'; vCtx.fillRect(0, 0, W, H);
  const bw = (W / n) * 2.2;
  for (let i = 0; i < n; i++) {
    const v = data[i] / 255; if (v < 0.02) continue;
    vCtx.fillStyle = `rgb(${Math.round(v*255)},${Math.round(203-v*130)},${Math.round(169*(1-v))})`;
    vCtx.fillRect((i/n)*W, H - v*H*0.72, Math.max(bw-0.5,1), v*H*0.72);
  }
})();
</script>
</body>
</html>
