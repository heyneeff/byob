<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BYOB — v5</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050302;
  --card:#0c0804;
  --card2:#141008;
  --rim:#1a1208;
  --orange:#f57e20;
  --red:#ef3c23;
  --teal:#00cc99;
  --radar:#00ff88;
  --muted:#4a3820;
  --muted2:#6a5535;
  --white:#f0ebe0;
  --da:#f57e20;
  --db:#00cc99;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:'Barlow Condensed',sans-serif;}

/* ═══ TOP BAR ══════════════════════════════════════════ */
.topbar{
  height:44px;display:flex;align-items:center;
  padding:0 12px;background:var(--card);
  border-bottom:1px solid var(--rim);
  gap:14px;flex-shrink:0;z-index:30;position:relative;
}
.logo{font-size:20px;font-weight:900;letter-spacing:.06em;flex-shrink:0;}
.logo em{color:var(--orange);font-style:normal;}
.topbar-stats{display:flex;gap:14px;}
.tstat{text-align:center;line-height:1;}
.tstat-v{font-size:17px;font-weight:900;color:var(--orange);font-family:'DM Mono',monospace;}
.tstat-l{font-size:6px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:1px;}
.spacer{flex:1;}
.btn-live{
  padding:6px 16px;border:none;border-radius:16px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;
  letter-spacing:.08em;background:var(--red);color:#fff;flex-shrink:0;
  box-shadow:0 0 12px rgba(239,60,35,.3);transition:all .2s;
}
.btn-live.on{background:var(--teal);color:#000;animation:lp 1.8s ease-in-out infinite;}
@keyframes lp{0%,100%{box-shadow:0 0 12px rgba(0,204,153,.35);}50%{box-shadow:0 0 32px rgba(0,204,153,.7);}}

/* ═══ APP SHELL ════════════════════════════════════════ */
.app{
  display:grid;
  grid-template-columns:1fr 48px;
  height:calc(100vh - 44px);
  overflow:hidden;
}

/* ═══ CONTENT AREA ═════════════════════════════════════ */
.content{
  grid-column:1;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* Panel views */
.panel{display:none;flex:1;flex-direction:column;overflow:hidden;}
.panel.active{display:flex;}

/* ════════════════════════════════════════════════════════
   SPATIAL PANEL
   Left: tools | Right: radar | Bottom: library
════════════════════════════════════════════════════════ */
.spatial-panel{flex:1;display:grid;grid-template-columns:240px 1fr;grid-template-rows:1fr 240px;overflow:hidden;}

/* LEFT TOOLS */
.sp-tools{
  grid-column:1;grid-row:1;
  display:flex;flex-direction:column;gap:7px;
  padding:10px;border-right:1px solid var(--rim);
  background:var(--card);overflow-y:auto;
}
.sp-tools::-webkit-scrollbar{width:2px;}
.sp-tools::-webkit-scrollbar-thumb{background:var(--rim);}
.sp-label{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex-shrink:0;}

/* Mode buttons */
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex-shrink:0;}
.mbutton{
  padding:7px 4px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;
  background:var(--card2);color:var(--muted);transition:all .15s;white-space:nowrap;
}
.mbutton.active{background:var(--orange);color:#000;}

/* Slots */
.slots-col{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.slot{
  display:flex;align-items:center;gap:7px;
  padding:7px 9px;border-radius:10px;
  background:var(--card2);border:1.5px dashed var(--rim);
  cursor:pointer;transition:all .15s;
}
.slot.filled{border-style:solid;}
.slot.sel{box-shadow:0 0 10px rgba(245,126,32,.3);}
.slot-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--muted);}
.slot-info{flex:1;min-width:0;}
.slot-n{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.slot-t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-x{color:var(--muted);cursor:pointer;font-size:13px;padding:0 2px;flex-shrink:0;}
.slot-x:hover{color:var(--red);}

/* Actions */
.sact-col{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.sact{
  padding:12px;border:none;border-radius:12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;
  letter-spacing:.04em;transition:transform .1s;box-shadow:0 3px 12px rgba(0,0,0,.4);
}
.sact:active{transform:scale(.97);}
.sact-scatter{background:var(--red);color:#fff;}
.sact-dist{background:var(--card2);color:var(--orange);border:1px solid var(--orange);font-size:12px;}
.sact-snap{background:var(--teal);color:#000;}

/* RIGHT RADAR */
.sp-radar{
  grid-column:2;grid-row:1;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:8px;
  border-bottom:1px solid var(--rim);
}
#sg{touch-action:none;cursor:crosshair;}

/* LIBRARY — spans full width below */
.sp-library{
  grid-column:1/3;grid-row:2;
  background:var(--card);border-top:1px solid var(--rim);
  display:flex;flex-direction:column;overflow:hidden;
}

/* ════════════════════════════════════════════════════════
   DECK PANEL
════════════════════════════════════════════════════════ */
.deck-panel{flex:1;display:grid;grid-template-rows:1fr 240px;overflow:hidden;}

.deck-top{
  display:grid;grid-template-columns:1fr 200px 1fr;
  padding:8px 10px;gap:8px;overflow:hidden;
}

/* Deck strip */
.dstrip{
  display:flex;flex-direction:column;gap:6px;
  background:var(--card);border-radius:14px;padding:10px;
  overflow:hidden;
}
.dstrip-head{display:flex;align-items:flex-start;justify-content:space-between;}
.dl{font-size:9px;font-weight:900;letter-spacing:.14em;padding:2px 6px;border-radius:5px;flex-shrink:0;}
.da-l{background:rgba(245,126,32,.15);color:var(--da);}
.db-l{background:rgba(0,204,153,.15);color:var(--db);}
.dinfo{flex:1;padding:0 6px;min-width:0;}
.dtname{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dartist{font-size:8px;color:var(--muted2);margin-top:1px;}
.dbpm-block{text-align:right;}
.dbpm{font-size:16px;font-weight:900;font-family:'DM Mono',monospace;line-height:1;}
.dbpm-l{font-size:6px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.mini-wave{height:36px;border-radius:7px;overflow:hidden;background:#060402;flex-shrink:0;position:relative;}
.mini-wave::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,.3);pointer-events:none;}
.mini-wave canvas{width:100%;height:100%;display:block;}
.dcontrols{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.dcbtn{
  padding:5px 9px;border:none;border-radius:7px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;
  letter-spacing:.05em;background:var(--card2);color:var(--muted2);transition:all .12s;
}
.dcbtn:hover,.dcbtn.on{background:var(--orange);color:#000;}
.dtime{font-family:'DM Mono',monospace;font-size:11px;color:var(--white);flex:1;text-align:center;}
.dpitch{
  -webkit-appearance:none;height:3px;width:60px;
  background:var(--rim);border-radius:2px;cursor:pointer;
}
.dpitch::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:16px;background:var(--white);border-radius:2px;}
.hot-cues{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex-shrink:0;}
.hcue{
  padding:5px 2px;border:none;border-radius:5px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:900;
  background:var(--card2);color:var(--muted2);transition:all .12s;text-align:center;
}
.hcue:hover{background:var(--orange);color:#000;}
.hcue.set{background:rgba(245,126,32,.2);color:var(--orange);}

/* Turntable center */
.tt-center{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;
  background:var(--card);border-radius:14px;padding:10px;
}
.tt-wheels{display:flex;gap:10px;align-items:center;justify-content:center;}
.tt-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.tt-label{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
canvas.wheel{cursor:grab;border-radius:50%;}
canvas.wheel:active{cursor:grabbing;}
.xf-wrap{width:100%;padding:0 6px;}
.xf-label{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:3px;}
.xfader{
  -webkit-appearance:none;width:100%;height:4px;
  background:var(--rim);border-radius:2px;cursor:pointer;
}
.xfader::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;background:var(--white);border-radius:3px;}
.xf-ends{display:flex;justify-content:space-between;font-size:8px;font-family:'DM Mono',monospace;margin-top:2px;}
.sync-btn{
  width:100%;padding:6px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:900;
  letter-spacing:.06em;background:var(--card2);color:var(--orange);
  border:1px solid var(--orange);transition:all .15s;
}

.deck-library{border-top:1px solid var(--rim);display:flex;flex-direction:column;background:var(--card);overflow:hidden;}

/* ════════════════════════════════════════════════════════
   CROWD PANEL — no library
════════════════════════════════════════════════════════ */
.crowd-panel{
  flex:1;display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto 1fr auto;
  padding:10px;gap:8px;overflow:hidden;
}
.crowd-stat-row{grid-column:1/3;display:flex;gap:6px;flex-shrink:0;}
.cstat{
  flex:1;background:var(--card);border-radius:12px;padding:10px;
  text-align:center;
}
.cstat-v{font-size:28px;font-weight:900;color:var(--orange);line-height:1;font-family:'DM Mono',monospace;}
.cstat-l{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.crowd-left{display:flex;flex-direction:column;gap:6px;overflow:hidden;}
.crowd-right{display:flex;flex-direction:column;gap:6px;overflow:hidden;}
.crowd-footer{grid-column:1/3;flex-shrink:0;}
.cv-head{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
.glist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.glist::-webkit-scrollbar{width:2px;}
.glist::-webkit-scrollbar-thumb{background:var(--rim);}
.gitem{display:flex;align-items:center;gap:7px;padding:7px 9px;background:var(--card);border-radius:10px;flex-shrink:0;}
.gemoji{font-size:16px;}
.gname{font-size:13px;font-weight:700;flex:1;}
.gdist{font-size:9px;font-family:'DM Mono',monospace;color:var(--teal);}
.gbadge{font-size:8px;padding:2px 6px;border-radius:6px;font-weight:700;letter-spacing:.06em;}
.gbadge.here{background:rgba(0,204,153,.12);color:var(--teal);}
.gbadge.coming{background:rgba(245,126,32,.12);color:var(--orange);}
.msg-box{background:var(--card);border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:5px;}
.msg-inp{
  width:100%;background:var(--card2);border:none;border-radius:7px;
  padding:7px 9px;color:var(--white);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;
  outline:none;resize:none;
}
.msg-inp::placeholder{color:var(--muted);}
.msg-targets{display:flex;gap:4px;}
.mtbtn{
  flex:1;padding:5px;border:none;border-radius:6px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:900;
  background:var(--card2);color:var(--muted2);transition:all .12s;
}
.mtbtn.active,.mtbtn:hover{background:var(--orange);color:#000;}
.msg-send{
  padding:9px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;
  letter-spacing:.04em;background:var(--orange);color:#000;
}
.lights-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.lbtn{
  padding:8px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:900;
  background:var(--card2);color:var(--muted2);transition:all .15s;text-align:center;
}
.lbtn.on{color:#000;}
.ff-btn{
  width:100%;padding:12px;border:none;border-radius:12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;
  letter-spacing:.04em;background:var(--card);color:var(--white);
  border:1px solid var(--rim);transition:all .15s;
}
.ff-btn:active{background:var(--teal);color:#000;border-color:var(--teal);}

/* ════════════════════════════════════════════════════════
   SHARED LIBRARY STYLES
════════════════════════════════════════════════════════ */
.lib-bar{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-bottom:1px solid var(--rim);flex-shrink:0;
}
.crates{display:flex;gap:3px;flex:1;}
.crate{
  padding:4px 9px;border-radius:7px;border:none;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.06em;cursor:pointer;color:var(--muted);
  background:transparent;transition:all .12s;
}
.crate.active{background:var(--card2);color:var(--white);}
.lib-search{
  background:var(--card2);border:none;border-radius:7px;
  padding:4px 9px;color:var(--white);
  font-family:'Barlow Condensed',sans-serif;font-size:11px;
  outline:none;width:130px;
}
.lib-search::placeholder{color:var(--muted);}
.lib-upload{
  padding:4px 10px;border:none;border-radius:7px;
  background:var(--orange);color:#000;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:.06em;flex-shrink:0;
}
.lib-cols{
  display:grid;grid-template-columns:1fr 52px 44px 40px 76px;
  padding:3px 10px;border-bottom:1px solid var(--rim);flex-shrink:0;
}
.lc{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.lib-rows{flex:1;overflow-y:auto;}
.lib-rows::-webkit-scrollbar{width:2px;}
.lib-rows::-webkit-scrollbar-thumb{background:var(--rim);}
.trow{
  display:grid;grid-template-columns:1fr 52px 44px 40px 76px;
  align-items:center;padding:5px 10px;cursor:grab;
  border-bottom:1px solid var(--rim);transition:background .1s;
}
.trow:hover{background:var(--card2);}
.trow:active{cursor:grabbing;opacity:.65;}
.trow.loaded-a{background:#130e04;}
.trow.loaded-b{background:#040e0a;}
.tr-name{display:flex;align-items:center;gap:6px;min-width:0;}
.tr-col{width:3px;height:26px;border-radius:2px;flex-shrink:0;}
.tr-txt{min-width:0;}
.tr-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;}
.tr-artist{font-size:8px;color:var(--muted2);margin-top:1px;}
.tr-bpm{font-size:11px;font-family:'DM Mono',monospace;color:var(--orange);}
.tr-key{font-size:10px;font-family:'DM Mono',monospace;color:var(--teal);}
.tr-dur{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted2);}
.tr-acts{display:flex;gap:3px;justify-content:flex-end;}
.tr-btn{
  padding:3px 6px;border:none;border-radius:4px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:900;
  background:var(--card2);color:var(--muted2);transition:all .12s;
}
.tr-btn:hover{background:var(--orange);color:#000;}
.tr-btn.b{background:rgba(0,204,153,.08);color:var(--teal);}
.tr-btn.b:hover{background:var(--teal);color:#000;}

/* ═══ RIGHT NAV ════════════════════════════════════════ */
.rightnav{
  grid-column:2;grid-row:1;
  background:var(--card);border-left:1px solid var(--rim);
  display:flex;flex-direction:column;align-items:center;
  padding:6px 0;gap:2px;
}
.rnbtn{
  width:38px;height:38px;border:none;border-radius:9px;
  background:transparent;color:var(--muted);cursor:pointer;
  font-size:17px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.rnbtn.active{background:rgba(245,126,32,.12);color:var(--orange);}
.rnbtn:hover{background:var(--card2);}
.rnlabel{font-size:6px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.rnsep{width:22px;height:1px;background:var(--rim);margin:4px 0;}

/* VU */
.vu-strip{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;width:100%;}
.vu-bar{flex:1;width:6px;background:var(--rim);border-radius:3px;overflow:hidden;position:relative;margin:0 auto;min-height:40px;}
.vu-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--teal) 0%,var(--orange) 70%,var(--red) 100%);border-radius:3px;transition:height .07s;}

/* ═══ EQ POPUP ══════════════════════════════════════════ */
#eq-popup{
  position:fixed;right:54px;bottom:40px;z-index:200;
  background:var(--card);border:1px solid var(--rim);
  border-radius:14px;padding:12px 10px;
  display:none;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.7);
}
#eq-popup.open{display:flex;}
.eq-row{display:flex;gap:10px;align-items:flex-end;}
.eq-col{display:flex;flex-direction:column;align-items:center;gap:3px;}
.eq-label{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.eq-val{font-size:10px;font-family:'DM Mono',monospace;color:var(--orange);}
.eq-close{font-size:11px;color:var(--muted);cursor:pointer;align-self:flex-end;padding:2px 6px;}
.eq-close:hover{color:var(--red);}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">BY<em>O</em>B</div>
  <div class="topbar-stats">
    <div class="tstat"><div class="tstat-v" id="tb-bpm">—</div><div class="tstat-l">BPM</div></div>
    <div class="tstat"><div class="tstat-v" id="tb-live">18</div><div class="tstat-l">Live</div></div>
    <div class="tstat"><div class="tstat-v" id="tb-zone">Zone 1</div><div class="tstat-l">Zone</div></div>
  </div>
  <div class="spacer"></div>
  <button class="btn-live" id="btn-live" onclick="toggleLive()">⚡ Go Live</button>
</div>

<div class="app">
<div class="content">

<!-- ════════════════════════════════════════════════════
     SPATIAL PANEL
════════════════════════════════════════════════════ -->
<div class="panel active" id="panel-spatial">
<div class="spatial-panel">

  <!-- LEFT: tools -->
  <div class="sp-tools">
    <div class="sp-label">Mode</div>
    <div class="mode-grid">
      <button class="mbutton active" onclick="setMode('zone',this)">⊕ Zone</button>
      <button class="mbutton" onclick="setMode('cluster',this)">⬡ Cluster</button>
      <button class="mbutton" onclick="setMode('orbit',this)">◎ Orbit</button>
      <button class="mbutton" onclick="setMode('wander',this)">〜 Wander</button>
      <button class="mbutton" onclick="setMode('point',this)">⊙ Point</button>
      <button class="mbutton" onclick="setMode('layer',this)">≋ Layer</button>
    </div>

    <div class="sp-label">Track Slots</div>
    <div class="slots-col" id="slots-col"></div>

    <div class="sp-label">Broadcast</div>
    <div class="sact-col">
      <button class="sact sact-scatter" onclick="doScatter()">♩ SCATTER</button>
      <button class="sact sact-dist"    onclick="doDistribute()">⊕ DISTRIBUTE</button>
      <button class="sact sact-snap"    onclick="doSnap()">⚡ SNAP</button>
    </div>
  </div>

  <!-- RIGHT: radar -->
  <div class="sp-radar">
    <canvas id="sg" ontouchstart="onTouch(event)" onmousedown="onMouse(event)"
      ondragover="event.preventDefault()" ondrop="onDrop(event)"></canvas>
  </div>

  <!-- BOTTOM: library -->
  <div class="sp-library" id="sp-lib"></div>

</div>
</div><!-- /spatial -->

<!-- ════════════════════════════════════════════════════
     DECK PANEL
════════════════════════════════════════════════════ -->
<div class="panel" id="panel-deck">
<div class="deck-panel">

  <div class="deck-top">

    <!-- DECK A -->
    <div class="dstrip"
      ondragover="event.preventDefault()"
      ondrop="dropDeck(event,'a')">

<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
const TRACKS=[
  {id:'A',name:'Midnight Groove',  artist:'Oliver Smith',    bpm:124,key:'8A', dur:'6:32',col:'#f57e20'},
  {id:'B',name:'Liquid Dreams',    artist:'Nora Van Elken',  bpm:124,key:'8A', dur:'7:15',col:'#00cc99'},
  {id:'C',name:'Afterglow',        artist:'Lucas & Steve',   bpm:126,key:'9A', dur:'5:48',col:'#ef3c23'},
  {id:'D',name:'Echoes',           artist:'Maya Jane Coles', bpm:123,key:'7A', dur:'6:21',col:'#a78bfa'},
  {id:'E',name:'Rising High',      artist:'Dom Dolla',       bpm:125,key:'10A',dur:'5:55',col:'#f472b6'},
  {id:'F',name:'Back To You',      artist:'Sonny Fodera',    bpm:124,key:'11A',dur:'5:41',col:'#34d399'},
  {id:'G',name:'Cascade',          artist:'Lane 8',          bpm:122,key:'6A', dur:'7:03',col:'#f57e20'},
  {id:'H',name:'Devotion',         artist:'Bicep',           bpm:128,key:'5A', dur:'6:18',col:'#00cc99'},
  {id:'I',name:'Fading',           artist:'Bonobo',          bpm:120,key:'4A', dur:'5:22',col:'#ef3c23'},
  {id:'J',name:'You & Me',         artist:'Disclosure',      bpm:122,key:'3A', dur:'6:44',col:'#a78bfa'},
];
const GUESTS=[
  {e:'🎧',n:'Catalyst',  d:'12ft', s:'here'},
  {e:'🌀',n:'Wanderer',  d:'28ft', s:'here'},
  {e:'🔮',n:'Oracle',    d:'35ft', s:'here'},
  {e:'⚡',n:'Instigator',d:'120ft',s:'coming'},
  {e:'🦊',n:'Fox',       d:'55ft', s:'here'},
  {e:'🌊',n:'Tender',    d:'67ft', s:'here'},
  {e:'🎭',n:'Jester',    d:'200ft',s:'coming'},
  {e:'🐉',n:'Dragon',    d:'88ft', s:'here'},
];

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let gridMode='zone';
let slots=Array(6).fill(null);
let activeSlot=null;
let ripples=[];
let listeners=[];
let orbitAng=0;
let frame=0;
let dragging=null;
let radarAngle=0;
let deckA={playing:false,bpm:0,track:null,angle:0};
let deckB={playing:false,bpm:0,track:null,angle:0};

for(let i=0;i<28;i++){
  const a=Math.random()*Math.PI*2,d=0.1+Math.random()*.84;
  listeners.push({x:Math.cos(a)*d,y:Math.sin(a)*d,vx:(Math.random()-.5)*.0012,vy:(Math.random()-.5)*.0012,col:'#f0ebe0',name:''});
}
const LNAMES=['Catalyst','Wanderer','Oracle','Fox','Tender','Jester','Dragon','Ember','Rook','Sable'];
LNAMES.forEach((n,i)=>{if(listeners[i])listeners[i].name=n;});

// ═══════════════════════════════════════════════════════
// BUILD LIBRARY
// ═══════════════════════════════════════════════════════
function libHTML(filter=''){
  const list=TRACKS.filter(t=>
    t.name.toLowerCase().includes(filter.toLowerCase())||
    t.artist.toLowerCase().includes(filter.toLowerCase())
  );
  return`
    <div class="lib-bar">
      <div class="crates">
        <button class="crate active" onclick="crateActive(this)">All</button>
        <button class="crate" onclick="crateActive(this)">Stems</button>
        <button class="crate" onclick="crateActive(this)">Playlists</button>
        <button class="crate" onclick="crateActive(this)">Recent</button>
        <button class="crate" onclick="crateActive(this)">★ Favs</button>
      </div>
      <input class="lib-search" placeholder="🔍 Search…" oninput="filterLib(this.value)"/>
      <button class="lib-upload">+ Upload</button>
    </div>
    <div class="lib-cols">
      <div class="lc">Title / Artist</div>
      <div class="lc">BPM</div>
      <div class="lc">Key</div>
      <div class="lc">Time</div>
      <div class="lc" style="text-align:right;">Load</div>
    </div>
    <div class="lib-rows">
      ${list.map(t=>`
        <div class="trow ${deckA.track?.id===t.id?'loaded-a':deckB.track?.id===t.id?'loaded-b':''}"
          draggable="true" ondragstart="startDrag(event,'${t.id}')">
          <div class="tr-name">
            <div class="tr-col" style="background:${t.col};"></div>
            <div class="tr-txt">
              <div class="tr-title">${t.name}</div>
              <div class="tr-artist">${t.artist}</div>
            </div>
          </div>
          <div class="tr-bpm">${t.bpm}</div>
          <div class="tr-key">${t.key}</div>
          <div class="tr-dur">${t.dur}</div>
          <div class="tr-acts">
            <button class="tr-btn" onclick="loadDeck('a','${t.id}')">A</button>
            <button class="tr-btn b" onclick="loadDeck('b','${t.id}')">B</button>
            <button class="tr-btn" onclick="quickSlot('${t.id}')">+</button>
          </div>
        </div>`).join('')}
    </div>`;
}

function buildLibs(filter=''){
  document.getElementById('sp-lib').innerHTML=libHTML(filter);
  document.getElementById('deck-lib').innerHTML=libHTML(filter);
}
buildLibs();

function filterLib(v){buildLibs(v);}
function crateActive(el){
  el.closest('.crates').querySelectorAll('.crate').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}
function startDrag(ev,id){dragging=id;ev.dataTransfer.setData('track-id',id);}

// ═══════════════════════════════════════════════════════
// GUESTS
// ═══════════════════════════════════════════════════════
document.getElementById('glist').innerHTML=GUESTS.map(g=>`
  <div class="gitem">
    <div class="gemoji">${g.e}</div>
    <div class="gname">${g.n}</div>
    <div class="gdist">${g.d}</div>
    <span class="gbadge ${g.s}">${g.s==='here'?'HERE':'COMING'}</span>
  </div>`).join('');

// ═══════════════════════════════════════════════════════
// SLOTS
// ═══════════════════════════════════════════════════════
function buildSlots(){
  const el=document.getElementById('slots-col');
  el.innerHTML=slots.map((s,i)=>`
    <div class="slot ${s?'filled':''} ${activeSlot===i?'sel':''}"
      id="slot-${i}" ondragover="event.preventDefault()"
      ondrop="dropSlot(event,${i})" onclick="selSlot(${i})">
      <div class="slot-dot" style="${s?`background:${s.col};`:''}"></div>
      <div class="slot-info">
        <div class="slot-n">Track ${i+1}</div>
        <div class="slot-t" style="${s?`color:${s.col};`:'color:var(--muted);'}">
          ${s?s.track.name:'— drop track —'}
        </div>
      </div>
      ${s?`<div class="slot-x" onclick="event.stopPropagation();clearSlot(${i})">×</div>`:''}
    </div>`).join('');
}
buildSlots();
function selSlot(i){activeSlot=i;buildSlots();}
function clearSlot(i){slots[i]=null;if(activeSlot===i)activeSlot=null;buildSlots();}
function quickSlot(id){
  const t=TRACKS.find(t=>t.id===id);if(!t)return;
  const i=activeSlot!==null?activeSlot:slots.findIndex(s=>!s);
  if(i<0)return;
  slots[i]={track:t,col:t.col};buildSlots();
  rippleBurst(sg.width/2,sg.height/2,2);
}
function dropSlot(ev,i){
  ev.preventDefault();
  const id=ev.dataTransfer.getData('track-id')||dragging;
  if(!id)return;
  const t=TRACKS.find(t=>t.id===id);if(!t)return;
  slots[i]={track:t,col:t.col};activeSlot=i;buildSlots();
  rippleBurst(sg.width/2,sg.height/2,2);
}

// ═══════════════════════════════════════════════════════
// DECKS
// ═══════════════════════════════════════════════════════
function loadDeck(d,id){
  const t=TRACKS.find(t=>t.id===id);if(!t)return;
  if(d==='a'){
    deckA={...deckA,track:t,bpm:t.bpm,playing:true};
    document.getElementById('da-name').textContent=t.name;
    document.getElementById('da-artist').textContent=t.artist;
    document.getElementById('da-bpm').textContent=t.bpm;
    document.getElementById('da-play').textContent='⏸';
    document.getElementById('tb-bpm').textContent=t.bpm;
  } else {
    deckB={...deckB,track:t,bpm:t.bpm,playing:true};
    document.getElementById('db-name').textContent=t.name;
    document.getElementById('db-artist').textContent=t.artist;
    document.getElementById('db-bpm').textContent=t.bpm;
    document.getElementById('db-play').textContent='⏸';
  }
  buildLibs();
  rippleBurst(sg.width/2,sg.height/2,2);
}
function dropDeck(ev,d){
  ev.preventDefault();
  const id=ev.dataTransfer.getData('track-id')||dragging;
  if(id)loadDeck(d,id);
}
function toggleDeck(d){
  if(d==='a'){deckA.playing=!deckA.playing;document.getElementById('da-play').textContent=deckA.playing?'⏸':'▶';}
  else{deckB.playing=!deckB.playing;document.getElementById('db-play').textContent=deckB.playing?'⏸':'▶';}
}
function syncBPM(){
  if(!deckA.track||!deckB.track)return;
  deckB.bpm=deckA.bpm;
  document.getElementById('db-bpm').textContent=deckA.bpm;
}

// ═══════════════════════════════════════════════════════
// SPATIAL GRID — RADAR
// ═══════════════════════════════════════════════════════
const sg=document.getElementById('sg');
const ctx=sg.getContext('2d');
function resizeSG(){
  const wrap=sg.parentElement;
  const s=Math.min(wrap.clientWidth-16,wrap.clientHeight-10);
  sg.width=sg.height=s;
  sg.style.width=sg.style.height=s+'px';
}
resizeSG();
window.addEventListener('resize',resizeSG);

function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lCol(lx,ly){
  const f=slots.filter(Boolean);if(!f.length)return'#f0ebe0';
  if(gridMode==='zone'){
    const d=Math.sqrt(lx*lx+ly*ly);
    if(d<.22)return f[0]?.col||'#f0ebe0';
    const a=Math.atan2(ly,lx)*180/Math.PI;
    if(a>=-45&&a<45)  return f[1%f.length]?.col||'#f0ebe0';
    if(a>=45 &&a<135) return f[2%f.length]?.col||'#f0ebe0';
    if(a>=135||a<-135)return f[3%f.length]?.col||'#f0ebe0';
    return f[4%f.length]?.col||'#f0ebe0';
  }
  if(gridMode==='cluster'){const qi=Math.floor((Math.atan2(ly,lx)+Math.PI)/(Math.PI*2)*f.length);return f[qi%f.length]?.col||'#f0ebe0';}
  if(gridMode==='orbit'){const b=Math.floor(((Math.atan2(ly,lx)+Math.PI)/(Math.PI*2))*f.length);return f[b%f.length]?.col||'#f0ebe0';}
  return'#f0ebe0';
}
function rippleBurst(x,y,n=2){for(let i=0;i<n;i++)ripples.push({x,y,r:6+i*5,a:.85-.15*i,col:'#f57e20'});}

function drawSG(){
  const W=sg.width,H=sg.height;if(!W||!H)return;
  const cx=W/2,cy=H/2,R=W/2-4;
  const t=frame*.016;
  ctx.fillStyle='#030201';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  const f=slots.filter(Boolean);

  // Zone fills
  if(gridMode==='zone'&&f.length){
    [[-Math.PI/4,Math.PI/4],[Math.PI/4,3*Math.PI/4],[3*Math.PI/4,5*Math.PI/4],[-3*Math.PI/4,-Math.PI/4]].forEach(([a0,a1],i)=>{
      const s=f[(i+1)%f.length];if(!s)return;
      const[r,g,b]=hex2rgb(s.col);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
      ctx.fillStyle=`rgba(${r},${g},${b},.1)`;ctx.fill();
    });
    if(f[0]){const[r,g,b]=hex2rgb(f[0].col);ctx.beginPath();ctx.arc(cx,cy,R*.22,0,Math.PI*2);ctx.fillStyle=`rgba(${r},${g},${b},.16)`;ctx.fill();}
  }
  if(gridMode==='cluster'&&f.length){
    f.forEach((s,i)=>{
      const a=(i/f.length)*Math.PI*2-Math.PI/2;
      const bx=cx+Math.cos(a)*R*.52,by=cy+Math.sin(a)*R*.52;
      const[r,g,b]=hex2rgb(s.col);
      const gr=ctx.createRadialGradient(bx,by,0,bx,by,R*.38);
      gr.addColorStop(0,`rgba(${r},${g},${b},.22)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.beginPath();ctx.arc(bx,by,R*.38,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
    });
  }
  if(gridMode==='orbit'&&f.length){
    f.forEach((s,i)=>{
      const a0=orbitAng+(i/f.length)*Math.PI*2,a1=a0+(Math.PI*2/f.length)*.8;
      const[r,g,b]=hex2rgb(s.col);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
      ctx.fillStyle=`rgba(${r},${g},${b},.09)`;ctx.fill();
    });
    orbitAng+=.0035;
  }

  // RADAR RINGS
  for(let i=1;i<=5;i++){
    const rf=i/5,glow=.04+.018*Math.sin(t*1.4-i*.6);
    ctx.beginPath();ctx.arc(cx,cy,R*rf,0,Math.PI*2);
    ctx.strokeStyle=`rgba(0,255,136,${glow})`;ctx.lineWidth=.8;ctx.stroke();
    if(i<5){
      ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.font="400 7px 'DM Mono'";
      ctx.fillStyle='rgba(0,255,136,.14)';
      ctx.fillText(Math.round(rf*500)+'m',cx+R*rf+3,cy);
    }
  }
  // Bearing lines
  [0,45,90,135,180,225,270,315].forEach((deg,i)=>{
    const rad=deg*Math.PI/180,inner=i%2===0?0:R*.22;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(rad)*inner,cy+Math.sin(rad)*inner);
    ctx.lineTo(cx+Math.cos(rad)*R,cy+Math.sin(rad)*R);
    ctx.strokeStyle=i%2===0?'rgba(0,255,136,.07)':'rgba(0,255,136,.04)';
    ctx.lineWidth=.6;ctx.stroke();
  });
  // Cardinal labels
  [{l:'N',a:-Math.PI/2},{l:'E',a:0},{l:'S',a:Math.PI/2},{l:'W',a:Math.PI}].forEach(({l,a})=>{
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font="900 9px 'Barlow Condensed'";
    ctx.fillStyle='rgba(0,255,136,.2)';
    ctx.fillText(l,cx+Math.cos(a)*(R*.84),cy+Math.sin(a)*(R*.84));
  });
  // Zone dividers
  if(gridMode==='zone'){
    ctx.strokeStyle='rgba(0,255,136,.05)';ctx.lineWidth=.6;
    [-45,45,135,225].forEach(deg=>{
      const rad=deg*Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(rad)*R*.22,cy+Math.sin(rad)*R*.22);
      ctx.lineTo(cx+Math.cos(rad)*R,cy+Math.sin(rad)*R);ctx.stroke();
    });
  }

  // RADAR SWEEP
  radarAngle=(radarAngle+.011)%(Math.PI*2);
  ctx.save();
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,R,radarAngle-.65,radarAngle);ctx.closePath();
  const sg2=ctx.createLinearGradient(
    cx+Math.cos(radarAngle-.65)*R*.5,cy+Math.sin(radarAngle-.65)*R*.5,
    cx+Math.cos(radarAngle)*R,cy+Math.sin(radarAngle)*R
  );
  sg2.addColorStop(0,'rgba(0,255,136,0)');sg2.addColorStop(1,'rgba(0,255,136,.16)');
  ctx.fillStyle=sg2;ctx.fill();ctx.restore();
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(radarAngle)*R,cy+Math.sin(radarAngle)*R);
  ctx.strokeStyle='rgba(0,255,136,.5)';ctx.lineWidth=1.2;ctx.stroke();

  // LISTENERS
  listeners.forEach(l=>{
    l.x+=l.vx;l.y+=l.vy;
    const d2=Math.sqrt(l.x*l.x+l.y*l.y);
    if(d2>.92){l.vx*=-.65;l.vy*=-.65;}
    l.col=lCol(l.x,l.y);
    const px=cx+l.x*R,py=cy+l.y*R;
    const[r,g,b]=hex2rgb(l.col);
    const lAng=((Math.atan2(l.y,l.x)+Math.PI*2)%(Math.PI*2));
    const ping=Math.abs(((radarAngle-lAng+Math.PI*2)%(Math.PI*2)))<.08;
    ctx.beginPath();ctx.arc(px,py,ping?13:6,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${ping?.22:.07})`;ctx.fill();
    ctx.beginPath();ctx.arc(px,py,ping?3.5:2.2,0,Math.PI*2);
    ctx.fillStyle=ping?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},.85)`;ctx.fill();
    if(ping&&l.name){
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.font="700 8px 'Barlow Condensed'";
      ctx.fillStyle=`rgba(${r},${g},${b},.9)`;
      ctx.fillText(l.name,px,py-7);
    }
  });

  // Zone labels
  if(gridMode==='zone'){
    [{x:0,y:0,i:0},{x:0,y:-.58,i:1},{x:.58,y:0,i:2},{x:0,y:.58,i:3},{x:-.58,y:0,i:4}].forEach(({x,y,i})=>{
      const s=slots[i];if(!s)return;
      const px=cx+x*R,py=cy+y*R;
      const[r,g,b]=hex2rgb(s.col);
      ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.fillStyle=`rgba(${r},${g},${b},.18)`;ctx.fill();
      ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle=s.col;ctx.fill();
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font="700 8px 'Barlow Condensed'";
      ctx.fillStyle='rgba(240,235,224,.5)';
      ctx.fillText(s.track.name.slice(0,7).toUpperCase(),px,py+17);
    });
  }
  if(gridMode==='orbit'&&f.length){
    const ox=cx+Math.cos(orbitAng)*R*.65,oy=cy+Math.sin(orbitAng)*R*.65;
    const[r,g,b]=hex2rgb(f[0].col);
    ctx.beginPath();ctx.arc(ox,oy,9,0,Math.PI*2);ctx.fillStyle=`rgba(${r},${g},${b},.18)`;ctx.fill();
    ctx.beginPath();ctx.arc(ox,oy,4,0,Math.PI*2);ctx.fillStyle=f[0].col;ctx.fill();
  }

  // DJ center
  const p3=.55+.45*Math.sin(t*3.8);
  ctx.beginPath();ctx.arc(cx,cy,11*p3,0,Math.PI*2);ctx.fillStyle=`rgba(245,126,32,${.14*p3})`;ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='#f57e20';ctx.fill();

  // Ripples
  ripples=ripples.filter(rp=>rp.a>.01);
  ripples.forEach(rp=>{
    rp.r+=4;rp.a*=.87;
    const[r,g,b]=hex2rgb(rp.col||'#f57e20');
    ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${r},${g},${b},${rp.a})`;ctx.lineWidth=2;ctx.stroke();
  });
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(0,255,136,.07)';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R+2,0,Math.PI*2);
  ctx.strokeStyle='rgba(245,126,32,.05)';ctx.lineWidth=1;ctx.stroke();
}

// ═══════════════════════════════════════════════════════
// TURNTABLE WHEELS
// ═══════════════════════════════════════════════════════
function drawWheel(id,deck,color){
  const cv=document.getElementById(id);if(!cv)return;
  const k=cv.getContext('2d');
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=W/2-3;
  k.clearRect(0,0,W,H);
  k.beginPath();k.arc(cx,cy,R,0,Math.PI*2);k.fillStyle='#0a0804';k.fill();
  // Grooves
  for(let i=0;i<6;i++){k.beginPath();k.arc(cx,cy,R*.28+i*(R*.65/6),0,Math.PI*2);k.strokeStyle='rgba(255,255,255,.04)';k.lineWidth=.8;k.stroke();}
  // Strobe dots
  if(deck.playing)deck.angle+=deck.bpm>0?(deck.bpm/60)*.05:.03;
  for(let i=0;i<12;i++){
    const a=deck.angle+(i/12)*Math.PI*2;
    const dx=cx+Math.cos(a)*R*.72,dy=cy+Math.sin(a)*R*.72;
    k.beginPath();k.arc(dx,dy,2,0,Math.PI*2);k.fillStyle='rgba(255,255,255,.22)';k.fill();
  }
  // Color ring
  k.beginPath();k.arc(cx,cy,R*.44,0,Math.PI*2);
  k.strokeStyle=color;k.lineWidth=2.5;k.globalAlpha=deck.playing?.65:.2;k.stroke();k.globalAlpha=1;
  // Center
  k.beginPath();k.arc(cx,cy,R*.26,0,Math.PI*2);
  const[r,g,b]=hex2rgb(color);k.fillStyle=`rgba(${r},${g},${b},.1)`;k.fill();
  k.textAlign='center';k.textBaseline='middle';
  k.font="900 7px 'Barlow Condensed'";k.fillStyle=color;
  k.fillText(deck.track?deck.track.name.slice(0,6).toUpperCase():'LOAD',cx,cy);
  // Rim
  k.beginPath();k.arc(cx,cy,R,0,Math.PI*2);k.strokeStyle='rgba(255,255,255,.07)';k.lineWidth=1;k.stroke();
  // Needle
  const na=deck.angle*.3-Math.PI*.15;
  k.beginPath();k.moveTo(cx+Math.cos(na)*R*.14,cy+Math.sin(na)*R*.14);
  k.lineTo(cx+Math.cos(na)*R*.98,cy+Math.sin(na)*R*.98);
  k.strokeStyle='rgba(255,255,255,.15)';k.lineWidth=1;k.stroke();
}

['wheel-a','wheel-b'].forEach(id=>{
  const cv=document.getElementById(id);if(!cv)return;
  const deck=id==='wheel-a'?deckA:deckB;
  let dr=false,ly=0;
  cv.addEventListener('mousedown',e=>{dr=true;ly=e.clientY;e.preventDefault();});
  cv.addEventListener('mousemove',e=>{if(!dr)return;deck.angle+=(e.clientY-ly)*.05;ly=e.clientY;});
  cv.addEventListener('mouseup',()=>dr=false);
  cv.addEventListener('touchstart',e=>{e.preventDefault();dr=true;ly=e.touches[0].clientY;},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();if(!dr)return;deck.angle+=(e.touches[0].clientY-ly)*.05;ly=e.touches[0].clientY;},{passive:false});
  cv.addEventListener('touchend',()=>dr=false);
});

// ═══════════════════════════════════════════════════════
// MINI WAVEFORMS
// ═══════════════════════════════════════════════════════
function drawMiniWave(id,deck,color){
  const cv=document.getElementById(id);if(!cv)return;
  const k=cv.getContext('2d');
  const W=cv.clientWidth||200,H=cv.clientHeight||36;
  cv.width=W*2;cv.height=H*2;
  k.fillStyle='#060402';k.fillRect(0,0,W*2,H*2);
  if(!deck.track)return;
  const t=Date.now()/1000,bpm=deck.bpm||124,beatS=60/bpm,mid=H;
  k.strokeStyle=color;k.lineWidth=1.5;k.globalAlpha=deck.playing?.82:.28;
  [1,-1].forEach(side=>{
    k.beginPath();
    for(let x=0;x<W*2;x++){
      const xT=t+(x-W)/(W)*3;
      const b=Math.sin(xT*(2*Math.PI/beatS));
      const amp=(Math.abs(b)+Math.sin(xT*4.2+1.1)*.28+Math.sin(xT*8.7+.5)*.14)*(H*.75);
      if(x===0)k.moveTo(x,mid+side*amp);else k.lineTo(x,mid+side*amp);
    }
    k.stroke();
  });
  k.globalAlpha=1;
  k.strokeStyle='rgba(255,255,255,.08)';k.lineWidth=1;
  for(let b=0;b<20;b++){
    const bx=((b-10)*beatS/3*W*2+W)%(W*2);
    k.beginPath();k.moveTo(bx,0);k.lineTo(bx,H*2);k.stroke();
  }
}

// ═══════════════════════════════════════════════════════
// EQ POPUP
// ═══════════════════════════════════════════════════════
const EQ_BANDS=[{id:'eq-hi',label:'HI',val:75},{id:'eq-mid',label:'MID',val:75},{id:'eq-low',label:'LOW',val:75},{id:'eq-vol',label:'VOL',val:80}];
const eqVals={};

function buildEQ(){
  const row=document.getElementById('eq-row');
  row.innerHTML=EQ_BANDS.map(b=>`
    <div class="eq-col">
      <canvas id="${b.id}" width="44" height="44" style="cursor:ns-resize;"></canvas>
      <div class="eq-label">${b.label}</div>
      <div class="eq-val" id="${b.id}-v">0</div>
    </div>`).join('');
  EQ_BANDS.forEach(b=>{
    eqVals[b.id]=b.val;
    drawEQKnob(b.id,b.val);
    const cv=document.getElementById(b.id);if(!cv)return;
    let v=b.val,sy=0,sv=0;
    const move=cy2=>{v=Math.max(0,Math.min(100,sv+(sy-cy2)/1.5));eqVals[b.id]=v;drawEQKnob(b.id,v);};
    cv.addEventListener('mousedown',e=>{sy=e.clientY;sv=v;const mm=e2=>move(e2.clientY);const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);e.preventDefault();});
    cv.addEventListener('touchstart',e=>{e.preventDefault();sy=e.touches[0].clientY;sv=v;},{passive:false});
    cv.addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0].clientY);},{passive:false});
  });
}
function drawEQKnob(id,val){
  const cv=document.getElementById(id);if(!cv)return;
  const k=cv.getContext('2d');
  const W=44,H=44,cx=22,cy=22,r=18,sw=5;
  k.clearRect(0,0,W,H);
  const minA=-140*Math.PI/180-Math.PI/2,maxA=140*Math.PI/180-Math.PI/2;
  const a=minA+(val/100)*(maxA-minA);
  const ix=cx+r*Math.cos(a),iy=cy+r*Math.sin(a);
  k.beginPath();k.arc(cx,cy,r,minA,maxA);k.strokeStyle='#1a1208';k.lineWidth=sw;k.lineCap='round';k.stroke();
  k.beginPath();k.arc(cx,cy,r,minA,a);k.strokeStyle='#f57e20';k.lineWidth=sw;k.lineCap='round';k.stroke();
  k.beginPath();k.arc(cx,cy,r-sw-1,0,Math.PI*2);k.fillStyle='#0c0804';k.fill();
  k.beginPath();k.moveTo(cx,cy);k.lineTo(ix,iy);k.strokeStyle='#f57e20';k.lineWidth=2;k.lineCap='round';k.stroke();
  const db=Math.round((val-75)/75*12);
  const el=document.getElementById(id+'-v');
  if(el)el.textContent=(db>=0?'+':'')+db;
}
buildEQ();

function toggleEQ(){
  document.getElementById('eq-popup').classList.toggle('open');
}

// VU METER
// ═══════════════════════════════════════════════════════
let vuV=50,vuDir=1;
setInterval(()=>{
  vuV+=vuDir*(2+Math.random()*5);
  if(vuV>88||vuV<12)vuDir*=-1;
  vuV=Math.max(12,Math.min(90,vuV));
  const el=document.getElementById('vu-fill');
  if(el)el.style.height=vuV+'%';
},90);

// ═══════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════
function switchPanel(p,btn){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById('panel-'+p)?.classList.add('active');
  document.querySelectorAll('.rnbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  setTimeout(resizeSG,60);
}
function setMode(m,btn){
  gridMode=m;
  document.querySelectorAll('.mbutton').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function doScatter(){
  const cx=sg.width/2,cy=sg.height/2;
  for(let i=0;i<4;i++)setTimeout(()=>rippleBurst(cx,cy,2),i*140);
  listeners.forEach(l=>{l.vx+=(Math.random()-.5)*.05;l.vy+=(Math.random()-.5)*.05;});
}
function doSnap(){
  listeners.forEach(l=>{l.vx+=-l.x*.09;l.vy+=-l.y*.09;});
  rippleBurst(sg.width/2,sg.height/2,4);
}
function doDistribute(){
  const f=slots.filter(Boolean);
  f.forEach((s,i)=>{
    const a=(i/f.length)*Math.PI*2;
    const x=sg.width/2+Math.cos(a)*sg.width*.3;
    const y=sg.height/2+Math.sin(a)*sg.height*.3;
    setTimeout(()=>ripples.push({x,y,r:5,a:.9,col:s.col}),i*100);
  });
}
function toggleLive(){
  const b=document.getElementById('btn-live');
  b.classList.toggle('on');
  b.textContent=b.classList.contains('on')?'■ On Air':'⚡ Go Live';
}
function setLight(btn,col){
  document.querySelectorAll('.lbtn').forEach(b=>{b.classList.remove('on');b.style.background='';});
  btn.classList.add('on');
  if(col!=='strobe'&&col!=='pulse')btn.style.background=col+'22';
}
function onTouch(e){
  e.preventDefault();
  const t=e.touches[0],r=sg.getBoundingClientRect();
  rippleBurst(t.clientX-r.left,t.clientY-r.top,2);
}
function onMouse(e){
  const r=sg.getBoundingClientRect();
  rippleBurst(e.clientX-r.left,e.clientY-r.top,2);
}
function onDrop(e){
  e.preventDefault();
  const id=e.dataTransfer.getData('track-id')||dragging;
  if(!id)return;
  quickSlot(id);
  const r=sg.getBoundingClientRect();
  rippleBurst(e.clientX-r.left,e.clientY-r.top,3);
}

// Message targets
document.querySelectorAll('.mtbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mtbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
});

// Close EQ on outside click
document.addEventListener('click',e=>{
  const popup=document.getElementById('eq-popup');
  if(popup.classList.contains('open')&&!popup.contains(e.target)&&!e.target.closest('.rnbtn')){
    popup.classList.remove('open');
  }
});

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  frame++;
  if(sg.width>0)drawSG();
  drawWheel('wheel-a',deckA,'#f57e20');
  drawWheel('wheel-b',deckB,'#00cc99');
  drawMiniWave('mwv-a',deckA,'#f57e20');
  drawMiniWave('mwv-b',deckB,'#00cc99');
}
loop();
setTimeout(()=>{resizeSG();},200);
</script>
